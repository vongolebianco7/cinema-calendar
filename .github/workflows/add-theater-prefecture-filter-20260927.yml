name: Add theater prefecture filter

on:
  push:
    paths:
      - "scripts/add_theater_prefecture_filter_20260927.py"
      - ".github/workflows/add-theater-prefecture-filter-20260927.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare regression test
        run: python scripts/add_theater_prefecture_filter_20260927.py prepare-tests
      - name: Confirm RED before implementation
        run: |
          if python tests/test_theater_prefecture_filter.py; then
            echo "Expected prefecture-filter regression to fail before implementation." >&2
            exit 1
          fi
          echo "RED confirmed."
      - name: Apply prefecture filter
        run: python scripts/add_theater_prefecture_filter_20260927.py apply
      - name: Regenerate theater table JS
        run: python scripts/apply_theater_comparison_table_20260927.py apply
      - name: Re-apply persistent prefecture markup
        run: python scripts/add_theater_prefecture_filter_20260927.py apply
      - name: Verify prefecture filter
        run: python tests/test_theater_prefecture_filter.py
      - name: Verify filter consistency
        run: python tests/test_theater_filter_consistency.py
      - name: Verify comparison table
        run: python tests/test_theater_comparison_table.py
      - name: Verify theater equipment controls
        run: python tests/test_theater_equipment_explorer.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply_theater_comparison_table_20260927.py theaters.html tests/test_theater_prefecture_filter.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: filter theaters by prefecture"
          git pull --rebase origin main
          git push
