name: Apply Cinemap live header brand fix

on:
  push:
    paths:
      - "scripts/fix_brand_header_20260927.py"
      - ".github/workflows/apply-brand-header-fix-20260927.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace live shared header brand
        run: python scripts/fix_brand_header_20260927.py
      - name: Run brand regression tests
        run: python -m unittest discover -s tests -p 'test_brand_identity.py' -v
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys, tempfile
          failures=[]
          for html in sorted(Path('.').glob('*.html')):
              text=html.read_text(encoding='utf-8')
              for i,script in enumerate(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)):
                  if not script.strip(): continue
                  p=Path(tempfile.gettempdir())/f'{html.stem}-{i}.js'
                  p.write_text(script,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                  if r.returncode: failures.append(f'{html} #{i}\n{r.stderr}')
          if failures:
              print('\n'.join(failures)); sys.exit(1)
          print('Inline JavaScript syntax checks passed.')
          PY
      - name: Commit header fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html discover.html experience.html my-cinemap.html search.html rankings.html critic.html revivals.html theaters.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Replace legacy header image with approved Cinemap brand"
          git push
