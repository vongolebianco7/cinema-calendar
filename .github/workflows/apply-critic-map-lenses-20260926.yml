name: Apply Critic Map lenses 2026-09-26
on:
  push:
    paths:
      - 'scripts/apply_critic_map_lenses_20260926.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Critic Map interaction polish
        run: python scripts/apply_critic_map_lenses_20260926.py
      - name: Validate Critic Map JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          text=Path('critic.html').read_text(encoding='utf-8')
          failures=[]
          for i,script in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)):
              if not script.strip(): continue
              p=Path(tempfile.gettempdir())/f'critic-{i}.js'
              p.write_text(script,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode: failures.append(r.stderr)
          if failures:
              print('\n'.join(failures)); sys.exit(1)
          print('Critic Map JavaScript syntax checks passed.')
          PY
      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add critic.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Make Critic Map lenses interactive"
          git push
