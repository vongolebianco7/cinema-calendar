name: Apply Critic Map render TDZ fix

on:
  push:
    branches:
      - 'fix/critic-render-tdz'
    paths:
      - '.github/workflows/apply-critic-render-tdz.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/critic-render-tdz
      - name: Apply minimal TDZ fix
        run: python scripts/fix_critic_render_tdz.py
      - name: Run regression check
        run: python scripts/check_critic_render_tdz.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          text=Path('critic.html').read_text(encoding='utf-8')
          for i,script in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)):
              if not script.strip():
                  continue
              p=Path(tempfile.gettempdir())/f'critic-{i}.js'
              p.write_text(script,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  sys.exit(1)
          print('critic inline JavaScript syntax ok')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add critic.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Critic Map loading TDZ regression"
          git push origin HEAD:fix/critic-render-tdz
