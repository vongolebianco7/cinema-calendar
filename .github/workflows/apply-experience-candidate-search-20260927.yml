name: Improve experience movie candidate search
on:
  push:
    paths:
      - 'scripts/apply_experience_candidate_search_20260927.py'
      - '.github/workflows/apply-experience-candidate-search-20260927.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add failing regression test
        run: |
          cat > /tmp/test_experience_candidates.py <<'PY'
          from pathlib import Path
          s=Path('experience.html').read_text(encoding='utf-8')
          assert 'normalizeSearchText' in s, 'normalized title matching missing'
          assert 'candidateRank' in s, 'candidate relevance ranking missing'
          assert 'filmCandidatePoster' in s, 'candidate poster UI missing'
          assert 'data-candidate-more' in s and 'さらに見る' in s, 'show-more control missing'
          assert "q.slice(0,3)" in s, 'fallback broad search missing'
          PY
      - name: Confirm RED
        run: |
          if python /tmp/test_experience_candidates.py; then
            echo 'Expected regression test to fail before implementation'
            exit 1
          else
            echo 'RED confirmed'
          fi
      - name: Apply fix
        run: python scripts/apply_experience_candidate_search_20260927.py
      - name: Verify GREEN
        run: |
          python /tmp/test_experience_candidates.py
          python - <<'PY'
          from pathlib import Path
          s=Path('experience.html').read_text(encoding='utf-8')
          assert '<script id="experience-decision-js-v2">' in s
          assert '<style id="experience-candidate-search-v2">' in s
          assert 'experience-decision-js-v1' not in s
          print('candidate search regression checks passed')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experience.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'feat: improve screening format movie search'
            git push
          fi
