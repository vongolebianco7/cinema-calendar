name: Apply experience Dolby label links

on:
  push:
    paths:
      - 'tests/test_experience_dolby_label_links.py'
      - 'scripts/apply_experience_dolby_label_links_20260927.py'
      - '.github/workflows/apply-experience-dolby-label-links-20260927.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify regression fails before fix
        run: |
          if python tests/test_experience_dolby_label_links.py; then
            echo 'Regression unexpectedly already passes'
            exit 1
          fi
      - name: Apply patch
        run: python scripts/apply_experience_dolby_label_links_20260927.py
      - name: Run regression test
        run: python tests/test_experience_dolby_label_links.py
      - name: Run existing experience tests
        run: |
          python tests/test_experience_mobile_tabs.py
          if [ -f tests/test_experience_standard_audio_label.py ]; then python tests/test_experience_standard_audio_label.py; fi
      - name: Commit production change
        run: |
          if git diff --quiet -- experience.html; then
            echo 'No production change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experience.html
          git commit -m 'Clarify Dolby Atmos and Dolby Cinema audio options'
          git push
