name: Apply experience instant candidate select
on:
  push:
    branches: [main]
    paths:
      - scripts/apply_experience_instant_select_20260927.py
      - .github/workflows/apply-experience-instant-select-20260927.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply instant candidate selection
        run: python scripts/apply_experience_instant_select_20260927.py
      - name: Run focused regression test
        run: python tests/test_experience_instant_candidate_select.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experience.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: select screening recommendation on candidate tap"
          git push
