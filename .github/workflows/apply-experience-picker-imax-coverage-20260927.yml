name: Apply experience picker and IMAX coverage
on:
  push:
    paths:
      - 'scripts/apply_experience_picker_imax_coverage_20260927.py'
      - 'tests/test_experience_imax_coverage.py'
      - '.github/workflows/apply-experience-picker-imax-coverage-20260927.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify regression fails before fix
        run: |
          if python -m unittest tests.test_experience_imax_coverage; then
            echo 'Expected experience/IMAX regression to fail before patch' >&2
            exit 1
          fi
      - name: Apply patch
        run: python scripts/apply_experience_picker_imax_coverage_20260927.py
      - name: Run regression tests
        run: |
          python -m unittest tests.test_experience_imax_coverage
          python -m unittest tests.test_brand_identity
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for page in ('experience.html','theaters.html'):
              text=Path(page).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S)
              for s in scripts:
                  if not s.strip(): continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                      f.write(s); name=f.name
                  subprocess.run(['node','--check',name],check=True)
          PY
      - name: Commit production changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/theater_formats.json theaters.html experience.html
          git commit -m 'Improve screening format guide and IMAX theater coverage'
          git pull --rebase origin main
          git push
