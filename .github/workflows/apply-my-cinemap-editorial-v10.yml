name: Apply My Cinemap editorial v10

on:
  push:
    branches:
      - fix/my-cinemap-five-editorial-themes
    paths:
      - "scripts/apply_my_cinemap_editorial_v10.py"
      - ".github/workflows/apply-my-cinemap-editorial-v10.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/my-cinemap-five-editorial-themes
      - name: Apply My Cinemap editorial v10
        run: python scripts/apply_my_cinemap_editorial_v10.py
      - name: Check JavaScript syntax
        run: node --check js/my-cinemap-art.js
      - name: Check My Cinemap regression test
        run: python tests/test_my_cinemap_three_column_export.py
      - name: Commit generated files
        run: |
          if git diff --quiet -- my-cinemap.html js/my-cinemap-art.js; then
            echo "No generated changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my-cinemap.html js/my-cinemap-art.js
          git commit -m "feat: add five editorial My Cinemap themes"
          git push origin HEAD:fix/my-cinemap-five-editorial-themes
