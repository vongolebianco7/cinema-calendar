name: Apply My Cinemap editorial v9

on:
  push:
    branches:
      - fix/my-cinemap-editorial-layouts
    paths:
      - "scripts/apply_my_cinemap_editorial_v9.py"
      - ".github/workflows/apply-my-cinemap-editorial-v9.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/my-cinemap-editorial-layouts
      - name: Apply My Cinemap UI patch
        run: python scripts/apply_my_cinemap_editorial_v9.py
      - name: Commit generated page
        run: |
          if git diff --quiet -- my-cinemap.html; then
            echo "No My Cinemap page changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my-cinemap.html
          git commit -m "feat: apply My Cinemap editorial layout controls"
          git push origin HEAD:fix/my-cinemap-editorial-layouts
