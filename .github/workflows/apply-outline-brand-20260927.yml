name: Apply approved Cinemap Outline Tile brand

on:
  push:
    paths:
      - "scripts/apply_outline_brand_20260927.py"
      - ".github/workflows/apply-outline-brand-20260927.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply approved Outline Tile brand
        run: python scripts/apply_outline_brand_20260927.py
      - name: Run brand regression tests
        run: python -m unittest discover -s tests -p 'test_brand_identity.py' -v
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys, tempfile
          failures=[]
          for html in sorted(Path('.').glob('*.html')):
              text=html.read_text(encoding='utf-8')
              for i,script in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)):
                  if not script.strip():
                      continue
                  p=Path(tempfile.gettempdir())/f'{html.stem}-outline-brand-{i}.js'
                  p.write_text(script,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                  if r.returncode:
                      failures.append(f'{html} script #{i}:\n{r.stderr}')
          if failures:
              print('\n\n'.join(failures));sys.exit(1)
          print('All inline JavaScript syntax checks passed.')
          PY
      - name: Commit brand update
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html discover.html experience.html my-cinemap.html search.html rankings.html critic.html revivals.html theaters.html favicon.svg apple-touch-icon.png icon-192.png icon-512.png
          git commit -m "Apply approved Cinemap Outline Tile brand"
          git push
