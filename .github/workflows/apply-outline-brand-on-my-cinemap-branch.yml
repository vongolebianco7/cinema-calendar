name: Apply latest Outline Tile brand on My Cinemap branch

on:
  push:
    branches:
      - fix/my-cinemap-editorial-layouts
    paths:
      - ".github/workflows/apply-outline-brand-on-my-cinemap-branch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/my-cinemap-editorial-layouts
      - name: Apply approved latest Cinemap brand
        run: python scripts/apply_outline_brand_20260927.py
      - name: Commit generated brand assets and pages
        run: |
          if git diff --quiet; then
            echo "No brand changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html discover.html experience.html my-cinemap.html search.html rankings.html critic.html revivals.html theaters.html favicon.svg apple-touch-icon.png icon-192.png icon-512.png
          git commit -m "refine: apply latest Cinemap Outline Tile brand"
          git push origin HEAD:fix/my-cinemap-editorial-layouts
