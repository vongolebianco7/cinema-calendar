name: Apply person profile and three-column search

on:
  push:
    paths:
      - "scripts/apply_person_profile_three_column_20260927.py"
      - ".github/workflows/apply-person-profile-three-column-20260927.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare regression test
        run: python scripts/apply_person_profile_three_column_20260927.py prepare-tests

      - name: Confirm RED before implementation
        run: |
          if python tests/test_person_profile_three_column.py; then
            echo "Expected the new test to fail before implementation." >&2
            exit 1
          fi
          echo "RED confirmed."

      - name: Apply person profile and three-column layout
        run: python scripts/apply_person_profile_three_column_20260927.py apply

      - name: Verify targeted regression test
        run: python tests/test_person_profile_three_column.py

      - name: Run discover people explorer regression
        run: |
          if [ -f tests/test_discover_people_explorer.py ]; then
            python tests/test_discover_people_explorer.py
          fi

      - name: Run existing Python regression suite
        run: |
          failed=0
          for t in tests/test_*.py; do
            echo "==> $t"
            python "$t" || failed=1
          done
          exit "$failed"

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discover.html tests/test_person_profile_three_column.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add person profile and vertical three-column search"
          git push
