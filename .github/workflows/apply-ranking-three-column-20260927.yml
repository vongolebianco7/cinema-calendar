name: Apply ranking three-column grid

on:
  push:
    paths:
      - "scripts/apply_ranking_three_column_20260927.py"
      - ".github/workflows/apply-ranking-three-column-20260927.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare ranking regression tests
        run: python scripts/apply_ranking_three_column_20260927.py prepare-tests

      - name: Confirm RED before implementation
        run: |
          if python tests/test_rankings_three_column_grid.py; then
            echo "Expected the new ranking grid test to fail before implementation." >&2
            exit 1
          fi
          echo "RED confirmed."

      - name: Apply three-column ranking layout
        run: python scripts/apply_ranking_three_column_20260927.py apply

      - name: Verify ranking regression test
        run: python tests/test_rankings_three_column_grid.py

      - name: Run Python regression suite
        run: |
          for t in tests/test_*.py; do
            echo "==> $t"
            python "$t"
          done

      - name: Run movie information regression test
        run: |
          if [ -f tests/test_movie_information.cjs ]; then
            node tests/test_movie_information.cjs
          fi

      - name: Commit ranking layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rankings.html tests/test_mobile_movie_rails.py tests/test_rankings_three_column_grid.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: unify ranking results into three-column grid"
          git push
