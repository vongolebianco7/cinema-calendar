name: Apply screening recommendation v2

on:
  push:
    branches:
      - design/screening-recommendation-v2
    paths:
      - scripts/apply_screening_v2.py
      - .github/workflows/apply-screening-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/screening-recommendation-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_screening_v2.py
      - name: Remove one-shot patcher
        run: rm scripts/apply_screening_v2.py .github/workflows/apply-screening-v2.yml
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement evidence-backed screening recommendations"
          git push origin HEAD:design/screening-recommendation-v2
