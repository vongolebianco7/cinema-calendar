name: Apply screening v4
on:
  push:
    branches: [feat/screening-recommendation-v4]
    paths: ['scripts/apply_screening_v4.py']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/screening-recommendation-v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/apply_screening_v4.py
      - run: python scripts/check_screening_v4.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add search.html
          git diff --cached --quiet || git commit -m 'fix: make native IMAX decisive and clarify format UI'
          git push
