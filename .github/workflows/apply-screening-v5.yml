name: Apply screening v5
on:
  push:
    branches: ['fix/screening-wording-v5']
    paths:
      - 'scripts/apply_screening_v5.py'
      - '.github/workflows/apply-screening-v5.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/screening-wording-v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/apply_screening_v5.py
      - run: python scripts/check_screening_wording_v5.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add search.html
          git commit -m 'fix: make screening recommendations safer and format-aware'
          git push origin HEAD:fix/screening-wording-v5
