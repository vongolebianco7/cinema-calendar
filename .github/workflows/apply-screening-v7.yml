name: Apply screening v7
on:
  push:
    branches: ['feat/screening-model-v7']
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/screening-model-v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/apply_screening_v7.py
      - run: node scripts/check_screening_v7.js
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html search.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: integrate screening model v7'
          git push
