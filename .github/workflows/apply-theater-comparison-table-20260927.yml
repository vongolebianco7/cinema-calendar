name: Apply theater comparison table

on:
  push:
    paths:
      - "scripts/apply_theater_comparison_table_20260927.py"
      - ".github/workflows/apply-theater-comparison-table-20260927.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare comparison table regression test
        run: python scripts/apply_theater_comparison_table_20260927.py prepare-tests
      - name: Confirm RED before implementation
        run: |
          if python tests/test_theater_comparison_table.py; then
            echo "Expected comparison-table regression to fail before implementation." >&2
            exit 1
          fi
          echo "RED confirmed."
      - name: Apply comparison table
        run: python scripts/apply_theater_comparison_table_20260927.py apply
      - name: Verify comparison table
        run: python tests/test_theater_comparison_table.py
      - name: Verify existing theater equipment controls
        run: python tests/test_theater_equipment_explorer.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theaters.html tests/test_theater_comparison_table.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: show store-specific theaters in comparison table"
          git pull --rebase origin main
          git push
