name: Apply theater equipment explorer

on:
  push:
    paths:
      - "scripts/apply_theater_equipment_explorer_20260927.py"
      - ".github/workflows/apply-theater-equipment-explorer-20260927.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare theater equipment regression test
        run: python scripts/apply_theater_equipment_explorer_20260927.py prepare-tests
      - name: Confirm RED before implementation
        run: |
          if python tests/test_theater_equipment_explorer.py; then
            echo "Expected theater equipment test to fail before implementation." >&2
            exit 1
          fi
          echo "RED confirmed."
      - name: Apply theater equipment explorer
        run: python scripts/apply_theater_equipment_explorer_20260927.py apply
      - name: Verify theater equipment explorer
        run: python tests/test_theater_equipment_explorer.py
      - name: Verify official theater links regression
        run: python tests/test_official_theater_links_only.py
      - name: Run Python regression suite and report unrelated failures
        run: |
          failed=0
          for t in tests/test_*.py; do
            echo "==> $t"
            python "$t" || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more unrelated regression tests are currently failing; target theater tests above passed."
          fi
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theaters.html tests/test_theater_equipment_explorer.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: show theater formats and screen equipment"
          git push
