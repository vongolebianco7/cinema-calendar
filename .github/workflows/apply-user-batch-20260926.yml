name: Apply user batch 2026-09-26
on:
  push:
    paths:
      - 'scripts/apply_user_batch_20260926.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply requested UI/data fixes
        run: python scripts/apply_user_batch_20260926.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html discover.html rankings.html my-cinemap.html experience.html critic.html search.html data/boxoffice.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Apply ranking calendar My Cinemap and core UX fixes"
          git push
