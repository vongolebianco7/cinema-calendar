name: Audit source freshness (read only)
on:
  workflow_dispatch:
  schedule:
    - cron: '41 19 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run source health contract tests
        run: python -m unittest discover -s tests -p 'test_audit_source_health.py'
      - name: Evaluate observed source age
        run: python scripts/audit_source_health.py --output artifacts/source-health.json
      - name: Publish diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health
          path: artifacts/source-health.json
          retention-days: 7
          if-no-files-found: warn
