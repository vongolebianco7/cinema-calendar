name: Autonomous quality gate

on:
  pull_request:
    paths-ignore:
      - 'preview/ocean/renderer/dist/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Deterministic checks (no AI)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run shared quality gate
        run: python scripts/quality_gate.py

  mobile-smoke:
    name: iPhone-size smoke test (Chromium + WebKit, no AI)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install temporary Playwright dependency
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Start static server
        run: python3 -m http.server 4173 >/tmp/cinemap-http.log 2>&1 &
      - name: Run mobile checks in Chromium
        run: CINEMAP_BROWSER=chromium node scripts/mobile_smoke.mjs
      - name: Run mobile checks in WebKit
        run: CINEMAP_BROWSER=webkit node scripts/mobile_smoke.mjs
      - name: Run Ocean record/grow/reload persistence check
        run: node scripts/ocean_persistence_smoke.mjs
      - name: Run Ocean iPhone visual gate
        run: node scripts/ocean_visual_smoke.mjs
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-smoke-screenshots
          path: artifacts/mobile-smoke/
          if-no-files-found: ignore
          retention-days: 7
