name: Autonomous quality gate

on:
  pull_request:
    paths-ignore:
      - 'preview/ocean/renderer/dist/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Deterministic checks (no AI)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Scan tracked source for credential patterns (never print values)
        run: python scripts/check_release_secrets.py
      - name: Run shared quality gate
        run: python scripts/quality_gate.py

  mobile-smoke:
    name: iPhone-size smoke test (Chromium + WebKit, no AI)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install temporary Playwright dependency
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium and WebKit
        run: |
          bash scripts/prepare-browser-ci.sh
          npx playwright install --with-deps chromium webkit
      - name: Start static server
        run: python3 -m http.server 4173 >/tmp/cinemap-http.log 2>&1 &
      - name: Run mobile checks in Chromium
        run: CINEMAP_BROWSER=chromium node scripts/mobile_smoke.mjs
      - name: Run mobile checks in WebKit
        run: CINEMAP_BROWSER=webkit node scripts/mobile_smoke.mjs
      - name: Verify theme controls and mobile layouts in Chromium
        run: CINEMAP_BROWSER=chromium node tests/cinelva-theme-browser.mjs
      - name: Verify theme controls and mobile layouts in WebKit
        run: CINEMAP_BROWSER=webkit node tests/cinelva-theme-browser.mjs
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-smoke-screenshots
          path: artifacts/mobile-smoke/
          if-no-files-found: ignore
          retention-days: 7
