name: Reproducible backend build
on:
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!data/availability.json'
      - '!data/awards.json'
      - '!data/director_name_readings.json'
      - '!data/directors-mobile.json'
      - '!data/director-feature-index.json'
      - '!data/directors.json'
      - '!data/events.json'
      - '!data/movies.json'
      - '!data/now_playing.json'
      - '!data/outdoor-events.json'
      - '!data/rankings.json'
      - '!data/rankings_extra.json'
      - '!data/rankings_year.json'
      - '!data/release_history.json'
      - '!data/revival_screenings.json'
      - '!data/source-status.json'
      - '!data/special_screenings.json'
      - '!data/streaming.json'
      - '!data/theater_schedules.json'
      - '!data/theaters_master.json'
      - '!data/theaters_osm.json'
      - '!data/theatrical.json'
      - '!data/tv.json'
      - '!data/rankings/*.json'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: 'postgresql://cinelva:verification@127.0.0.1:5432/unused?schema=public'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Inventory exact dependency provenance and license metadata
        run: node scripts/check_dependency_licenses.cjs --output dependency-license-inventory.json
      - name: Install locked packages without lifecycle scripts
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit locked backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Verify installed configuration merge regression
        run: node tests/cinelva-backend-deepmerge-security.cjs
      - name: Generate Prisma client and compile without production credentials
        working-directory: backend
        run: npm run build
      - name: Verify built read APIs with the database unavailable
        run: node tests/cinelva-backend-snapshot-smoke.cjs
      - name: Verify complete quality gate with materialized backend configuration
        run: node tests/cinelva-materialized-config-quality.cjs
      - name: Reject compilation changes to tracked source
        run: git diff --exit-code -- backend
      - name: Preserve dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-dependency-license-inventory
          path: dependency-license-inventory.json
          if-no-files-found: error
