name: Backfill box office 1980-2019
on:
  push:
    paths:
      - 'scripts/backfill_boxoffice_1980_2019_20260927.py'
      - 'tests/test_boxoffice_1980_backfill.py'
      - '.github/workflows/backfill-boxoffice-1980-2019-20260927.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify regression test fails before backfill
        run: |
          if python -m unittest tests.test_boxoffice_1980_backfill; then
            echo 'Expected 1980 backfill regression test to fail before import' >&2
            exit 1
          fi
      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Import official Eiren annual rankings
        run: python scripts/backfill_boxoffice_1980_2019_20260927.py
      - name: Run regression tests
        run: |
          python -m unittest tests.test_boxoffice_1980_backfill
          python -m unittest tests.test_boxoffice_domestic_foreign
          python -m unittest tests.test_boxoffice_volume_speed
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('rankings.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          for s in scripts:
              if not s.strip(): continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(s); name=f.name
              subprocess.run(['node','--check',name],check=True)
          PY
      - name: Commit static historical data
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/boxoffice.json rankings.html
          git commit -m 'Backfill box office rankings from 1980'
          git pull --rebase origin main
          git push
