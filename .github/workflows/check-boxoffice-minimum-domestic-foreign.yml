name: Check box office minimum domestic foreign
on:
  push:
    paths:
      - 'data/boxoffice.json'
      - 'tests/test_boxoffice_minimum_domestic_foreign_per_year.py'
      - '.github/workflows/check-boxoffice-minimum-domestic-foreign.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python -m unittest tests.test_boxoffice_minimum_domestic_foreign_per_year
