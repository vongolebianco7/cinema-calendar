name: Check index screening sync v6
on:
  push:
    branches: ['fix/index-screening-sync-v6']
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/check_index_screening_sync_v6.py
