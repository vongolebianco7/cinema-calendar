name: Check My Cinemap theme mount
on:
  push:
    branches:
      - fix/my-cinemap-theme-mount
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run focused My Cinemap regression
        run: python -m pytest tests/test_my_cinemap_compact_templates.py -q
