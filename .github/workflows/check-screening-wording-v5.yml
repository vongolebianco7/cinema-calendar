name: Check screening wording v5
on:
  push:
    branches: [main, 'fix/screening-wording-v5']
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/check_screening_wording_v5.py
