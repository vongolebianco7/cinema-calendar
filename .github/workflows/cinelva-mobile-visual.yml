name: CINELVA mobile layout smoke test
on:
  push:
    paths:
      - 'my-cinelva/**'
      - 'js/cinelva-records-page.js'
      - '.github/workflows/cinelva-mobile-visual.yml'
  pull_request:
  workflow_dispatch:
jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Test mobile calendar
        run: node tests/cinelva-mobile-layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinelva-mobile-screenshots
          path: test-results/cinelva/
          retention-days: 7
