name: CINELVA mobile layout smoke test
on:
  push:
    paths:
      - 'my-cinelva/**'
      - 'js/cinelva-records-page.js'
      - 'tests/cinelva-mobile-layout.cjs'
      - '.github/workflows/cinelva-mobile-visual.yml'
  pull_request:
  workflow_dispatch:
jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Serve checked-out source
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/cinelva-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/my-cinelva/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/cinelva-http.log
          exit 1
      - name: Test mobile calendar
        run: node tests/cinelva-mobile-layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinelva-mobile-screenshots
          path: test-results/cinelva/
          retention-days: 7
