name: CINELVA mobile layout smoke test
on:
  push:
    paths:
      - 'my-cinelva/**'
      - 'js/cinelva-records-page.js'
      - 'tests/cinelva-mobile-layout.cjs'
      - 'tests/cinelva-rating-visible.cjs'
      - 'tests/cinelva-rating-visible.cjs'
      - 'js/cinelva-quick-rate.js'
      - 'index.html'
      - '.github/workflows/cinelva-mobile-visual.yml'
  pull_request:
  workflow_dispatch:
jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: |
          bash scripts/prepare-browser-ci.sh
          npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check js/cinelva-records-page.js
          node --check tests/cinelva-mobile-layout.cjs
          node --check tests/cinelva-rating-visible.cjs
          node --check js/cinelva-quick-rate.js
      - name: Serve checked-out source
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/cinelva-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/my-cinelva/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/cinelva-http.log
          exit 1
      - name: Verify movie rating labels are visible
        run: node tests/cinelva-rating-visible.cjs
      - name: Test mobile calendar
        run: node tests/cinelva-mobile-layout.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cinelva-mobile-screenshots
          path: test-results/cinelva/
          retention-days: 7
