name: Clarify experience standard audio
on:
  push:
    paths:
      - 'tests/test_experience_audio_standard_label.py'
      - 'scripts/clarify_experience_standard_audio_20260927.py'
      - '.github/workflows/clarify-experience-standard-audio-20260927.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify regression fails before fix
        run: |
          if python -m unittest tests.test_experience_audio_standard_label; then
            echo 'Expected audio label regression to fail before fix' >&2
            exit 1
          fi
      - name: Apply patch
        run: python scripts/clarify_experience_standard_audio_20260927.py
      - name: Run tests
        run: |
          python -m unittest tests.test_experience_audio_standard_label
          python -m unittest tests.test_experience_mobile_tabs
          python -m unittest tests.test_experience_tab_cleanup
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('experience.html').read_text(encoding='utf-8')
          for s in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S):
              if not s.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
                  f.write(s); name=f.name
              subprocess.run(['node','--check',name], check=True)
          PY
      - name: Commit production change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experience.html
          git commit -m 'Clarify standard screening audio'
          git pull --rebase origin main
          git push
