name: Cloudflare Worker preview deploy

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Migration branch to preview
        required: true
        type: choice
        options:
          - codex/cloudflare-fullstack-migration-20261125

permissions:
  contents: read

jobs:
  preview:
    if: inputs.source_ref == 'codex/cloudflare-fullstack-migration-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "Missing repository variable CLOUDFLARE_ACCOUNT_ID"
            exit 1
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked backend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Deploy Cloudflare Worker Preview
        run: npx cf previews deploy --preview-name cinelva-api-pr-904
