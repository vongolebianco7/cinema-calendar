name: Cinemap completeness scorecard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: completeness-scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-e2e:
    name: Scored mobile basics
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary Playwright dependency
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Start static server
        run: python3 -m http.server 4173 >/tmp/cinemap-scorecard-http.log 2>&1 &
      - name: Score Chromium mobile basics
        run: CINEMAP_BROWSER=chromium node tests/product/mobile-score.mjs
      - name: Score WebKit mobile basics
        run: CINEMAP_BROWSER=webkit node tests/product/mobile-score.mjs
      - name: Upload mobile score evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: completeness-mobile-metrics
          path: artifacts/completeness/
          if-no-files-found: warn
          retention-days: 7

  score:
    name: Completeness score
    needs: [mobile-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download producer metrics
        uses: actions/download-artifact@v4
        with:
          pattern: completeness-*-metrics
          path: artifacts/completeness
          merge-multiple: true
      - name: Calculate score
        run: python scripts/score_quality.py --metrics artifacts/completeness/metrics --output artifacts/completeness/score.json
      - name: Render score report
        run: python scripts/quality_report.py artifacts/completeness/score.json --output artifacts/completeness/score.md
      - name: Add score to job summary
        run: cat artifacts/completeness/score.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload final score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: completeness-score
          path: |
            artifacts/completeness/score.json
            artifacts/completeness/score.md
          if-no-files-found: error
          retention-days: 14
