name: CINELVA continuous visual QA
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: read
jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify PR changes for visual audit
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo 'run_visual=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" HEAD > /tmp/cinelva-changed-files
          if [ ! -s /tmp/cinelva-changed-files ]; then
            echo 'run_visual=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only skip for known non-UI-only changes. Unknown paths are audited.
          if grep -Ev '^(docs/|tests/.*\.py$|scripts/quality_gate\.py$|scripts/score_quality\.py$|quality/scorecard\.json$)' /tmp/cinelva-changed-files >/dev/null; then
            echo 'run_visual=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_visual=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping browser visual audit for non-UI-only PR; scheduled/full audit remains enabled.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.scope.outputs.run_visual == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: steps.scope.outputs.run_visual == 'true'
        run: npm install --no-save --no-package-lock playwright@1.59.0
      - if: steps.scope.outputs.run_visual == 'true'
        run: |
          bash scripts/prepare-browser-ci.sh
          npx playwright install --with-deps ${{ matrix.browser }}
      - if: steps.scope.outputs.run_visual == 'true'
        run: node --check scripts/continuous-visual-qa.mjs
      - if: steps.scope.outputs.run_visual == 'true'
        name: Serve exact checked-out source
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/cinelva-qa-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/cinelva-qa-http.log
          exit 1
      - if: steps.scope.outputs.run_visual == 'true'
        name: Audit routes in both themes and viewports
        env:
          CINELVA_BROWSER: ${{ matrix.browser }}
          CINELVA_BASE_URL: http://127.0.0.1:8765
        run: node scripts/continuous-visual-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.run_visual == 'true'
        with:
          name: continuous-visual-qa-${{ matrix.browser }}
          path: artifacts/continuous-qa/${{ matrix.browser }}/
          retention-days: 7
