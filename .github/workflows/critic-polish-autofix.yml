name: One-shot Cinemap final polish
on:
  push:
    paths:
      - '.github/workflows/critic-polish-autofix.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final detail polish
        run: python scripts/final_user_polish_once.py
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          for html in ['index.html','discover.html']:
              text=Path(html).read_text(encoding='utf-8')
              for i,script in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)):
                  if not script.strip():
                      continue
                  p=Path(tempfile.gettempdir())/f'{Path(html).stem}-{i}.js'
                  p.write_text(script,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                  if r.returncode:
                      print(html,r.stderr)
                      sys.exit(1)
          print('syntax ok')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html discover.html
          git commit -m "Integrate viewing timeline and format recommendations [final-polish-done]"
          git push
