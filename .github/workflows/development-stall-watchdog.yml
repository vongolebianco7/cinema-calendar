name: CINELVA development stall watchdog

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: cinelva-development-stall-watchdog
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect open PR checks and durable checkpoint
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const now = Date.now();
            const ageMinutes = timestamp => Math.round((now - Date.parse(timestamp)) / 60000);
            const prs = await github.paginate(github.rest.pulls.list, {owner, repo, state:'open', per_page:100});
            const warnings = [];
            const details = [];
            for (const pr of prs.filter(p => !p.draft)) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha: pr.head.sha, per_page:100
              });
              const relevant = runs.filter(r => r.head_sha === pr.head.sha && r.event === 'pull_request');
              const pending = relevant.filter(r => r.status !== 'completed');
              const failed = relevant.filter(r => r.status === 'completed' && ['failure','timed_out','cancelled'].includes(r.conclusion));
              const oldPending = pending.filter(r => ageMinutes(r.created_at) >= 60);
              const latestActivity = Math.max(Date.parse(pr.updated_at), ...relevant.map(r => Date.parse(r.updated_at)));
              const stagnant = now - latestActivity >= 120 * 60000;
              details.push(`PR #${pr.number}: ${pending.length} running, ${failed.length} failed/cancelled, ${oldPending.length} pending >=60m, stale >=120m: ${stagnant}`);
              if (oldPending.length || (failed.length && stagnant)) {
                warnings.push(`PR #${pr.number}: ${oldPending.length} long-running checks, ${failed.length} failed/cancelled checks; inspect logs and resume work`);
              }
            }
            try {
              const file = await github.rest.repos.getContent({owner,repo,path:'docs/operations/work-state.json'});
              const state = JSON.parse(Buffer.from(file.data.content,'base64').toString('utf8'));
              const checkpointAge = ageMinutes(state.updated_at);
              details.push(`Checkpoint age: ${checkpointAge} minutes; status: ${state.status}`);
              if (state.status === 'in_progress' && checkpointAge >= 120) {
                warnings.push(`Development checkpoint has not advanced for ${checkpointAge} minutes; verify Work progress and resume from work-state.json`);
              }
            } catch (e) {
              warnings.push(`Cannot read checkpoint: ${e.message}`);
            }
            const body = [
              '<!-- cinelva-stall-watchdog -->',
              '## Automated development stall monitor',
              'This is a **signal**, not proof that Work is stopped. GitHub Actions cannot restart an existing Work session.',
              '',
              ...details.map(s=>'- '+s),
              '',
              '### Attention needed',
              ...warnings.map(s=>'- '+s),
              '',
              'Next: check exact-head required CI, investigate failures, then resume the next safe task from [the checkpoint](../blob/main/docs/operations/work-state.json).',
              'Do not bypass required checks, auto-merge, or modify production data.'
            ].join('\n');
            await core.summary.addHeading('CINELVA development watchdog').addRaw(body).write();
            if (!warnings.length) return;
            const marker='<!-- cinelva-stall-watchdog -->';
            const existing = await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:239,per_page:100});
            const previous = existing.filter(c=>c.body?.includes(marker) && c.user?.type==='Bot').at(-1);
            // Avoid writing identical alerts on every scheduled run.
            const signature = warnings.map(s=>s.replace(/\d+ minutes/g,'N minutes')).join('|');
            if (previous && previous.body.includes(`<!-- signature:${signature} -->`) && ageMinutes(previous.created_at) < 360) return;
            await github.rest.issues.createComment({owner,repo,issue_number:239,body:body+'\n'+`<!-- signature:${signature} -->`});
            core.warning(warnings.join('; '));
