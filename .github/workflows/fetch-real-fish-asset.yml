name: Fetch real-fish PoC asset
on:
  push:
    branches: [feat/ocean-real-fish-v2]
    paths:
      - '.github/workflows/fetch-real-fish-asset.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[asset-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ocean-real-fish-v2
      - name: Download public-domain photographed fish once
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output preview/ocean/real-fish/fish-real.png 'https://upload.wikimedia.org/wikipedia/commons/6/6e/Transparent_killifish.png'
      - name: Validate PNG signature dimensions and size
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          p=Path('preview/ocean/real-fish/fish-real.png')
          b=p.read_bytes()
          assert len(b)>=100_000, len(b)
          assert b[:8]==b'\x89PNG\r\n\x1a\n'
          w,h=struct.unpack('>II',b[16:24])
          assert w>=700 and h>=300,(w,h)
          print('validated',len(b),w,h)
          PY
      - name: Commit local asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/ocean/real-fish/fish-real.png
          git commit -m 'chore(ocean): add public-domain real fish raster [asset-bot]'
          git push origin HEAD:feat/ocean-real-fish-v2
