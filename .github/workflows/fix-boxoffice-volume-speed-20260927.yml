name: Fix box office volume speed
on:
  push:
    paths:
      - 'scripts/fix_boxoffice_volume_speed_20260927.py'
      - 'tests/test_boxoffice_volume_speed.py'
      - '.github/workflows/fix-boxoffice-volume-speed-20260927.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify regression test fails before fix
        run: |
          if python -m unittest tests.test_boxoffice_volume_speed; then
            echo 'Expected box-office volume/speed regression test to fail before fix' >&2
            exit 1
          fi
      - name: Apply fix
        run: python scripts/fix_boxoffice_volume_speed_20260927.py
      - name: Run regression tests
        run: |
          python -m unittest tests.test_boxoffice_volume_speed
          python -m unittest tests.test_boxoffice_domestic_foreign
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('rankings.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          for s in scripts:
              if not s.strip(): continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(s); name=f.name
              subprocess.run(['node','--check',name],check=True)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rankings.html data/boxoffice.json
          git commit -m 'Expand and speed up box office rankings'
          git pull --rebase origin main
          git push
