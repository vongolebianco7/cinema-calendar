name: Optimize calendar first paint

on:
  push:
    paths:
      - ".github/workflows/fix-calendar-first-paint-20260927.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add failing regression test
        run: |
          cat > tests/test_calendar_first_paint_20260927.py <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          def test_fast_first_paint_exists():
              assert 'async function fastInitialCalendarPaint()' in s
              assert 'fetch("data/movies.json",{cache:"force-cache"})' in s
              boot=s.index('async function boot()')
              fast=s.index('await fastInitialCalendarPaint()',boot)
              heavy=s.index('Promise.all([',boot)
              assert fast < heavy
          PY
      - name: Confirm RED
        run: |
          if python -c "import runpy; ns=runpy.run_path('tests/test_calendar_first_paint_20260927.py'); [f() for n,f in ns.items() if n.startswith('test_') and callable(f)]"; then
            echo 'Expected RED before implementation' >&2
            exit 1
          fi
      - name: Apply fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          marker='async function boot(){try{let [mr,tr,dr,fr,er,sr,hr,ar,lr,tdr,spr,rr]=await Promise.all(['
          assert marker in s
          helper='''async function fastInitialCalendarPaint(){\n try{\n  const r=await fetch("data/movies.json",{cache:"force-cache"});\n  if(!r.ok)return;\n  const d=await r.json();\n  const firstMovies=d.movies||[];\n  if(!firstMovies.length)return;\n  movies=firstMovies;\n  applyRevivalClassification();\n  render();\n }catch(e){console.warn("fast calendar paint unavailable",e)}\n}\n'''
          replacement=helper+'async function boot(){await fastInitialCalendarPaint();try{let [mr,tr,dr,fr,er,sr,hr,ar,lr,tdr,spr,rr]=await Promise.all(['
          s=s.replace(marker,replacement,1)
          p.write_text(s)
          PY
      - name: Verify GREEN
        run: |
          python -c "import runpy; ns=runpy.run_path('tests/test_calendar_first_paint_20260927.py'); tests=[f for n,f in ns.items() if n.startswith('test_') and callable(f)]; [f() for f in tests]; print(str(len(tests))+' tests passed')"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/test_calendar_first_paint_20260927.py
          git commit -m "perf: paint calendar before supplemental data"
          git pull --rebase origin main
          git push
