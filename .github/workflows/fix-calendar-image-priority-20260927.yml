name: Prioritize calendar poster loading
on:
  push:
    branches: [main]
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add failing regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'function calendarImg(' not in s
          assert 'loading="lazy"' in s
          PY
      - name: Confirm RED
        run: |
          if python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'function calendarImg(' in s
          assert 'fetchpriority="high"' in s
          PY
          then exit 1; else exit 0; fi
      - name: Apply fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('function renderCal(){')
          end=s.index('function openMovie(', start)
          seg=s[start:end]
          seg=seg.replace('function renderCal(){','''function renderCal(){\n let calendarPriorityBudget=12;\n function calendarThumbUrl(url){return String(url||"").replace(/\\/(?:original|w780|w500|w342)\\//,"/w185/")}\n function calendarImg(url){let priority=calendarPriorityBudget>0;calendarPriorityBudget--;return '<img src="'+calendarThumbUrl(url)+'" alt="" loading="'+(priority?'eager':'lazy')+'" decoding="async"'+(priority?' fetchpriority="high"':'')+'>'}\n''',1)
          seg=seg.replace("'<img src=\"'+m.poster+'\" alt=\"\" loading=\"lazy\">'","calendarImg(m.poster)")
          s=s[:start]+seg+s[end:]
          p.write_text(s)
          PY
      - name: Verify GREEN
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'function calendarImg(' in s
          assert 'fetchpriority="high"' in s
          assert '/w185/' in s
          start=s.index('function renderCal(){')
          end=s.index('function openMovie(', start)
          seg=s[start:end]
          assert 'loading="lazy"' not in seg or 'calendarImg' in seg
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'perf: prioritize visible calendar posters'
          git push
