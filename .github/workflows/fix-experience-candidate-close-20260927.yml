name: Fix experience candidate close
on:
  push:
    paths:
      - '.github/workflows/fix-experience-candidate-close-20260927.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_experience_candidate_close.py')
          p.write_text("""from pathlib import Path\n\ndef test_candidate_window_closes_on_selection():\n    s=Path('experience.html').read_text()\n    assert '.filmCandidates[hidden]{display:none!important}' in s\n    assert \"candidateBox.innerHTML='';candidateBox.hidden=true\" in s\n""", encoding='utf-8')
          PY
      - name: Confirm RED
        run: |
          if python -m pytest -q tests/test_experience_candidate_close.py; then
            echo 'Expected RED before fix' >&2
            exit 1
          fi
      - name: Apply fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('experience.html')
          s=p.read_text(encoding='utf-8')
          old='.filmCandidates{margin-top:10px;border:1px solid #2b2f35;border-radius:10px;overflow:hidden;background:#101216}'
          new=old+'\n.filmCandidates[hidden]{display:none!important}'
          if '.filmCandidates[hidden]{display:none!important}' not in s:
              if old not in s: raise SystemExit('candidate CSS anchor not found')
              s=s.replace(old,new,1)
          old2="candidateBox.hidden=true;input.setAttribute('aria-expanded','false');renderRecommendation()"
          new2="candidateBox.innerHTML='';candidateBox.hidden=true;input.setAttribute('aria-expanded','false');renderRecommendation()"
          if "candidateBox.innerHTML='';candidateBox.hidden=true" not in s:
              if old2 not in s: raise SystemExit('selection anchor not found')
              s=s.replace(old2,new2,1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify GREEN
        run: python -m pytest -q tests/test_experience_candidate_close.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experience.html tests/test_experience_candidate_close.py
          git commit -m 'fix: close screening candidates after selection'
          git push
