name: Fix experience recommendation evidence
on:
  push:
    paths:
      - 'tests/test_experience_recommendation_evidence.py'
      - 'scripts/fix_experience_recommendation_evidence_20260927.py'
      - '.github/workflows/fix-experience-recommendation-evidence-20260927.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify regression fails before fix
        run: |
          if python -m unittest tests.test_experience_recommendation_evidence; then
            echo 'Expected evidence regression to fail before fix' >&2
            exit 1
          fi
      - name: Apply patch
        run: python scripts/fix_experience_recommendation_evidence_20260927.py
      - name: Run regression tests
        run: |
          python -m unittest tests.test_experience_recommendation_evidence
          python -m unittest tests.test_experience_movie_candidate_selection
          python -m unittest tests.test_experience_recommendation_reason_links
          python -m unittest tests.test_experience_mobile_tabs
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          t=Path('experience.html').read_text()
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',t,re.S)
          for i,s in enumerate(scripts):
              if not s.strip(): continue
              p=Path(tempfile.gettempdir())/f'exp-{i}.js'
              p.write_text(s)
              subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Commit production change
        run: |
          if git diff --quiet -- experience.html; then
            echo 'No production change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experience.html
          git commit -m 'Make recommendation reasons evidence-backed'
          git push
