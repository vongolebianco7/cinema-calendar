name: Fix My Cinemap full font sizing

on:
  push:
    paths:
      - ".github/workflows/fix-my-cinemap-full-fontsize-20260927.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Confirm RED
        id: red
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('js/my-cinemap-cinema-templates.js').read_text()
          assert "metrics.titleSize*fontScale" in s
          assert "21*fontScale,17*fontScale" in s
          assert "(columns===2?30:32)*fontScale" in s
          assert "drawMedal(ctx,numberX,y+rowH*.5,i+1,theme,.9*fontScale)" in s
          d=Path('js/my-cinemap-art-direction.js').read_text()
          assert "['format','layout','fontSize']" in d
          PY

      - name: Require RED
        run: |
          test "${{ steps.red.outcome }}" = "failure"

      - name: Apply full font sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/my-cinemap-cinema-templates.js')
          s=p.read_text()
          repls=[
            ("fittedLines(ctx,title,inner*.76,2,metrics.titleSize,40,font.title,font.titleWeight)","fittedLines(ctx,title,inner*.76,2,metrics.titleSize*fontScale,40*fontScale,font.title,font.titleWeight)"),
            ("fittedLines(ctx,note,inner*.76,2,21,17,artSans,400)","fittedLines(ctx,note,inner*.76,2,21*fontScale,17*fontScale,artSans,400)"),
            ("writeLines(ctx,title,w/2,metrics.titleY,inner*.76,2,metrics.titleSize,40,font.title,font.titleWeight,1.04)","writeLines(ctx,title,w/2,metrics.titleY,inner*.76,2,metrics.titleSize*fontScale,40*fontScale,font.title,font.titleWeight,1.04)"),
            ("writeLines(ctx,note,w/2,noteY,inner*.76,2,21,17,artSans,400)","writeLines(ctx,note,w/2,noteY,inner*.76,2,21*fontScale,17*fontScale,artSans,400)"),
            ("drawMedal(ctx,numberX,y+rowH*.5,i+1,theme,.9)","drawMedal(ctx,numberX,y+rowH*.5,i+1,theme,.9*fontScale)"),
            ("ctx.font=`400 ${columns===2?30:32}px ${artNumber}`","ctx.font=`400 ${(columns===2?30:32)*fontScale}px ${artNumber}`"),
            ("ctx.font=`400 29px ${artSans}`","ctx.font=`400 ${29*fontScale}px ${artSans}`"),
          ]
          for old,new in repls:
              assert old in s, old
              s=s.replace(old,new)
          p.write_text(s)

          p=Path('js/my-cinemap-art-direction.js')
          s=p.read_text()
          assert "['format','layout']" in s
          s=s.replace("['format','layout']","['format','layout','fontSize']")
          assert 'my-cinemap-cinema-templates.js?v=20260927-exact-cinema-v4' in s
          s=s.replace('my-cinemap-cinema-templates.js?v=20260927-exact-cinema-v4','my-cinemap-cinema-templates.js?v=20260927-exact-cinema-v5')
          p.write_text(s)
          PY

      - name: Verify GREEN
        run: |
          node --check js/my-cinemap-cinema-templates.js
          node --check js/my-cinemap-art-direction.js
          python - <<'PY'
          from pathlib import Path
          s=Path('js/my-cinemap-cinema-templates.js').read_text()
          assert "metrics.titleSize*fontScale" in s
          assert "21*fontScale,17*fontScale" in s
          assert "(columns===2?30:32)*fontScale" in s
          assert "drawMedal(ctx,numberX,y+rowH*.5,i+1,theme,.9*fontScale)" in s
          d=Path('js/my-cinemap-art-direction.js').read_text()
          assert "['format','layout','fontSize']" in d
          assert 'my-cinemap-cinema-templates.js?v=20260927-exact-cinema-v5' in d
          print('GREEN')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/my-cinemap-cinema-templates.js js/my-cinemap-art-direction.js
          git commit -m "fix: apply font size across cinema templates"
          git pull --rebase origin main
          git push
