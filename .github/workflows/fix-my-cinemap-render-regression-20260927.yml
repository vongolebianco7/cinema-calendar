name: Fix My Cinemap render regression

on:
  push:
    paths:
      - "scripts/fix_my_cinemap_render_regression_20260927.py"
      - ".github/workflows/fix-my-cinemap-render-regression-20260927.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python scripts/fix_my_cinemap_render_regression_20260927.py
      - name: Check JavaScript syntax
        run: |
          node --check js/my-cinemap-art.js
          node --check js/my-cinemap-art-direction.js
          node --check js/my-cinemap-cinema-templates.js
      - name: Run regression tests
        run: python - <<'PY'
          import runpy
          ns=runpy.run_path('tests/test_my_cinemap_render_regression_20260927.py')
          tests=[(n,f) for n,f in ns.items() if n.startswith('test_') and callable(f)]
          for name,fn in tests:
              fn(); print('PASS',name)
          print(f'{len(tests)} tests passed')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/my-cinemap-art.js js/my-cinemap-art-direction.js js/my-cinemap-cinema-templates.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix: restore My Cinemap previews and selected posters"
          git pull --rebase origin main
          git push
