name: Fix screening evidence source scoping
on:
  push:
    branches: [design/screening-recommendation-v2]
    paths:
      - scripts/fix_screening_sources.py
      - .github/workflows/fix-screening-sources.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/screening-recommendation-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_screening_sources.py
      - run: rm scripts/fix_screening_sources.py .github/workflows/fix-screening-sources.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: scope recommendation evidence to each format"
          git push origin HEAD:design/screening-recommendation-v2
