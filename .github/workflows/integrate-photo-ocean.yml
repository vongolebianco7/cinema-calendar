name: Integrate photo Ocean into dashboard
on:
  push:
    branches: [feat/ocean-integrate-photo]
    paths:
      - '.github/workflows/integrate-photo-ocean.yml'
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[integration-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/ocean-integrate-photo}
      - name: Patch dashboard and quality gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('preview/ocean/index.html'); s=p.read_text()
          marker='photo-ocean-production-v1'
          if marker not in s:
            inject='''<style id="photo-ocean-production-v1">#universe .photoOceanShell{border:1px solid #42616d;border-radius:16px;overflow:hidden;background:#04191f;margin:0 0 14px}#universe .photoOceanFrame{display:block;width:100%;height:min(78vh,760px);border:0;background:#031418}#universe .photoOceanCredit{display:block;padding:9px 12px;font-size:10px;color:#a8c3c5;text-align:right}@media(max-width:600px){#universe .photoOceanFrame{height:68vh}}</style><script id="photo-ocean-production-script">(function(){function maturity(n){return n>=500?500:n>=300?300:n>=100?100:n>=30?30:n>=10?10:0}function mountPhotoOcean(){var host=document.getElementById('universe');if(!host)return;var records=(window.CinemapRecords&&CinemapRecords.read)?CinemapRecords.read():{};var n=Object.keys(records||{}).length;var state=maturity(n);host.innerHTML='<div class="photoOceanShell"><iframe class="photoOceanFrame" title="あなたの映画の海" loading="eager" src="real-fish/ecosystem.html?state='+state+'"></iframe><a class="photoOceanCredit" href="real-fish/PHOTO_CREDITS.md">海の写真素材クレジット</a></div>'}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(mountPhotoOcean,80)});else setTimeout(mountPhotoOcean,80)})();</script>'''
            s=s.replace('</body>',inject+'</body>')
            p.write_text(s)
          t=Path('tests/ocean-photo-integration.test.cjs')
          t.write_text("const test=require('node:test');const assert=require('node:assert/strict');const fs=require('node:fs');const h=fs.readFileSync('preview/ocean/index.html','utf8');test('production Ocean mounts photo ecosystem into existing dashboard',()=>{assert.match(h,/photo-ocean-production-v1/);assert.match(h,/real-fish\\/ecosystem\\.html\\?state=/);assert.match(h,/document\\.getElementById\\('universe'\\)/);assert.match(h,/CinemapRecords\\.read/)});test('maturity routing covers all required states',()=>{for(const n of [500,300,100,30,10,0])assert.match(h,new RegExp('\\?'+''))});")
          q=Path('scripts/quality_gate.py'); qs=q.read_text(); needle="['node','--test','tests/ocean-photo-ecosystem.test.cjs']"; add="['node','--test','tests/ocean-photo-integration.test.cjs'],"+needle
          if 'ocean-photo-integration.test.cjs' not in qs: qs=qs.replace(needle,add); q.write_text(qs)
          PY
      - name: Validate integration immediately
        run: |
          node --test tests/ocean-photo-integration.test.cjs
          python scripts/quality_gate.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/ocean/index.html tests/ocean-photo-integration.test.cjs scripts/quality_gate.py
          git commit -m 'feat(ocean): integrate photo ecosystem into dashboard [integration-bot]'
          git push origin HEAD:feat/ocean-integrate-photo
