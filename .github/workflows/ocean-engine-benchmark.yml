name: Ocean engine benchmark
on:
  push:
    branches: [spike/ocean-engine-benchmark]
  pull_request:
    paths:
      - 'spikes/ocean-engine-benchmark/**'
      - '.github/workflows/ocean-engine-benchmark.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/ocean-engine-benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture iPhone visual
        run: |
          npm run dev -- --port 4173 > /tmp/ocean-vite.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ocean-engine-benchmark-iphone
          path: spikes/ocean-engine-benchmark/ocean-engine-benchmark-iphone.png
          retention-days: 7
