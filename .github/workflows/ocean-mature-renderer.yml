name: Ocean mature renderer
on:
  pull_request:
    paths:
      - 'preview/ocean/renderer/**'
      - 'tests/ocean-renderer-*.test.cjs'
      - '.github/workflows/ocean-mature-renderer.yml'
permissions:
  contents: write
jobs:
  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: preview/ocean/renderer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run build -- --base=./
      - name: Commit static Ocean bundle
        working-directory: .
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f preview/ocean/renderer/dist
          if git diff --cached --quiet; then
            echo "Ocean bundle already current"
          else
            git commit -m "build: refresh static Ocean bundle"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Capture iPhone renderer
        run: |
          npx vite --host 127.0.0.1 --port 4174 >/tmp/ocean-renderer.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4174 >/dev/null && break; sleep 1; done
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ocean-mature-renderer-iphone
          path: preview/ocean/renderer/ocean-mature-iphone.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ocean-static-bundle
          path: preview/ocean/renderer/dist
          retention-days: 7
