name: Ocean mature renderer
on:
  pull_request:
    paths:
      - 'preview/ocean/renderer/**'
      - 'tests/ocean-renderer-*.test.cjs'
      - 'tests/ocean-schooling.test.cjs'
      - '.github/workflows/ocean-mature-renderer.yml'
permissions:
  contents: write
jobs:
  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: preview/ocean/renderer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ocean-mature-renderer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vendor local Draco decoder
        run: |
          mkdir -p assets/draco
          for name in draco_decoder.js draco_decoder.wasm draco_wasm_wrapper.js; do curl -fsSL "https://raw.githubusercontent.com/amarnotcool/ABYSS/main/public/draco/${name}" -o "assets/draco/${name}"; done
          cd ../../..
          if [ -n "$(git status --porcelain -- preview/ocean/renderer/assets/draco)" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add preview/ocean/renderer/assets/draco
            git commit -m 'assets: vendor local Draco decoder'
            git push origin HEAD:feat/ocean-mature-renderer
          fi
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Capture iPhone renderer
        run: |
          npx vite --host 127.0.0.1 --port 4174 >/tmp/ocean-renderer.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4174 >/dev/null && break; sleep 1; done
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ocean-mature-renderer-iphone
          path: preview/ocean/renderer/ocean-mature-iphone.png
          retention-days: 7
