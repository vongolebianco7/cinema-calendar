name: Ocean GitHub Pages Preview
on:
  push:
    branches: [feature/ocean-ecosystem-v2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Ocean model
        run: node tests/ocean-model.test.cjs
      - name: Build isolated preview
        run: |
          mkdir -p /tmp/ocean-preview
          cp ocean-demo.html /tmp/ocean-preview/index.html
          cp ocean-demo.html /tmp/ocean-preview/ocean-demo.html
          cp -r js /tmp/ocean-preview/js
          cp -r assets /tmp/ocean-preview/assets
          mkdir -p /tmp/ocean-preview/assets/cinemap-ocean
          git fetch origin feat/my-cinemap-viewing-records --depth=1
          git show FETCH_HEAD:assets/cinemap-ocean/growth-reef-mobile.webp > /tmp/ocean-preview/assets/cinemap-ocean/growth-reef-mobile.webp
          git show FETCH_HEAD:assets/cinemap-ocean/growth-reef.webp > /tmp/ocean-preview/assets/cinemap-ocean/growth-reef.webp
          cp -r data /tmp/ocean-preview/data 2>/dev/null || true
      - name: Publish preview folder to Pages source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          rm -rf preview/ocean
          mkdir -p preview/ocean
          cp -r /tmp/ocean-preview/. preview/ocean/
          git add preview/ocean
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish isolated Ocean preview"
          git push origin main
