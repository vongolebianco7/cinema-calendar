name: Ocean production wiring
on:
  pull_request:
    paths:
      - 'preview/ocean/**'
      - 'tests/ocean-production-wiring.test.cjs'
      - '.github/workflows/ocean-production-wiring.yml'
permissions:
  contents: read
jobs:
  production-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check preview/ocean/js/ocean-demo.js
      - run: node --test tests/ocean-production-wiring.test.cjs
