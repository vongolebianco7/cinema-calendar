name: Polish experience visuals
on:
  push:
    paths:
      - 'tests/test_experience_visual_polish_20260927.py'
      - 'scripts/polish_experience_visuals_20260927.py'
      - '.github/workflows/polish-experience-visuals-20260927.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify regression fails before fix
        run: |
          if python -m unittest tests.test_experience_visual_polish_20260927; then
            echo 'Expected experience polish regression to fail before fix' >&2
            exit 1
          fi
      - name: Apply patch
        run: python scripts/polish_experience_visuals_20260927.py
      - name: Run regression tests
        run: |
          python -m unittest tests.test_experience_visual_polish_20260927
          python -m unittest tests.test_experience_movie_candidate_selection
          python -m unittest tests.test_experience_mobile_tabs
          python -m unittest tests.test_experience_tab_cleanup
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('experience.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          for s in scripts:
              if not s.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
                  f.write(s)
                  name=f.name
              subprocess.run(['node','--check',name], check=True)
          PY
      - name: Commit production change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experience.html
          git commit -m 'Polish experience audio and motion visuals'
          git pull --rebase origin main
          git push
