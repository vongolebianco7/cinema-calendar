name: Publish compact director catalog
on:
  push:
    branches: [main]
    paths:
      - data/directors.json
      - data/director_name_readings.json
      - scripts/enrich_directors.py
      - scripts/build_director_mobile.py
      - .github/workflows/publish-director-mobile.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: compact-director-catalog
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and validate from the latest source before each publish attempt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B mobile-catalog-publish FETCH_HEAD
            # This path makes no external API requests or new observation dates.
            python scripts/enrich_directors.py --normalize-only
            python scripts/build_director_mobile.py
            python scripts/quality_gate.py
            node scripts/verify-production-release.cjs --require
            git add data/directors-mobile.json data/directors.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish synchronized director catalog with retained name provenance'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
