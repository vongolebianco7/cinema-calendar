name: Refresh director profiles and credits
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/enrich_directors.py
permissions:
  contents: write
concurrency:
  group: director-metadata-refresh
  cancel-in-progress: false
jobs:
  refresh:
    # One finite repair batch on our own branch. Never expose secrets to forks.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/director-data-completion-20261018')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve directors added by the latest main snapshot
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:data/directors.json > /tmp/cinelva-main-directors.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/directors.json')
          current = json.loads(path.read_text())
          latest = json.loads(Path('/tmp/cinelva-main-directors.json').read_text())
          before = len(current['directors'])
          for identifier, director in latest['directors'].items():
              current['directors'].setdefault(identifier, director)
          path.write_text(json.dumps(current, ensure_ascii=False, indent=2) + '\n')
          print('Preserved additional main director IDs:', len(current['directors']) - before)
          PY
      - name: Verify source permissions and director transformation
        run: |
          python scripts/check_sources.py
          python -m py_compile scripts/enrich_directors.py
      - name: Refresh all existing directors through the approved TMDB API
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/enrich_directors.py --limit 800
      - name: Preserve completeness and missing-source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-enrichment
          path: |
            artifacts/director-enrichment.json
            data/directors.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate the refreshed snapshot before storing it
        run: python scripts/quality_gate.py
      - name: Store only the reviewed director snapshot on the work branch
        if: github.event_name == 'pull_request'
        env:
          WORK_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/directors.json
          git diff --cached --quiet || git commit -m 'Refresh sourced director names profiles and complete directing credits'
          git push origin "HEAD:$WORK_BRANCH"
