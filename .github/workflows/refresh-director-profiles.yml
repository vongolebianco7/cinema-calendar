name: Refresh director profiles and credits
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/enrich_directors.py
      - tests/cinelva-director-render.test.cjs
      - tests/test_director_enrichment.py
      - .github/workflows/refresh-director-profiles.yml
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - scripts/enrich_directors.py
permissions:
  contents: write
concurrency:
  group: director-metadata-refresh
  cancel-in-progress: false
jobs:
  refresh:
    # One finite repair batch on our own branch. Never expose secrets to forks.
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'fix/director-data-completion-20261018' || github.head_ref == 'fix/director-missing-catalog-20261019'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve directors added by the latest main snapshot
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:data/directors.json > /tmp/cinelva-main-directors.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/directors.json')
          current = json.loads(path.read_text())
          latest = json.loads(Path('/tmp/cinelva-main-directors.json').read_text())
          before = len(current['directors'])
          for identifier, director in latest['directors'].items():
              current['directors'].setdefault(identifier, director)
          path.write_text(json.dumps(current, ensure_ascii=False, indent=2) + '\n')
          print('Preserved additional main director IDs:', len(current['directors']) - before)
          PY
      - name: Verify source permissions and director transformation
        run: |
          python scripts/check_sources.py
          python -m py_compile scripts/enrich_directors.py
      - name: Refresh all existing directors through the approved TMDB API
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/enrich_directors.py --limit 800 --discover-names --verify-person 190
      - name: Preserve completeness and missing-source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-enrichment
          path: |
            artifacts/director-enrichment.json
            data/directors.json
          if-no-files-found: warn
          retention-days: 14
      - name: Validate director snapshot and feature-film attribution before storing
        run: |
          python -m unittest tests.test_director_enrichment
          node --check js/cinelva-records-page.js
          python scripts/check_sources.py
      - name: Store only the reviewed director snapshot on the work branch
        if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'push'
        env:
          WORK_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/directors.json /tmp/cinelva-refreshed-directors.json
          for attempt in 1 2 3 4 5; do
            git fetch origin "$WORK_BRANCH"
            git checkout -B director-data-publish FETCH_HEAD
            python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/directors.json')
          latest = json.loads(path.read_text())
          refreshed = json.loads(Path('/tmp/cinelva-refreshed-directors.json').read_text())
          # Reconcile concurrent writes instead of overwriting the latest main.
          for identifier, entry in refreshed['directors'].items():
              previous = latest['directors'].get(identifier, {})
              if str(entry.get('checked_at', '')) >= str(previous.get('checked_at', '')):
                  latest['directors'][identifier] = entry
          path.write_text(json.dumps(latest, ensure_ascii=False, indent=2) + chr(10))
          PY
            git add data/directors.json
            if git diff --cached --quiet; then
              echo 'Director snapshot already up to date'
              exit 0
            fi
            git commit -m 'Refresh sourced director names profiles and complete directing credits'
            if git push origin "HEAD:$WORK_BRANCH"; then
              exit 0
            fi
            echo "Concurrent push detected; reconciling attempt $attempt/5"
          done
          echo 'Could not save director data after five concurrent-update retries' >&2
          exit 1
