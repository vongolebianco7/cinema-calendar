name: Refresh My Cinemap GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_my_cinemap_pages_20260926.py'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh My Cinemap asset versions
        run: python scripts/refresh_my_cinemap_pages_20260926.py
      - name: Validate JavaScript and UI gates
        run: |
          node --check js/my-cinemap-art.js
          node --check js/my-cinemap-tools.js
          python scripts/check_discovery_ui.py
      - name: Commit refreshed Pages entrypoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my-cinemap.html js/my-cinemap-art.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refresh My Cinemap assets for GitHub Pages"
          git push
