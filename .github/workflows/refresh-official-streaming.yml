name: Refresh official streaming calendar
on:
  push:
    branches: [main]
    paths:
      - data/streaming-*-official-supplement.json
      - .github/workflows/refresh-official-streaming.yml
      - data/streaming_sources.json
      - data/streaming-official-feeds.json
      - data/source_registry.json
      - scripts/discover_streaming_announcements.py
      - scripts/refresh_streaming_official.py
      - scripts/enrich_streaming_posters.py
      - scripts/import_official_streaming_snapshot.py
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Share the repository-wide writer lock with the movie, now-playing and TV
  # updaters. They all publish generated snapshots directly to main, including
  # the shared source-status file, so per-workflow locking is not sufficient.
  group: cinema-database-write
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and refresh verified release subset
        run: python scripts/refresh_streaming_official.py
      - name: Enrich approved posters and runtimes
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CINELVA_ENRICH_RUNTIME: "1"
        run: python scripts/enrich_streaming_posters.py
      - name: Merge verified dated titles into the user-facing streaming catalog
        run: python scripts/import_official_streaming_snapshot.py
      - name: Backfill missing streaming posters and runtimes
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CINELVA_ENRICH_RUNTIME: "1"
        run: python scripts/enrich_streaming_posters.py --input data/streaming.json
      - name: Discover official announcement candidates
        run: python scripts/discover_streaming_announcements.py
      - name: Record official feed discovery freshness
        run: node scripts/source-status.cjs --output data/source-status.json
      - name: Commit only verified generated data
        run: |
          if git diff --quiet -- data/streaming-official-current.json data/streaming-announcement-candidates.json data/streaming.json data/source-status.json && test -f data/streaming-official-current.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/streaming-official-current.json data/streaming-announcement-candidates.json data/streaming.json data/source-status.json
          git commit -m "data: refresh official streaming supplement"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              git rebase --abort
              echo "Concurrent main update conflicts with refreshed streaming data: $conflicts" >&2
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "Unable to publish refreshed streaming data after three safe retries" >&2
          exit 1
