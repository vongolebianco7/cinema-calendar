name: Refresh official streaming calendar
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-official-streaming
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and refresh verified release subset
        run: python scripts/refresh_streaming_official.py
      - name: Discover official announcement candidates\n        run: python scripts/discover_streaming_announcements.py\n      - name: Commit only verified generated data
        run: |
          if git diff --quiet -- data/streaming-official-current.json data/streaming-announcement-candidates.json && test -f data/streaming-official-current.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/streaming-official-current.json data/streaming-announcement-candidates.json
          git commit -m "data: refresh official streaming supplement"
          git push
