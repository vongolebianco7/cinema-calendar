name: Check link-only theater section
'on':
  push:
    paths:
      - 'tests/test_official_theater_links_only.py'
      - '.github/workflows/remove-3-theater-showtimes-20260926.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tests/test_official_theater_links_only.py
