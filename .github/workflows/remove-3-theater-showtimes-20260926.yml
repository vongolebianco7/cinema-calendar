name: Apply link-only theater section
'on':
  push:
    paths:
      - 'scripts/remove_partial_theater_showtimes.py'
      - '.github/workflows/remove-3-theater-showtimes-20260926.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply link-only renderer
        run: python scripts/remove_partial_theater_showtimes.py
      - name: Verify regression test
        run: python tests/test_official_theater_links_only.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html search.html
          git diff --cached --quiet || git commit -m 'Replace partial theater showtimes with official links'
          git pull --rebase origin main
          git push origin main
