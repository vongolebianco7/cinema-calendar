name: Scorecard contract

on:
  pull_request:
    paths:
      - 'quality/**'
      - 'scripts/score_quality.py'
      - 'scripts/quality_report.py'
      - 'scripts/ci_touched_areas.py'
      - 'tests/test_score_quality.py'
      - 'tests/test_quality_report.py'
      - 'tests/test_ci_touched_areas.py'
      - 'tests/product/**'
      - '.github/workflows/scorecard-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run scorecard contract tests
        run: python -m unittest tests.test_score_quality tests.test_quality_report tests.test_ci_touched_areas -v
      - name: Run browser metric harness contract
        run: node --test tests/product/metric-harness.test.mjs
