name: Scorecard contract

on:
  pull_request:
    paths:
      - 'quality/**'
      - 'scripts/score_quality.py'
      - 'scripts/quality_report.py'
      - 'scripts/ci_touched_areas.py'
      - 'scripts/map_ocean_metrics.py'
      - 'scripts/map_data_compliance_metrics.py'
      - 'tests/test_score_quality.py'
      - 'tests/test_quality_report.py'
      - 'tests/test_ci_touched_areas.py'
      - 'tests/test_map_ocean_metrics.py'
      - 'tests/test_data_compliance_metrics.py'
      - 'tests/test_completeness_workflow.py'
      - 'tests/product/**'
      - '.github/workflows/scorecard-contract.yml'
      - '.github/workflows/completeness-scorecard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run scorecard contract tests
        run: python -m unittest tests.test_score_quality tests.test_quality_report tests.test_ci_touched_areas tests.test_map_ocean_metrics tests.test_data_compliance_metrics tests.test_completeness_workflow -v
      - name: Run browser metric harness contract
        run: node --test tests/product/metric-harness.test.mjs
