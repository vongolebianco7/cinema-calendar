name: Scorecard contract

on:
  pull_request:
    paths:
      - 'quality/**'
      - 'scripts/score_quality.py'
      - 'tests/test_score_quality.py'
      - '.github/workflows/scorecard-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run scorecard contract tests
        run: python -m unittest tests.test_score_quality -v
