name: Supplement box office top10 per side
on:
  push:
    paths:
      - 'scripts/supplement_boxoffice_top10_per_side_20260927.py'
      - 'tests/test_boxoffice_minimum_domestic_foreign_per_year.py'
      - '.github/workflows/supplement-boxoffice-top10-per-side-20260927.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify stricter coverage test fails before supplement
        run: |
          if python -m unittest tests.test_boxoffice_minimum_domestic_foreign_per_year; then
            echo 'Expected stricter coverage test to fail before supplement' >&2
            exit 1
          fi
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Supplement missing domestic foreign top10 rows
        run: python scripts/supplement_boxoffice_top10_per_side_20260927.py
      - name: Run coverage tests
        run: |
          python -m unittest tests.test_boxoffice_minimum_domestic_foreign_per_year
          python -m unittest tests.test_boxoffice_minimum_per_year
          python -m unittest tests.test_boxoffice_domestic_foreign
      - name: Commit data
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/boxoffice.json
          git commit -m 'Ensure 10 domestic and 10 foreign box office titles per year'
          git pull --rebase origin main
          git push
