name: Test My Cinemap render regression

on:
  push:
    paths:
      - "tests/test_my_cinemap_render_regression_20260927.py"
      - "js/my-cinemap-art.js"
      - "js/my-cinemap-art-direction.js"
      - "js/my-cinemap-cinema-templates.js"
      - "my-cinemap.html"
      - ".github/workflows/test-my-cinemap-render-regression-20260927.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check js/my-cinemap-art.js
          node --check js/my-cinemap-art-direction.js
          node --check js/my-cinemap-cinema-templates.js
          node --check js/my-cinemap-tools.js
      - name: Run regression tests
        run: python -c "import runpy; ns=runpy.run_path('tests/test_my_cinemap_render_regression_20260927.py'); tests=[(n,f) for n,f in ns.items() if n.startswith('test_') and callable(f)]; [f() for n,f in tests]; print(str(len(tests))+' tests passed')"
