name: Test My Cinemap render regression

on:
  push:
    paths:
      - "tests/test_my_cinemap_render_regression_20260927.py"
      - "js/my-cinemap-art.js"
      - "js/my-cinemap-art-direction.js"
      - ".github/workflows/test-my-cinemap-render-regression-20260927.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run regression tests
        run: python - <<'PY'
          import runpy
          ns=runpy.run_path('tests/test_my_cinemap_render_regression_20260927.py')
          tests=[(n,f) for n,f in ns.items() if n.startswith('test_') and callable(f)]
          for name,fn in tests:
              fn(); print('PASS',name)
          print(f'{len(tests)} tests passed')
          PY
