name: Unify mobile movie rails 2026-09-26

on:
  push:
    paths:
      - '.github/workflows/unify-mobile-movie-rails-20260926.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create regression test
        run: |
          mkdir -p tests
          cat > tests/test_mobile_movie_rails.py <<'PY'
          from pathlib import Path
          expected = {
              'discover.html': ['mobile-movie-rails-v1', '#grid.grid{display:flex', '#grid .card{flex:0 0 104px', 'overflow-x:auto'],
              'rankings.html': ['mobile-movie-rails-v1', '.rankGrid{display:flex', '.rankCard{flex:0 0 104px', 'overflow-x:auto'],
              'search.html': ['mobile-movie-rails-v1', '.grid{display:flex', '.grid>.card{flex:0 0 112px', 'overflow-x:auto'],
          }
          failed=[]
          for name,tokens in expected.items():
              text=Path(name).read_text(encoding='utf-8')
              missing=[t for t in tokens if t not in text]
              if missing: failed.append(f'{name}: missing {missing}')
          if failed: raise SystemExit('\n'.join(failed))
          print('mobile movie rail regression checks passed')
          PY

      - name: Verify RED
        run: |
          if python tests/test_mobile_movie_rails.py; then
            echo 'Regression test unexpectedly passed before implementation'
            exit 1
          else
            echo 'Expected RED confirmed'
          fi

      - name: Apply mobile rail CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          patches={
            'discover.html':'<style>/* mobile-movie-rails-v1 */@media(max-width:760px){html,body{max-width:100%;overflow-x:hidden}.wrap,.popularShelves,.presetShelf,#grid{min-width:0;max-width:100%}#grid.grid{display:flex!important;grid-template-columns:none!important;flex-wrap:nowrap!important;gap:9px!important;width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding:2px 1px 18px}#grid .card{flex:0 0 104px;width:104px;min-width:104px;max-width:104px;scroll-snap-align:start}#grid .poster{width:100%}#grid .body{padding:7px}#grid .title{font-size:11px}#grid .meta{font-size:9px}#grid .empty{flex:0 0 100%;width:100%}}</style>',
            'rankings.html':'<style>/* mobile-movie-rails-v1 */@media(max-width:760px){html,body{max-width:100%;overflow-x:hidden}.wrap,.rankGrid{min-width:0;max-width:100%}.rankGrid{display:flex!important;grid-template-columns:none!important;flex-wrap:nowrap!important;gap:9px!important;width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding:2px 1px 18px}.rankCard{flex:0 0 104px;width:104px;min-width:104px;max-width:104px;scroll-snap-align:start}.rankCard .body{padding:7px}.rankCard .title{font-size:11px}.rankCard .meta{font-size:9px}.rankGrid .empty{flex:0 0 100%;width:100%}}</style>',
            'search.html':'<style>/* mobile-movie-rails-v1 */@media(max-width:760px){html,body{max-width:100%;overflow-x:hidden}main,.wrap,.grid{min-width:0;max-width:100%}.grid{display:flex!important;grid-template-columns:none!important;flex-wrap:nowrap!important;gap:10px!important;width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding:2px 1px 22px}.grid>.card{flex:0 0 112px;width:112px;min-width:112px;max-width:112px;scroll-snap-align:start}.grid>.card .body{padding:8px}.grid>.card .title{font-size:11px}.grid>.card .meta,.grid>.card .score{font-size:9px}.grid>.status,.grid>.empty{flex:0 0 100%;width:100%}.modal .grid{display:grid!important;overflow:visible!important;width:auto;max-width:none;scroll-snap-type:none;padding:0}}</style>'
          }
          for name,css in patches.items():
              p=Path(name); text=p.read_text(encoding='utf-8')
              if 'mobile-movie-rails-v1' in text: continue
              if '</head>' not in text: raise SystemExit(f'{name}: missing </head>')
              p.write_text(text.replace('</head>',css+'\n</head>',1),encoding='utf-8')
          PY

      - name: Verify GREEN
        run: python tests/test_mobile_movie_rails.py

      - name: Verify inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,os
          for name in ['discover.html','rankings.html','search.html']:
              text=Path(name).read_text(encoding='utf-8')
              for i,src in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)):
                  if not src.strip(): continue
                  fd,tmp=tempfile.mkstemp(suffix='.js'); os.close(fd)
                  Path(tmp).write_text(src,encoding='utf-8')
                  r=subprocess.run(['node','--check',tmp],capture_output=True,text=True); os.unlink(tmp)
                  if r.returncode: raise SystemExit(f'{name} inline script {i} syntax error:\n{r.stderr}')
          print('inline JavaScript syntax checks passed')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add discover.html rankings.html search.html tests/test_mobile_movie_rails.py
          git diff --cached --quiet && exit 0
          git commit -m 'Unify mobile movie lists as horizontal rails'
          git push origin main
