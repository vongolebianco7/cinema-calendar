name: Refresh film festivals and domestic events
on:
  schedule:
    - cron: "29 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cinelva-film-events
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Collect verified official event metadata
        run: python scripts/update-film-events.py
      - name: Commit verified feed changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official festival and domestic event feed"
            git push
          fi
