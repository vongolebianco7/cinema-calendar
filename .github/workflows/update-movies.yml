name: Update movie data
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/update_movies.py
      - .github/workflows/update-movies.yml
  schedule:
    - cron: "17 18 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install theater parser
        run: pip install beautifulsoup4
      - name: Fetch TMDB data
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/update_movies.py
      - name: Fetch theater schedules
        run: python scripts/update_theaters.py
      - name: Observe Japan streaming availability
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/update_availability.py
      - name: Archive sourced publication history
        run: python scripts/update_history.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/rankings/*.json
          git diff --cached --quiet || git commit -m "Update movie data"
          git pull --rebase origin main
          git push origin main
