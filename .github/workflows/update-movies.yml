name: Update movie data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
concurrency:
  group: cinema-database-write
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  # Compliance-gated production update
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run compliance source gate
        run: python scripts/check_sources.py
      - name: Fetch TMDB data
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/update_movies.py
      - name: Observe Japan streaming availability
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/update_availability.py
      - name: Archive sourced publication history
        run: python scripts/update_history.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync fresh movie and TV data directly to PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install
          npm run db:sync

      - name: Commit JSON backup snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/rankings/*.json
          git diff --cached --quiet || git commit -m "Update movie data"
          git pull --rebase -X theirs origin main
          git push origin main
