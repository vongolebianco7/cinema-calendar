name: Update movie data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/streaming.json
      - data/streaming_announcements.json
  schedule:
    - cron: "17 18 * * *"
concurrency:
  group: cinema-database-write
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  # Compliance-gated production update
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Import source-reviewed official streaming premieres
        run: python scripts/import_streaming_announcements.py
      - name: Validate all streaming provider feeds and provenance
        run: python scripts/check_streaming_coverage.py
      - name: Run compliance source gate
        run: python scripts/check_sources.py
      - name: Fetch TMDB data
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/update_movies.py
      - name: Classify confirmed revival screenings
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/classify_revivals.py
      - name: Add posters to Morning Ten screenings
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/enrich_special_screenings.py
      - name: Reconcile sourced award identities with the local catalog
        run: python scripts/enrich_award_catalog.py
      - name: Validate award and official on-demand provenance
        run: python scripts/check_release_data.py
      - name: Observe Japan streaming availability
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/update_availability.py
      - name: Audit per-title streaming observation freshness
        if: always()
        run: python scripts/audit_availability_freshness.py
      - name: Upload streaming freshness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streaming-freshness-audit
          path: artifacts/availability-freshness.json
          retention-days: 7
          if-no-files-found: warn
      - name: Archive sourced publication history
        run: python scripts/update_history.py

      - name: Detect stale premiere coverage
        run: |
          python - <<'PY'
          import datetime, json
          with open("data/streaming.json", encoding="utf-8") as f:
              source = json.load(f)
          today = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          upcoming = [m for m in source.get("movies", []) if m.get("date", "") >= str(today)]
          missing = [m.get("title") for m in source.get("movies", []) if not (m.get("source_url") and m.get("date") and m.get("service"))]
          print(f"Verified future streaming premieres: {len(upcoming)}")
          print(f"Streaming source last editorial update: {source.get('generated_at')}")
          print(f"Source records missing citation/date/service: {len(missing)}")
          if len(upcoming) < 5:
              print("::warning title=Streaming premiere coverage stale::Fewer than five upcoming officially dated premieres. Curated official release announcements need refresh.")
          if missing:
              print("::warning title=Missing streaming citations::Some streaming entries lack required source/date/service.")
          PY

      - name: Validate movie snapshot
        run: |
          python - <<'PY'
          import json, sys
          with open("data/movies.json", encoding="utf-8") as f:
              data = json.load(f)
          count = len(data.get("movies") or [])
          print("movie snapshot count:", count)
          if count < 50:
              print("Refusing to sync an unexpectedly small movie snapshot.")
              sys.exit(1)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync fresh movie and TV data directly to PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install
          npm run db:sync

      - name: Commit JSON backup snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/rankings/*.json
          git diff --cached --quiet || git commit -m "Update movie data"
          git pull --rebase -X theirs origin main
          git push origin main
