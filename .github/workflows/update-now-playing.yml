name: Refresh nationwide now-playing snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_now_playing.py
      - .github/workflows/update-now-playing.yml
  schedule:
    - cron: '13 18 * * *'
permissions:
  contents: write
concurrency:
  group: cinema-database-write
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify approved source and exact-source CI before collection
        run: |
          python scripts/check_sources.py
          node scripts/verify-production-release.cjs --require
      - name: Observe all JP now-playing pages
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/update_now_playing.py
      - name: Publish validated snapshot without a database dependency
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/now_playing.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh nationwide now-playing snapshot'
          git pull --rebase origin main
          python scripts/quality_gate.py
          node scripts/verify-production-release.cjs --require
          git push origin main
