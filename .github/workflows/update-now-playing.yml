name: Refresh nationwide now-playing snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_now_playing.py
      - .github/workflows/update-now-playing.yml
      - quality/production-proof.json
  schedule:
    - cron: '13 18 * * *'
permissions:
  contents: write
concurrency:
  group: cinema-database-write
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify approved source and exact-source CI before collection
        run: |
          python scripts/check_sources.py
          node scripts/verify-production-release.cjs --require
      - name: Observe all JP now-playing pages
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/update_now_playing.py
      - name: Publish validated snapshot without a database dependency
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/source-status.cjs --output data/source-status.json
          git add data/now_playing.json data/source-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh nationwide now-playing snapshot'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              python scripts/check_sources.py
              python scripts/quality_gate.py
              node scripts/verify-production-release.cjs --require
              if git push origin HEAD:main; then exit 0; fi
              continue
            fi
            conflicts="$(git diff --name-only --diff-filter=U)"
            git rebase --abort
            if [[ "$conflicts" != "data/source-status.json" ]]; then
              echo "Unexpected concurrent snapshot conflict: $conflicts" >&2
              exit 1
            fi
            git reset --hard origin/main
            python scripts/check_sources.py
            node scripts/verify-production-release.cjs --require
            python scripts/update_now_playing.py
            node scripts/source-status.cjs --output data/source-status.json
            python scripts/quality_gate.py
            node scripts/verify-production-release.cjs --require
            git add data/now_playing.json data/source-status.json
            git diff --cached --quiet && exit 0
            git commit -m 'Refresh nationwide now-playing snapshot'
          done
          echo 'Unable to publish now-playing snapshot after three safe retries' >&2
          exit 1
