name: Update outdoor cinema events
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: outdoor-cinema-events
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover official outdoor screening event records
        run: python scripts/update-outdoor-events.py
      - name: Commit updated event feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/outdoor-events.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh outdoor cinema event feed"
            git push
          fi
