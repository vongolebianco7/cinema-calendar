name: Update nationwide cinema directory
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/update_theaters_osm.py
permissions:
  contents: write
concurrency:
  group: cinema-database-write
  cancel-in-progress: false
jobs:
  update:
    if: ${{ false }} # Disabled: nationwide Overpass query is too broad for unattended use
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Fetch directory
        run: python scripts/update_theaters_osm.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/theaters_osm.json
          git diff --cached --quiet || git commit -m "Update nationwide cinema directory"
          git pull --rebase origin main
          git push origin main
