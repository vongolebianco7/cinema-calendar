name: Update theater master

on:
  workflow_dispatch:
  schedule:
    - cron: "43 18 * * 0"
  push:
    paths:
      - scripts/update_theater_master.py
      - scripts/check_sources.py
      - data/source_registry.json
      - .github/workflows/update-theater-master.yml

concurrency:
  group: cinema-database-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Safe serialized theater directory update
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run compliance source gate
        run: python scripts/check_sources.py

      - name: Build nationwide theater master from Wikidata
        run: python scripts/update_theater_master.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync theater master to PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install
          npm run db:sync:theater-master

      - name: Commit theater master backup snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/theaters_master.json
          git diff --cached --quiet || git commit -m "Update nationwide theater master"
          git pull --rebase -X theirs origin main
          git push origin main
