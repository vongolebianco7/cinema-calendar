name: Update theater master

on:
  workflow_dispatch:

concurrency:
  group: cinema-theater-master-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Safe serialized theater directory update
  update:
    if: ${{ false }} # Disabled: avoid bulk external queries until a low-impact source is selected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Run compliance source gate
        run: python scripts/check_sources.py

      - name: Build nationwide theater master from Wikidata
        run: python scripts/update_theater_master.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Sync theater master to PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install
          node ../scripts/production-checks.cjs --require
          npx prisma generate
          npx tsx scripts/import-json.ts --theater-master-only

      - name: Commit theater master backup snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/theaters_master.json
          git diff --cached --quiet || git commit -m "Update nationwide theater master"
          git pull --rebase -X theirs origin main
          git push origin main
