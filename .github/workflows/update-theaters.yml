name: Update theater showtimes
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/update_theaters.py
      - .github/workflows/update-theaters.yml
  schedule:
    - cron: "25 1,5,9,13,17,21 * * *"
permissions:
  contents: write
concurrency:
  group: cinema-database-write
  cancel-in-progress: false
jobs:
  update:
    if: ${{ false }} # Disabled pending explicit permission for automated schedule collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Install parser
        run: pip install beautifulsoup4
      - name: Fetch verified theater schedules
        run: python scripts/update_theaters.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Sync theater schedules to PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install
          npm run db:sync:theaters

      - name: Commit showtimes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/theater_schedules.json
          git diff --cached --quiet || git commit -m "Update theater showtimes"
          git pull --rebase origin main
          git push origin main
