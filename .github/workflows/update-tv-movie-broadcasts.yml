name: Refresh anime-related movie TV broadcasts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_syoboi_tv_movies.py
      - data/source_registry.json
      - quality/production-proof.json
      - .github/workflows/update-tv-movie-broadcasts.yml
  schedule:
    - cron: '37 18 * * *'
permissions:
  contents: write
concurrency:
  group: cinema-database-write
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source approval and exact-source CI before collection
        run: |
          python scripts/check_sources.py
          node scripts/verify-production-release.cjs --require
      - name: Collect the documented seven-day movie-category feed
        run: python scripts/update_syoboi_tv_movies.py
      - name: Validate the source parser and complete data quality gate
        run: |
          python -m unittest tests.test_syoboi_tv_movies
          if ! git diff --quiet -- data/tv.json; then
            node scripts/source-status.cjs --output data/source-status.json
          fi
          python scripts/quality_gate.py
          node scripts/verify-production-release.cjs --require
      - name: Publish source snapshot without touching PostgreSQL
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tv.json data/source-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh anime-related movie TV broadcasts'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              python scripts/check_sources.py
              python scripts/quality_gate.py
              node scripts/verify-production-release.cjs --require
              if git push origin HEAD:main; then exit 0; fi
              continue
            fi
            conflicts="$(git diff --name-only --diff-filter=U)"
            git rebase --abort
            if [[ -z "$conflicts" ]]; then
              echo "Rebase failed without a reported conflict path" >&2
              exit 1
            fi
            while IFS= read -r conflict; do
              case "$conflict" in
                data/source-status.json|data/tv.json) ;;
                *)
                  echo "Unexpected concurrent snapshot conflict: $conflict" >&2
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
            # Another approved updater changed one or both generated snapshots.
            # Restart from latest main and rebuild this feed instead of choosing
            # either generated file and losing the other source's data.
            git reset --hard origin/main
            python scripts/check_sources.py
            node scripts/verify-production-release.cjs --require
            python scripts/update_syoboi_tv_movies.py
            python -m unittest tests.test_syoboi_tv_movies
            if ! git diff --quiet -- data/tv.json; then
              node scripts/source-status.cjs --output data/source-status.json
            fi
            python scripts/quality_gate.py
            node scripts/verify-production-release.cjs --require
            git add data/tv.json data/source-status.json
            git diff --cached --quiet && exit 0
            git commit -m 'Refresh anime-related movie TV broadcasts'
          done
          echo 'Unable to publish TV snapshot after three safe retries' >&2
          exit 1
