name: Refresh anime-related movie TV broadcasts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_syoboi_tv_movies.py
      - data/source_registry.json
      - .github/workflows/update-tv-movie-broadcasts.yml
      - quality/production-proof.json
  schedule:
    - cron: '30 17 * * *'
permissions:
  contents: write
concurrency:
  group: cinema-database-write
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source approval and exact-source CI before collection
        run: |
          python scripts/check_sources.py
          node scripts/verify-production-release.cjs --require
      - name: Collect the documented seven-day movie-category feed
        run: python scripts/update_syoboi_tv_movies.py
      - name: Validate the source parser and complete data quality gate
        run: |
          python -m unittest tests.test_syoboi_tv_movies
          if ! git diff --quiet -- data/tv.json; then
            node scripts/source-status.cjs --output data/source-status.json
          fi
          python scripts/quality_gate.py
          node scripts/verify-production-release.cjs --require
      - name: Publish source snapshot without touching PostgreSQL
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tv.json data/source-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh anime-related movie TV broadcasts'
          git pull --rebase origin main
          python scripts/check_sources.py
          python scripts/quality_gate.py
          node scripts/verify-production-release.cjs --require
          git push origin main
