name: Validate frontend

on:
  push:
    paths:
      - "*.html"
      - "js/cinelva-*.js"
      - "js/data-backup.js"
      - "my-cinelva/**"
      - "tests/cinelva-insights.test.cjs"
      - "tests/cinelva-library-records.test.cjs"
      - "tests/cinelva-my-page-*.cjs"
      - "tests/cinelva-storage.test.cjs"
      - "tests/cinelva-backup.test.cjs"
      - "tests/test_my_cinemap_three_column_export.py"
      - "backend/app/api/critic-videos/route.ts"
      - "js/critic-evidence.js"
      - "js/my-cinemap-art.js"
      - "data/critic_evidence.json"
      - "scripts/check_critic_evidence.js"
      - "data/source_registry.json"
      - "data/special_screenings.json"
      - "data/theater_formats.json"
      - "scripts/check_sources.py"
      - "scripts/check_discovery_ui.py"
      - "scripts/check_core_journey.py"
      - "scripts/check_critic_map.py"
      - "scripts/apply_brand_identity_20260927.py"
      - "scripts/fix_brand_header_20260927.py"
      - "scripts/fix_my_cinemap_export_brand_20260927.py"
      - "tests/test_brand_identity.py"
      - "tests/test_my_cinemap_three_column_export.py"
      - "manifest.webmanifest"
      - "favicon.svg"
      - "apple-touch-icon.png"
      - "icon-192.png"
      - "icon-512.png"
      - ".github/workflows/validate-frontend.yml"
  pull_request:
    paths:
      - "*.html"
      - "js/cinelva-*.js"
      - "js/data-backup.js"
      - "my-cinelva/**"
      - "tests/cinelva-insights.test.cjs"
      - "tests/cinelva-library-records.test.cjs"
      - "tests/cinelva-my-page-*.cjs"
      - "tests/cinelva-storage.test.cjs"
      - "tests/cinelva-backup.test.cjs"
      - "tests/test_my_cinemap_three_column_export.py"
      - "backend/app/api/critic-videos/route.ts"
      - "js/critic-evidence.js"
      - "js/my-cinemap-art.js"
      - "data/critic_evidence.json"
      - "scripts/check_critic_evidence.js"
      - "data/source_registry.json"
      - "data/special_screenings.json"
      - "data/theater_formats.json"
      - "scripts/check_sources.py"
      - "scripts/check_discovery_ui.py"
      - "scripts/check_core_journey.py"
      - "scripts/check_critic_map.py"
      - "scripts/apply_brand_identity_20260927.py"
      - "scripts/fix_brand_header_20260927.py"
      - "scripts/fix_my_cinemap_export_brand_20260927.py"
      - "tests/test_brand_identity.py"
      - "tests/test_my_cinemap_three_column_export.py"
      - "manifest.webmanifest"
      - "favicon.svg"
      - "apple-touch-icon.png"
      - "icon-192.png"
      - "icon-512.png"
      - ".github/workflows/validate-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys, tempfile

          failures = []
          for html in sorted(Path(".").glob("*.html")):
              text = html.read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", text, flags=re.S|re.I)
              for i, script in enumerate(scripts):
                  if not script.strip():
                      continue
                  p = Path(tempfile.gettempdir()) / f"{html.stem}-inline-{i}.js"
                  p.write_text(script, encoding="utf-8")
                  r = subprocess.run(["node", "--check", str(p)], capture_output=True, text=True)
                  if r.returncode:
                      failures.append(f"{html} script #{i}:\n{r.stderr}")
          if failures:
              print("\n\n".join(failures))
              sys.exit(1)
          print("All inline JavaScript syntax checks passed.")
          PY
      - name: Check My Cinelva record model and views
        run: |
          node --check js/cinelva-library-records.js
          node --check js/cinelva-insights.js
          node --check js/cinelva-records-page.js
          node --check js/cinelva-share-image.js
          node --check js/cinelva-data-quality.js
          node --check js/cinelva-official-offers.js
          node --test tests/cinelva-data-quality.test.cjs tests/cinelva-share-image.test.cjs
          python -m unittest tests.test_availability_update tests.test_award_identity
          python scripts/check_release_data.py
          node --test tests/cinelva-insights.test.cjs tests/cinelva-library-records.test.cjs tests/cinelva-storage.test.cjs tests/cinelva-backup.test.cjs tests/cinelva-my-page-contract.test.cjs
      - name: Check My Cinelva PNG export
        run: python tests/test_my_cinemap_three_column_export.py
      - name: Run My Cinelva mobile browser journey
        run: |
          npm install --prefix "$RUNNER_TEMP/cinelva-e2e" --no-audit --no-fund playwright@1.59.0
          "$RUNNER_TEMP/cinelva-e2e/node_modules/.bin/playwright" install --with-deps chromium webkit
          NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-my-page-browser.cjs
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-my-page-browser.cjs
      - name: Check Cinemap brand identity
        run: python -m unittest discover -s tests -p 'test_brand_identity.py' -v
      - name: Check approved data sources
        run: python scripts/check_sources.py
      - name: Check discovery UI integrations
        run: python scripts/check_discovery_ui.py
      - name: Check Cinemap core journey
        run: python scripts/check_core_journey.py
      - name: Check Critic Map compliance gate
        run: python scripts/check_critic_map.py
      - name: Check critic evidence thresholds and sources
        run: node scripts/check_critic_evidence.js
      - name: Reject stale cinema showtimes
        run: |
          node --check js/cinelva-theater-schedule.js
          node --test tests/cinelva-theater-schedule.test.cjs
