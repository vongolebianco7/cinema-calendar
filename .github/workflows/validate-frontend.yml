name: Validate frontend

on:
  push:
    paths:
      - "*.html"
      - "preview/ocean/**/*.html"
      - "tests/cinelva-ocean-route-retirement.cjs"
      - "tests/cinelva-ocean-workflow-retirement.test.cjs"
      - "js/cinelva-*.js"
      - "js/data-backup.js"
      - "my-cinelva/**"
      - "tests/cinelva-insights.test.cjs"
      - "tests/cinelva-library-records.test.cjs"
      - "tests/cinelva-theme.test.cjs"
      - "tests/cinelva-discovery-offer-order.test.cjs"
      - "tests/cinelva-provider-list-browser.cjs"
      - "tests/cinelva-my-page-*.cjs"
      - "tests/cinelva-quick-rate-browser.cjs"
      - "tests/cinelva-calendar-record-entry-browser.cjs"
      - "tests/cinelva-route-audit-browser.cjs"
      - "tests/cinelva-theater-quality-browser.cjs"
      - "tests/cinelva-now-playing-browser.cjs"
      - "tests/cinelva-source-status-browser.cjs"
      - "tests/cinelva-calendar-ranking-rating-browser.cjs"
      - "tests/cinelva-boxoffice-poster-browser.cjs"
      - "tests/cinelva-storage.test.cjs"
      - "tests/cinelva-backup.test.cjs"
      - "tests/test_my_cinemap_three_column_export.py"
      - "backend/app/api/critic-videos/route.ts"
      - "js/critic-evidence.js"
      - "js/my-cinemap-art.js"
      - "data/critic_evidence.json"
      - "scripts/check_critic_evidence.js"
      - "data/source_registry.json"
      - "data/special_screenings.json"
      - "data/theater_formats.json"
      - "scripts/check_sources.py"
      - "scripts/check_discovery_ui.py"
      - "scripts/check_core_journey.py"
      - "scripts/check_critic_map.py"
      - "scripts/apply_brand_identity_20260927.py"
      - "scripts/fix_brand_header_20260927.py"
      - "scripts/fix_my_cinemap_export_brand_20260927.py"
      - "tests/test_brand_identity.py"
      - "tests/test_my_cinemap_three_column_export.py"
      - "manifest.webmanifest"
      - "favicon.svg"
      - "apple-touch-icon.png"
      - "icon-192.png"
      - "icon-512.png"
      - ".github/workflows/validate-frontend.yml"
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!data/availability.json'
      - '!data/awards.json'
      - '!data/director_name_readings.json'
      - '!data/directors-mobile.json'
      - '!data/director-feature-index.json'
      - '!data/directors.json'
      - '!data/events.json'
      - '!data/movies.json'
      - '!data/now_playing.json'
      - '!data/outdoor-events.json'
      - '!data/rankings.json'
      - '!data/rankings_extra.json'
      - '!data/rankings_year.json'
      - '!data/release_history.json'
      - '!data/revival_screenings.json'
      - '!data/source-status.json'
      - '!data/special_screenings.json'
      - '!data/streaming.json'
      - '!data/theater_schedules.json'
      - '!data/theaters_master.json'
      - '!data/theaters_osm.json'
      - '!data/theatrical.json'
      - '!data/tv.json'
      - '!data/rankings/*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys, tempfile

          failures = []
          for html in sorted(Path(".").glob("*.html")):
              text = html.read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", text, flags=re.S|re.I)
              for i, script in enumerate(scripts):
                  if not script.strip():
                      continue
                  p = Path(tempfile.gettempdir()) / f"{html.stem}-inline-{i}.js"
                  p.write_text(script, encoding="utf-8")
                  r = subprocess.run(["node", "--check", str(p)], capture_output=True, text=True)
                  if r.returncode:
                      failures.append(f"{html} script #{i}:\n{r.stderr}")
          if failures:
              print("\n\n".join(failures))
              sys.exit(1)
          print("All inline JavaScript syntax checks passed.")
          PY
      - name: Check My Cinelva record model and views
        run: |
          node --check js/cinelva-library-records.js
          node --check js/cinelva-insights.js
          node --check js/cinelva-records-page.js
          node --check js/cinelva-share-image.js
          node --check js/cinelva-data-quality.js
          node --check js/cinelva-official-offers.js
          node --test tests/cinelva-data-quality.test.cjs tests/cinelva-share-image.test.cjs
          python -m unittest tests.test_availability_update tests.test_award_identity
          python scripts/check_release_data.py
          node --test tests/cinelva-insights.test.cjs tests/cinelva-library-records.test.cjs tests/cinelva-storage.test.cjs tests/cinelva-backup.test.cjs tests/cinelva-my-page-contract.test.cjs tests/cinelva-my-page-record-entry.test.cjs tests/cinelva-my-page-bookmark-list.test.cjs tests/cinelva-my-page-presentation.test.cjs tests/cinelva-quick-rate.test.cjs
          node --test tests/cinelva-route-manifest.test.cjs
      - name: Check My Cinelva PNG export
        run: python tests/test_my_cinemap_three_column_export.py
      - name: Generate the same offline director projection used by publication
        run: |
          python scripts/enrich_directors.py --normalize-only
          python scripts/build_director_mobile.py
          node scripts/build-director-feature-index.cjs
      - name: Run My Cinelva mobile browser journey
        run: |
          npm install --prefix "$RUNNER_TEMP/cinelva-e2e" --no-audit --no-fund playwright@1.59.0
          bash scripts/prepare-browser-ci.sh
          "$RUNNER_TEMP/cinelva-e2e/node_modules/.bin/playwright" install --with-deps chromium webkit
          NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-my-page-browser.cjs
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-my-page-browser.cjs
          NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-boxoffice-poster-browser.cjs
          NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-poster-retry-browser.cjs
          NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-search-fallback-browser.cjs
          NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-secondary-cards-browser.cjs
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-secondary-cards-browser.cjs
          NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-ocean-route-retirement.cjs
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-ocean-route-retirement.cjs
          node --test tests/cinelva-ocean-workflow-retirement.test.cjs
          NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-my-page-record-entry-browser.cjs
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-my-page-record-entry-browser.cjs
          NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-quick-rate-browser.cjs
          NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-calendar-cross-screen-browser.cjs
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-calendar-cross-screen-browser.cjs
          NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-calendar-ranking-rating-browser.cjs
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-calendar-ranking-rating-browser.cjs
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-quick-rate-browser.cjs
          NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-calendar-record-entry-browser.cjs
          NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-source-status-browser.cjs
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-source-status-browser.cjs
          NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-theater-quality-browser.cjs
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-theater-quality-browser.cjs
          NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-cinema-discounts-browser.cjs
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-cinema-discounts-browser.cjs
          NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-route-audit-browser.cjs
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-e2e/node_modules" node tests/cinelva-route-audit-browser.cjs
      - name: Preserve cinema discount evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-discounts
          path: artifacts/cinema-discounts/
          if-no-files-found: warn
      - name: Preserve route audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinelva-route-audit
          path: artifacts/route-audit/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve calendar regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinelva-calendar-cross-screen
          path: artifacts/calendar-cross-screen/
          if-no-files-found: warn
          retention-days: 14
      - name: Check Cinemap brand identity
        run: python -m unittest discover -s tests -p 'test_brand_identity.py' -v
      - name: Check approved data sources
        run: python scripts/check_sources.py
      - name: Check discovery UI integrations
        run: |
          python scripts/check_discovery_ui.py
          node --test tests/cinelva-discovery-offer-order.test.cjs
      - name: Check discovery shelf count and expansion
        run: node --test tests/cinelva-discovery-shelf.test.cjs
      - name: Check Cinemap core journey
        run: python scripts/check_core_journey.py
      - name: Check Critic Map compliance gate
        run: python scripts/check_critic_map.py
      - name: Check critic evidence thresholds and sources
        run: node scripts/check_critic_evidence.js
      - name: Reject stale cinema showtimes
        run: |
          node --check js/cinelva-theater-schedule.js
          node --test tests/cinelva-theater-schedule.test.cjs
  now-playing:
    name: Nationwide now-playing shared controls (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/cinelva-now-playing" --no-audit --no-fund playwright@1.59.0
          bash scripts/prepare-browser-ci.sh
          "$RUNNER_TEMP/cinelva-now-playing/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Verify current, stale and unavailable list with real shared actions
        run: |
          NODE_PATH="$RUNNER_TEMP/cinelva-now-playing/node_modules" node tests/cinelva-now-playing-browser.cjs
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-now-playing/node_modules" node tests/cinelva-now-playing-browser.cjs
          NODE_PATH="$RUNNER_TEMP/cinelva-now-playing/node_modules" node tests/cinelva-calendar-now-playing-browser.cjs
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-now-playing/node_modules" node tests/cinelva-calendar-now-playing-browser.cjs
      - name: Preserve rendered list evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nationwide-now-playing
          path: artifacts/now-playing/
          if-no-files-found: warn
  reported-audit:
    name: Reported UI and data regressions (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/cinelva-reported-audit" --no-audit --no-fund playwright@1.59.0
          bash scripts/prepare-browser-ci.sh
          "$RUNNER_TEMP/cinelva-reported-audit/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Verify reported calendar, brand, review, sort and theater issues
        run: |
          result=0
          NODE_PATH="$RUNNER_TEMP/cinelva-reported-audit/node_modules" node tests/cinelva-provider-list-browser.cjs || result=1
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-reported-audit/node_modules" node tests/cinelva-provider-list-browser.cjs || result=1
          NODE_PATH="$RUNNER_TEMP/cinelva-reported-audit/node_modules" node tests/cinelva-global-search-browser.cjs || result=1
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-reported-audit/node_modules" node tests/cinelva-global-search-browser.cjs || result=1
          NODE_PATH="$RUNNER_TEMP/cinelva-reported-audit/node_modules" node tests/cinelva-reported-audit-browser.cjs || result=1
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-reported-audit/node_modules" node tests/cinelva-reported-audit-browser.cjs || result=1
          NODE_PATH="$RUNNER_TEMP/cinelva-reported-audit/node_modules" node tests/cinelva-ranking-bookmark-browser.cjs || result=1
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-reported-audit/node_modules" node tests/cinelva-ranking-bookmark-browser.cjs || result=1
          NODE_PATH="$RUNNER_TEMP/cinelva-reported-audit/node_modules" node tests/cinelva-world-boxoffice-browser.cjs || result=1
          CINELVA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/cinelva-reported-audit/node_modules" node tests/cinelva-world-boxoffice-browser.cjs || result=1
          exit "$result"
      - name: Preserve reported issue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reported-ui-audit
          path: |
            artifacts/reported-audit/
            artifacts/global-search/
          if-no-files-found: warn
