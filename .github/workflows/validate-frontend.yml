name: Validate frontend

on:
  push:
    paths:
      - "*.html"
      - "backend/app/api/critic-videos/route.ts"
      - "data/source_registry.json"
      - "scripts/check_sources.py"
      - "scripts/check_critic_map.py"
      - ".github/workflows/validate-frontend.yml"
  pull_request:
    paths:
      - "*.html"
      - "backend/app/api/critic-videos/route.ts"
      - "data/source_registry.json"
      - "scripts/check_sources.py"
      - "scripts/check_critic_map.py"
      - ".github/workflows/validate-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys, tempfile

          failures = []
          for html in sorted(Path(".").glob("*.html")):
              text = html.read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", text, flags=re.S|re.I)
              for i, script in enumerate(scripts):
                  if not script.strip():
                      continue
                  p = Path(tempfile.gettempdir()) / f"{html.stem}-inline-{i}.js"
                  p.write_text(script, encoding="utf-8")
                  r = subprocess.run(["node", "--check", str(p)], capture_output=True, text=True)
                  if r.returncode:
                      failures.append(f"{html} script #{i}:\n{r.stderr}")
          if failures:
              print("\n\n".join(failures))
              sys.exit(1)
          print("All inline JavaScript syntax checks passed.")
          PY
      - name: Check approved data sources
        run: python scripts/check_sources.py
      - name: Check Critic Map compliance gate
        run: python scripts/check_critic_map.py
