name: Validate user batch 2026-09-26
on:
  push:
    paths:
      - '.github/workflows/validate-user-batch-20260926.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,sys
          failures=[]
          for html in [Path('index.html'),Path('discover.html'),Path('rankings.html'),Path('my-cinemap.html'),Path('experience.html'),Path('critic.html'),Path('search.html')]:
              text=html.read_text(encoding='utf-8')
              for i,script in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)):
                  if not script.strip(): continue
                  p=Path(tempfile.gettempdir())/f'{html.stem}-{i}.js';p.write_text(script,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                  if r.returncode: failures.append(f'{html} script {i}:\n{r.stderr}')
          if failures:
              print('\n'.join(failures));sys.exit(1)
          print('inline JavaScript syntax OK')
          PY
      - name: Check requested UX markers
        run: |
          python - <<'PY'
          from pathlib import Path
          checks={
            'index.html':['["すべて","通常","リバイバル","午前十時"]','applyRevivalClassification','hydrateMorningTenPosters','repeat(3,minmax(0,1fr))','（継続）'],
            'discover.html':['theatricalPopularGrid','streamingPopularGrid','repeat(3,minmax(0,1fr))'],
            'rankings.html':['AWARD_CATEGORY_ORDER','"アジア"','productionBucket','rankCard img[hidden]'],
            'my-cinemap.html':['themeSwatch','data-theme="amber"','data-theme="teal"','document.fonts?.ready'],
            'experience.html':['id="imax-gt-theaters"','グランドシネマサンシャイン 池袋','シアター12','109シネマズ大阪エキスポシティ','シアター11'],
            'critic.html':['fetchCriticMovie','Critic Map clarity pass','&search=']
          }
          bad=[]
          for f,need in checks.items():
              s=Path(f).read_text(encoding='utf-8')
              for x in need:
                  if x not in s: bad.append(f'{f}: missing {x}')
          if bad:
              print('\n'.join(bad));raise SystemExit(1)
          print('requested UX markers OK')
          PY
