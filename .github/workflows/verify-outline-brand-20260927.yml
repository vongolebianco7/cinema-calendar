name: Verify Cinemap Outline Tile brand

on:
  push:
    paths:
      - ".github/workflows/verify-outline-brand-20260927.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Brand regression tests
        run: python -m unittest discover -s tests -p 'test_brand_identity.py' -v
      - name: Approved data sources
        run: python scripts/check_sources.py
      - name: Discovery UI integrations
        run: python scripts/check_discovery_ui.py
      - name: Core journey
        run: python scripts/check_core_journey.py
      - name: Critic Map compliance gate
        run: python scripts/check_critic_map.py
      - name: Critic evidence thresholds and sources
        run: node scripts/check_critic_evidence.js
      - name: My Cinemap artwork JavaScript syntax
        run: node --check js/my-cinemap-art.js
      - name: Inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys, tempfile
          failures=[]
          for html in sorted(Path('.').glob('*.html')):
              text=html.read_text(encoding='utf-8')
              for i,script in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)):
                  if not script.strip(): continue
                  p=Path(tempfile.gettempdir())/f'{html.stem}-verify-outline-{i}.js'
                  p.write_text(script,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                  if r.returncode: failures.append(f'{html} script #{i}:\n{r.stderr}')
          if failures:
              print('\n\n'.join(failures));sys.exit(1)
          print('All inline JavaScript syntax checks passed.')
          PY
