<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Concierge · Cinemap</title><style>:root{--bg:#0a0a0a;--p:#151515;--line:#292929;--t:#f3f1ec;--m:#929292;--a:#ef3f3f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",sans-serif}.wrap{max-width:760px;margin:auto;padding:0 18px}.top{height:58px;display:flex;align-items:center;border-bottom:1px solid var(--line)}a{color:inherit;text-decoration:none}.brand{font-size:19px;font-weight:900}.hero{padding:38px 0 22px}.ey{font-size:10px;letter-spacing:.16em;color:var(--a);font-weight:800}.hero h1{font:800 clamp(34px,9vw,62px)/.98 Georgia,serif;margin:10px 0 14px}.hero p{color:var(--m);line-height:1.65}.examples{display:flex;gap:8px;overflow:auto;padding:5px 0 18px}.examples button{white-space:nowrap;background:transparent;color:#bbb;border:1px solid var(--line);border-radius:99px;padding:9px 12px}.chat{min-height:250px;border-top:1px solid var(--line);padding:20px 0 120px}.movieLinks{display:flex;gap:8px;overflow:auto;margin:8px 0 18px}.movieLinks a{flex:0 0 116px;background:#151515;border:1px solid var(--line);border-radius:10px;padding:8px;color:#fff}.movieLinks img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px}.movieLinks b{display:block;font-size:11px;margin-top:6px}.msg{max-width:88%;padding:13px 15px;border-radius:14px;margin:10px 0;line-height:1.65;white-space:pre-wrap}.user{margin-left:auto;background:#272727}.ai{background:var(--p);border:1px solid var(--line)}.dock{position:fixed;bottom:0;left:0;right:0;background:#0a0a0af2;border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}.row{display:flex;gap:8px}.row input{flex:1;min-width:0;background:#171717;color:#fff;border:1px solid #333;border-radius:12px;padding:14px;font-size:16px}.row button{border:0;border-radius:12px;background:var(--t);color:#111;font-weight:850;padding:0 18px}.note{font-size:10px;color:#666;margin-top:7px}.gTop{position:sticky;top:0;z-index:90;background:rgba(9,9,9,.97);backdrop-filter:blur(14px);border-bottom:1px solid #262626}.gNav{height:62px;display:flex;align-items:center;gap:12px}.gLogo{display:block;height:31px;width:auto;max-width:180px}.gSearchForm{margin-left:auto;display:flex;align-items:center;width:min(360px,42vw);height:36px;border:1px solid #333;border-radius:18px;background:#111;overflow:hidden}.gSearch{min-width:0;flex:1;height:100%;border:0;outline:0;background:transparent;color:#f2f2f2;padding:0 4px 0 13px}.gSearchBtn{width:38px;height:100%;border:0;background:transparent;color:#aaa;font-size:19px}.gMenuBtn{width:40px;height:40px;border:0;background:transparent;color:#f2f2f2;display:grid;place-items:center}.gMenuLines,.gMenuLines:before,.gMenuLines:after{display:block;width:19px;height:1px;background:currentColor;content:""}.gMenuLines{position:relative}.gMenuLines:before{position:absolute;top:-6px}.gMenuLines:after{position:absolute;top:6px}.gDrawerMask{position:fixed;inset:0;background:#0009;z-index:98;display:none}.gDrawerMask.show{display:block}.gDrawer{position:fixed;top:0;right:0;height:100dvh;width:min(320px,84vw);background:#111318;border-left:1px solid #292929;z-index:99;transform:translateX(100%);transition:.22s ease;padding:20px}.gDrawer.show{transform:translateX(0)}.gDrawerHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.gDrawerClose{width:38px;height:38px;border:0;border-radius:50%;background:#1b1d22;color:#f2f2f2;font-size:22px}.gDrawer a{display:block;color:#f2f2f2;text-decoration:none}.gDrawer>a{font-size:17px;font-weight:750;padding:14px 4px;border-bottom:1px solid #292929}@media(max-width:600px){.gNav{height:58px;gap:8px}.gLogo{height:28px;max-width:150px}.gSearchForm{width:auto;flex:1;min-width:0;height:34px}.gSearchBtn{width:32px}.gMenuBtn{width:36px}}</style></head><body><heade </aside><div class="wrap"><section class="hero"><div class="ey">Cinemap 映画コンシェルジュ</div><h1>映画を、横断して探す。</h1><p>作品カタログ、監督・出演者、評価、日本の配信情報を横断して条件に合う映画を探します。外部の有料AI APIは使わず、CinemapとTMDBの作品データを横断して条件に合う映画を探します。</p></section><div class="examples"><button>インターステラーが好き。似た映画を5本</button><button>2時間以内で評価の高いSF</button><button>U-NEXTで見られる重厚な映画</button></div><main id="chat" class="chat"><div class="msg ai">観たい映画の条件を入力してください。</div></main></div><div class="dock"><div class="wrap"><div class="row"><input id="q" maxlength="500" placeholder="例：映像が綺麗なSFを5本"><button id="send">送信</button></div><div class="note">完全無料の検索コンシェルジュです。作品データに基づいて回答します。配信状況など変動情報は各サービスでもご確認ください。</div></div></div><script>const B="https://backend-one-gray-94.vercel.app",chat=document.getElementById("chat"),q=document.getElementById("q"),send=document.getElementById("send");function add(t,c){let d=document.createElement("div");d.className="msg "+c;d.textContent=t;chat.appendChild(d);scrollTo(0,document.body.scrollHeight)}async function ask(v){v=v.trim();if(!v||send.disabled)return;q.value="";add(v,"user");send.disabled=true;let wait=document.createElement("div");wait.className="msg ai";wait.textContent="作品データを調べています…";chat.appendChild(wait);try{let r=await fetch(B+"/api/agent",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:v})}),d=await r.json();wait.textContent=r.ok?d.answer:(r.status===503?"映画データAPIが現在利用できません。":"現在回答できません。少し時間をおいて再度お試しください。")if(r.ok&&d.movies?.length){let box=document.createElement("div");box.className="movieLinks";d.movies.forEach(m=>{let a=document.createElement("a");a.href="search.html?search="+encodeURIComponent(m.title);if(m.poster){let im=document.createElement("img");im.src=m.poster;im.loading="lazy";a.appendChild(im)}let b=document.createElement("b");b.textContent=m.title+(m.year?" ("+m.year+")":"");a.appendChild(b);box.appendChild(a)});chat.appendChild(box)}}catch(e){wait.textContent="通信に失敗しました。"}finally{send.disabled=false;q.focus()}}send.onclick=()=>ask(q.value);q.addEventListener("keydown",e=>{if(e.key==="Enter")ask(q.value)});document.querySelectorAll(".examples button").forEach(b=>b.onclick=()=>ask(b.textContent));</script><script>(()=>{const b=document.getElementById("gMenuBtn"),d=document.getElementById("gDrawer"),m=document.getElementById("gDrawerMask"),x=document.getElementById("gDrawerClose");if(!b||!d||!m)return;const o=()=>{d.classList.add("show");m.classList.add("show")},c=()=>{d.classList.remove("show");m.classList.remove("show")};b.onclick=o;m.onclick=c;if(x)x.onclick=c})();</script></body></html>
