<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Concierge · CINEMAP</title><style>:root{--bg:#0a0a0a;--p:#151515;--line:#292929;--t:#f3f1ec;--m:#929292;--a:#ef3f3f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",sans-serif}.wrap{max-width:760px;margin:auto;padding:0 18px}.top{height:58px;display:flex;align-items:center;border-bottom:1px solid var(--line)}a{color:inherit;text-decoration:none}.brand{font-size:19px;font-weight:900}.hero{padding:38px 0 22px}.ey{font-size:10px;letter-spacing:.16em;color:var(--a);font-weight:800}.hero h1{font:800 clamp(34px,9vw,62px)/.98 Georgia,serif;margin:10px 0 14px}.hero p{color:var(--m);line-height:1.65}.examples{display:flex;gap:8px;overflow:auto;padding:5px 0 18px}.examples button{white-space:nowrap;background:transparent;color:#bbb;border:1px solid var(--line);border-radius:99px;padding:9px 12px}.chat{min-height:250px;border-top:1px solid var(--line);padding:20px 0 120px}.msg{max-width:88%;padding:13px 15px;border-radius:14px;margin:10px 0;line-height:1.65;white-space:pre-wrap}.user{margin-left:auto;background:#272727}.ai{background:var(--p);border:1px solid var(--line)}.dock{position:fixed;bottom:0;left:0;right:0;background:#0a0a0af2;border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}.row{display:flex;gap:8px}.row input{flex:1;min-width:0;background:#171717;color:#fff;border:1px solid #333;border-radius:12px;padding:14px;font-size:16px}.row button{border:0;border-radius:12px;background:var(--t);color:#111;font-weight:850;padding:0 18px}.note{font-size:10px;color:#666;margin-top:7px}</style></head><body><div class="wrap"><div class="top"><a class="brand" href="index.html">CINEMAP</a></div><section class="hero"><div class="ey">CINEMAP AGENT · BETA</div><h1>映画を、横断して探す。</h1><p>作品カタログ、監督・出演者、評価、日本の配信情報を横断して条件に合う映画を探します。AIの記憶だけで推薦せず、CINEMAPが取得できる作品データを確認して回答します。</p></section><div class="examples"><button>インターステラーが好き。似た映画を5本</button><button>2時間以内で評価の高いSF</button><button>U-NEXTで見られる重厚な映画</button></div><main id="chat" class="chat"><div class="msg ai">観たい映画の条件を入力してください。</div></main></div><div class="dock"><div class="wrap"><div class="row"><input id="q" maxlength="500" placeholder="例：映像が綺麗なSFを5本"><button id="send">送信</button></div><div class="note">AIの回答は作品データに基づきます。配信状況など変動情報は各サービスでもご確認ください。</div></div></div><script>const B="https://backend-one-gray-94.vercel.app",chat=document.getElementById("chat"),q=document.getElementById("q"),send=document.getElementById("send");function add(t,c){let d=document.createElement("div");d.className="msg "+c;d.textContent=t;chat.appendChild(d);scrollTo(0,document.body.scrollHeight)}async function ask(v){v=v.trim();if(!v||send.disabled)return;q.value="";add(v,"user");send.disabled=true;let wait=document.createElement("div");wait.className="msg ai";wait.textContent="作品データを調べています…";chat.appendChild(wait);try{let r=await fetch(B+"/api/agent",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:v})}),d=await r.json();wait.textContent=r.ok?d.answer:(r.status===503?"AIエージェントはAPI設定後に利用できます。":"現在回答できません。少し時間をおいて再度お試しください。")}catch(e){wait.textContent="通信に失敗しました。"}finally{send.disabled=false;q.focus()}}send.onclick=()=>ask(q.value);q.addEventListener("keydown",e=>{if(e.key==="Enter")ask(q.value)});document.querySelectorAll(".examples button").forEach(b=>b.onclick=()=>ask(b.textContent));</script></body></html>
