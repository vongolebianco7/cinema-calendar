<script>
const API="https://backend-one-gray-94.vercel.app",E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),cache=new Map(),app=document.getElementById("app");
function topics(m,dna){
 const dir=(dna.directors||[]).map(x=>x.name).join("、")||m.director||"",writers=(dna.writers||[]).map(x=>x.name).join("、"),photo=(dna.cinematography||[]).map(x=>x.name).join("、"),music=(dna.music||[]).map(x=>x.name).join("、"),genres=(m.genres||[]).join("・"),text=((m.overview||"")+" "+(m.title||"")).toLowerCase(),out=[];
 const themes=[
  {themeKey:"memory",keys:["記憶","memory","忘れ"],title:"記憶は事実か、それとも物語か",hint:"記憶・時間・自己像",q:"この作品で「覚えていること」は事実として扱われているのか、それとも人物が自分を守るために作った物語なのか。",counter:"記憶の曖昧さではなく、現在の選択そのものが主題だと読むこともできる。",inspect:"回想、反復される台詞、同じ出来事が別の角度から提示される場面を見る。"},
  {themeKey:"family",keys:["家族","父","母","親","娘","息子","family"],title:"家族は救いか、拘束か",hint:"親密さ・義務・自立",q:"人物を支えている家族関係が、同時に自由を奪ってはいないか。",counter:"家族を抑圧として読むより、不完全な人間同士の相互扶助として見る余地もある。",inspect:"家族内と家族外で、人物の声・姿勢・選択がどう変わるかを見る。"},
  {themeKey:"violence",keys:["戦争","暴力","殺人","犯罪","war","crime"],title:"暴力は何を正当化している？",hint:"正義・恐怖・報復",q:"暴力が起きたとき、映画は誰の視点に観客を置き、その行為を理解・拒絶させようとしているのか。",counter:"暴力の是非より、暴力を生む制度や環境の描写が中心だと読むこともできる。",inspect:"暴力の直前と直後、被害側と加害側の画面時間・音・説明量を比べる。"},
  {themeKey:"technology",keys:["ai","人工知能","技術","technology","sns"],title:"技術は人間を拡張する？",hint:"技術・主体性・関係性",q:"技術は人物の可能性を広げているのか、それとも判断や関係性を奪っているのか。",counter:"技術そのものではなく、それを使う社会や欲望の側が問題だと読む余地もある。",inspect:"機械・画面・端末が映る場面で、誰が見る側／見られる側なのかを追う。"},
  {themeKey:"love",keys:["恋","愛","romance","love"],title:"愛は相手を見ることか、自分を投影することか",hint:"欲望・理想化・距離",q:"人物は相手そのものを見ているのか、それとも自分の理想や欠落を相手に投影しているのか。",counter:"理想化を未熟さではなく、関係を始めるための想像力と見ることもできる。",inspect:"会話より、視線・距離・沈黙・相手不在時の行動を比べる。"},
  {themeKey:"time",keys:["時間","time","未来","過去"],title:"時間は進んでいるのか、折り畳まれているのか",hint:"時間・因果・選択",q:"この作品の時間構造は、出来事を理解しやすくするための仕掛けか、それとも人物の認識そのものを表しているのか。",counter:"複雑な時間構造より、感情の順序の方が重要だと読むこともできる。",inspect:"同じ出来事の再提示、時間の飛躍、因果が逆転して見える場面を追う。"},
  {themeKey:"loneliness",keys:["孤独","孤立","lonely","alone"],title:"孤独は欠落か、それとも自由か",hint:"孤立・共同体・自律",q:"人物の孤立は克服すべき問題として描かれているのか、それとも他者から距離を取ることで成立する自由なのか。",counter:"孤独そのものより、共同体が人物に要求する役割の方が主題だとも読める。",inspect:"一人でいる場面と集団内にいる場面で、画面の密度・音・会話量を比べる。"},
  {themeKey:"work",keys:["仕事","会社","企業","職場","office","company"],title:"仕事は自己実現か、役割への従属か",hint:"労働・評価・アイデンティティ",q:"人物は仕事を通じて自分を作っているのか、それとも組織に期待される役割へ自分を合わせているのか。",counter:"労働批判ではなく、能力を発揮できる場を探す物語としても読める。",inspect:"仕事中と私生活での口調、身体、判断基準の違いを見る。"},
  {themeKey:"dream",keys:["夢","dream","幻想","幻"],title:"夢や幻想は現実逃避か、真実への近道か",hint:"夢・現実・欲望",q:"非現実的な場面は現実から逃げるためにあるのか、それとも人物の本音や真実をより直接に見せているのか。",counter:"象徴的意味を読み込みすぎず、感情のリズムを作る演出として見る余地もある。",inspect:"夢や幻想に入る直前・直後で、色・音・台詞・編集がどう変わるかを見る。"}
 ];
 const matchedThemes=themes.filter(t=>t.keys.some(k=>text.includes(k))).slice(0,2);matchedThemes.forEach(t=>out.push({...t,kind:"THEME"}));
 out.push(
 {kind:"IMAGE",title:"画面は誰の味方をしている？",hint:photo?"撮影："+photo:"構図・光・色・距離",q:"カメラは誰に近づき、誰から距離を取るのか。画面設計そのものが、観客の共感先を決めていないか。",counter:"画面の距離を感情誘導ではなく、ジャンル上のリズムや情報整理として読むこともできる。",inspect:"クローズアップ／引き、明暗、人物配置が変わる瞬間を見る。"},
 {kind:"STORY",title:"何を見せずに物語を成立させた？",hint:writers?"脚本："+writers:"視点・省略・反復",q:"説明したことより「説明しなかったこと」で、観客に何を補わせているか。",counter:"省略を曖昧さではなく、テンポやジャンル慣習のための圧縮と見ることもできる。",inspect:"重要な決断の直前に省かれた情報、意味が変わる台詞、反復場面を見る。"},
 {kind:"PERFORMANCE",title:"人物は台詞と同じことを考えている？",hint:"表情・声・身体・間",q:"台詞と、表情・声・身体・沈黙が食い違う瞬間はどこか。",counter:"細かな演技より、脚本が与える役割や構造の方が人物を規定しているとも読める。",inspect:"返事までの間、目線、声量や姿勢が変わる場面を見る。"},
 {kind:"SOUND",title:"音は映像に従っている？",hint:music?"音楽："+music:"音楽・環境音・沈黙",q:"音は映像の感情を補強しているのか、それとも逆方向の感情を持ち込むのか。",counter:"対位法ではなく、テンポや没入感を設計する機能として捉えることもできる。",inspect:"音楽が止まる瞬間、環境音だけになる場面、画面外の音に注目する。"},
 {kind:"AUTHOR",title:"この監督らしさは反復か、変化か",hint:dir||"作家性・反復・例外",q:"過去作と似ている部分だけでなく、この作品で初めて変わったものは何か。",counter:"監督中心で読むと、脚本・撮影・編集・俳優の貢献を過小評価する危険もある。",inspect:"主題だけでなく、画面距離、人物配置、終わり方、反復する小道具を比較する。"},
 {kind:"HISTORY",title:"ジャンルの約束を守った？ 裏切った？",hint:genres||"ジャンル・時代・映画史",q:"観客がジャンルに期待する展開・人物・結末をどこまで利用し、どこで外しているか。",counter:"ジャンル更新ではなく、既存の型を巧く使った完成度として見ることもできる。",inspect:"同ジャンルなら当然起きそうな出来事が、起きる／起きないタイミングを見る。"}
 );return out.slice(0,6)
}
function tags(v,kind){
 const t=String(v.title||"").toLowerCase(),a=[],add=x=>{if(!a.includes(x))a.push(x)};
 if(/撮影|映像|画角|カメラ|cinematography|visual|imax/.test(t))add("映像演出");
 if(/脚本|構成|伏線|ストーリー|物語|screenplay|story|ending|考察/.test(t))add("脚本・構造");
 if(/テーマ|意味|解釈|哲学|社会|象徴|メタファー|analysis|meaning/.test(t))add("テーマ解釈");
 if(/監督|director|作家性|演出/.test(t))add("作家論");
 if(/音楽|音響|サウンド|score|music/.test(t))add("音・音楽");
 if(/演技|俳優|character|acting/.test(t))add("演技・人物");
 if(/映画史|ジャンル|genre|history|比較/.test(t))add("映画史・比較");
 if(!a.length){const f={IMAGE:"映像演出",STORY:"脚本・構造",PERFORMANCE:"演技・人物",SOUND:"音・音楽",AUTHOR:"作家論",HISTORY:"映画史・比較"};if(f[kind])add(f[kind])}
 return a.slice(0,3)
}
function compareReason(m,dna,x){
 const genreMap=new Map((dna.genres||[]).map(g=>[Number(g.id),g.name]));
 const shared=(x.genre_ids||[]).map(id=>genreMap.get(Number(id))).filter(Boolean);
 const myYear=Number(m.year||0),otherYear=Number(x.year||0);
 if(shared.length>=2)return "共通ジャンル："+shared.slice(0,2).join(" × ");
 if(shared.length===1)return "共通ジャンル："+shared[0];
 if(myYear&&otherYear&&Math.abs(myYear-otherYear)<=3)return "近い時代の作品（"+otherYear+"年）";
 return "TMDBの関連作品候補";
}
function dnaRoleNote(role){
 return {監督:"演出・作品全体の統括",脚本:"物語・台詞・構成",撮影:"画面・光・カメラ設計",音楽:"劇伴・音楽設計",編集:"時間・リズム・構成"}[role]||"作品づくりの主要スタッフ";
}
function dnaHtmlForRows(rows,m){
 return rows.map(r=>'<div class="dnaCell"><strong>'+E(r[0])+'</strong>'+r[1].map(p=>'<a class="dnaCard" href="discover.html?person='+encodeURIComponent(p.id)+'&role='+encodeURIComponent(r[0])+'&name='+encodeURIComponent(p.name)+'&fromId='+encodeURIComponent(m.tmdbId||m.id||'')+'&from='+encodeURIComponent(m.title)+'">'+E(p.name)+'<span class="dnaRoleNote">'+E(dnaRoleNote(r[0]))+'</span></a>').join("")+'</div>').join("");
}
function creatorFocusHtml(kind,dna){
 kind=lensBase(kind);const map={
