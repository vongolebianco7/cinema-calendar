<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>映画の批評 | Cinemap</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}a{color:inherit}.wrap{max-width:860px;margin:auto;padding:0 18px}.gTop{border-bottom:1px solid #292929;background:#101010}.gNav{height:64px;display:flex;align-items:center;gap:16px}.gLogo{width:145px;max-height:40px;object-fit:contain}.gSearchForm{display:flex;margin-left:auto;min-width:0}.gSearch{min-width:0;background:#1a1a1a;color:#fff;border:1px solid #444;border-radius:8px;padding:8px}.gSearchBtn,.gMenuBtn,.gDrawerClose{border:0;background:none;color:#fff;font-size:24px;cursor:pointer}.gDrawerMask{display:none;position:fixed;inset:0;background:#000a;z-index:8}.gDrawerMask.show{display:block}.gDrawer{position:fixed;z-index:9;right:0;top:0;height:100dvh;width:min(320px,85vw);background:#171717;padding:22px;transform:translateX(100%);transition:transform .2s}.gDrawer.show{transform:translateX(0)}.gDrawerHead{display:flex;justify-content:space-between}.gDrawer>a{display:block;padding:10px;border-bottom:1px solid #333;text-decoration:none}.back{display:inline-block;margin:18px 0;color:#bbb;text-decoration:none}.hero{display:flex;gap:16px;align-items:center;padding:12px 0 24px;border-bottom:1px solid #333}.poster{width:74px;aspect-ratio:2/3;object-fit:cover;border-radius:5px;background:#252525}.hero h1{font-size:clamp(22px,5vw,32px);line-height:1.3;margin:0}.muted{color:#a7a7a7;font-size:14px}.panel{padding:22px 0;border-bottom:1px solid #333}.panel h2{font-size:20px;margin:0 0 12px}.panel p{margin:0 0 10px}.panel ul{margin:0;padding-left:22px}.panel li{margin:0 0 12px}.panel li a{color:#c5d9fb;font-size:14px}.empty{color:#b9b9b9}.sources{display:grid;gap:12px;list-style:none!important;padding:0!important}.sources a{display:block;padding:12px;border:1px solid #444;border-radius:8px;text-decoration:none;font-size:16px!important}.sources small{display:block;color:#aaa}.gate{margin:20px 0;padding:16px;border:1px solid #444;border-radius:10px}.gate button{padding:10px 14px;border:0;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}.deep{padding:24px 0}.deep summary{cursor:pointer}.links{display:flex;gap:12px;overflow-x:auto}.links a{min-width:110px;max-width:130px;text-decoration:none}.links img{width:90px;aspect-ratio:2/3;object-fit:cover}.links span{display:block;font-size:14px}.status{padding:30px 0}@media(max-width:600px){.gNav{gap:7px}.gLogo{width:105px}.gSearch{width:100%}.gSearchForm{flex:1}.panel{padding:18px 0}}
</style></head><body><header class="gTop"><div class="wrap gNav"><a href="index.html"><img class="gLogo" src="assets/cinemap-logo.png?v=2" alt="Cinemap"></a><form class="gSearchForm" action="search.html"><input class="gSearch" name="search" type="search" placeholder="作品を検索" aria-label="作品を検索"><button class="gSearchBtn" aria-label="検索">⌕</button></form><button class="gMenuBtn" id="gMenuBtn" aria-label="メニュー">☰</button></div></header><div class="gDrawerMask" id="gDrawerMask"></div><aside class="gDrawer" id="gDrawer"><div class="gDrawerHead"><a href="index.html"><img class="gLogo" src="assets/cinemap-logo.png?v=2" alt="Cinemap"></a><button class="gDrawerClose" id="gDrawerClose" aria-label="閉じる">×</button></div><a href="index.html">カレンダー</a><a href="discover.html">映画を探す</a><a href="rankings.html">ランキング</a><a href="theaters.html">映画館を探す</a><a href="experience.html">上映方式</a><a href="my-cinemap.html">My Cinemap</a></aside><main class="wrap"><a class="back" id="detailBack" href="search.html">← 作品詳細へ戻る</a><div id="app" class="status">作品を読み込み中…</div></main>
<script src="js/critic-evidence.js"></script><script>
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])), app=document.getElementById("app");
const movieId=m=>String(m.tmdbId||m.id||"");
function renderEvidence(m,data){
 const result=CinemapCriticEvidence.forMovie(data,movieId(m));
 const anchors=ids=>ids.length?' <span class="muted">'+ids.map(id=>{const source=result.sources.find(x=>x.id===id);return source?'<a href="'+E(source.url)+'" target="_blank" rel="noopener noreferrer">'+E(source.name)+'</a>':''}).filter(Boolean).join(' / ')+'</span>':'';
 const list=rows=>'<ul>'+rows.map(row=>'<li>'+E(row.text)+anchors(row.sourceIds)+'</li>').join('')+'</ul>';
 return '<section class="panel"><h2>批評の傾向</h2>'+(result.overview?'<p>'+E(result.overview.text)+'</p>'+anchors(result.overview.sourceIds):'<p class="empty">批評情報がまだ十分に集まっていません。現時点では傾向を判断できるだけの情報がありません。</p>')+'</section>'+
 (result.positive.length?'<section class="panel"><h2>評価されている点</h2>'+list(result.positive)+'</section>':'')+
 (result.divided.length?'<section class="panel"><h2>意見が分かれる点</h2>'+list(result.divided)+'</section>':'')+
 (result.ratio?'<section class="panel"><h2>賛否の傾向</h2><p>今回分析した'+result.ratio.total+'件のうち、肯定的な内容が'+result.ratio.percent+'%。</p><p class="muted">確認した出典に限る集計です。作品全体の評価を表すものではありません。</p></section>':'')+
 (result.sources.length?'<section class="panel"><h2>出典を見る</h2><ul class="sources">'+result.sources.map(source=>'<li><a href="'+E(source.url)+'" target="_blank" rel="noopener noreferrer">'+E(source.name)+'<small>'+E(source.publisher||'')+'</small></a></li>').join('')+'</ul></section>':'');
}
function render(m,data){
 const id=movieId(m),key='cinemap-critic-unlocked-'+id,unlocked=sessionStorage.getItem(key)==='yes',related=m.related||[],dna=m.dna||{};
 document.getElementById('detailBack').href='search.html?'+new URLSearchParams({id,search:m.title||''});
 app.className='';app.innerHTML='<div class="hero">'+(m.poster?'<img class="poster" src="'+E(m.poster)+'" alt="">':'')+'<div><h1>'+E(m.title)+'</h1><div class="muted">'+E(m.year||'')+(m.director?' · '+E(m.director):'')+'</div></div></div>'+
 (unlocked?'':'<div class="gate" id="gate"><p>批評には重要な展開や結末に触れる可能性があります。</p><button id="unlock" type="button">観たので批評を見る</button></div>')+
 '<div id="evidence" '+(unlocked?'':'hidden')+'>'+renderEvidence(m,data)+'<p class="deep"><a href="search.html?id='+encodeURIComponent(id)+'&search='+encodeURIComponent(m.title||'')+'">作品情報・映画DNAへ戻る →</a></p></div>';
 const unlock=document.getElementById('unlock');if(unlock)unlock.onclick=()=>{sessionStorage.setItem(key,'yes');document.getElementById('gate').remove();document.getElementById('evidence').hidden=false};
}
async function load(){
 const p=new URLSearchParams(location.search),id=p.get('id'),title=p.get('search')||p.get('title')||'';
 app.className='status';app.textContent='批評情報を読み込み中…';
 try{
  const evidence=await fetch('data/critic_evidence.json',{cache:'default'});
  if(!evidence.ok)throw Error('evidence');const data=await evidence.json();
  const entry=data.films?.[String(id||'')]||{};
  const m={id,title:entry.title||title||'作品名を確認できませんでした',year:entry.year||'',related:[]};
  render(m,data);
 }catch(e){app.innerHTML='<p>批評情報を読み込めませんでした。</p><button type="button" id="retry">再試行</button>';document.getElementById('retry').onclick=load}
}
load();
const b=document.getElementById('gMenuBtn'),d=document.getElementById('gDrawer'),mask=document.getElementById('gDrawerMask');b.onclick=()=>{d.classList.add('show');mask.classList.add('show')};document.getElementById('gDrawerClose').onclick=mask.onclick=()=>{d.classList.remove('show');mask.classList.remove('show')};
</script></body></html>
