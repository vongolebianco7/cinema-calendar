<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>見る映画を探す | CINEMAP</title><style>
:root{--bg:#090909;--panel:#131313;--line:#292929;--text:#f4f2ed;--muted:#9398a1;--red:#e54848}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:1080px;margin:auto;padding:0 16px}.top{position:sticky;top:0;z-index:20;background:#090909f2;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.nav{height:62px;display:flex;align-items:center;gap:10px}.logo{height:30px}.search{margin-left:auto;display:flex;flex:1;max-width:370px;border:1px solid #333;border-radius:22px;overflow:hidden}.search input{min-width:0;flex:1;background:transparent;border:0;color:#fff;padding:10px 14px;outline:0}.search button{width:42px;border:0;background:transparent;color:#aaa}.back{color:#ddd;text-decoration:none;font-size:12px;font-weight:800}.hero{padding:27px 0 10px}.hero h1{font-size:29px;margin:0 0 7px}.hero p{margin:0;color:var(--muted);line-height:1.6;font-size:14px}.presets,.row{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.presets{padding:17px 0 5px}.preset,.chip{white-space:nowrap;border:1px solid var(--line);background:#141414;color:#eee;border-radius:20px;padding:9px 13px;font-weight:750}.preset.active,.chip.active{background:#eee;color:#111;border-color:#eee}.filters{border:1px solid var(--line);border-radius:13px;padding:14px;margin:14px 0 20px;background:#101010}.label{font-size:11px;color:var(--muted);font-weight:800;margin:13px 0 7px}.label:first-child{margin-top:0}.selects{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}label{font-size:11px;color:var(--muted)}select{width:100%;margin-top:5px;background:#171717;color:#fff;border:1px solid #333;border-radius:8px;padding:10px}.apply{width:100%;margin-top:14px;border:0;border-radius:9px;padding:12px;background:var(--red);color:#fff;font-weight:900}.head{display:flex;align-items:end;justify-content:space-between;margin:20px 0 12px}.head h2{font-size:19px;margin:0}.status{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding-bottom:25px}.card{padding:0;text-align:left;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#111;color:inherit;cursor:pointer}.poster{aspect-ratio:2/3;background:#1c1c1c}.poster img{width:100%;height:100%;object-fit:cover}.body{padding:9px}.title{font-size:13px;font-weight:800;line-height:1.35}.meta{font-size:11px;color:var(--muted);margin-top:5px}.more{display:block;margin:0 auto 40px;border:1px solid #444;background:#171717;color:#fff;border-radius:9px;padding:11px 28px;font-weight:800}.empty{grid-column:1/-1;color:var(--muted);padding:30px 0}.foot{text-align:center;color:#666;font-size:11px;padding:20px 0 40px}@media(max-width:650px){.nav{height:58px}.logo{height:27px}.back{display:none}.hero{padding-top:21px}.hero h1{font-size:25px}.selects{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
</style></head><body><header class="top"><div class="wrap nav"><a href="index.html"><img class="logo" src="assets/cinemap-logo.png?v=2" alt="CINEMAP"></a><form class="search" action="search.html"><input name="search" placeholder="作品を検索"><button>⌕</button></form><a class="back" href="index.html">カレンダー</a></div></header><main class="wrap"><section class="hero"><h1>見る映画を探す</h1><p>タイトルが決まっていなくても、年代・ジャンル・評価・上映時間から映画を掘る。</p><div class="presets"><button class="preset active" data-p="popular">いま人気</button><button class="preset" data-p="rated">高評価</button><button class="preset" data-p="short">90分以内</button><button class="preset" data-p="classic">名作を掘る</button><button class="preset" data-p="new">新しい作品</button></div></section><section class="filters"><div class="label">ジャンル</div><div class="row" id="genres"></div><div class="label">条件</div><div class="selects"><label>年代<select id="era"><option value="">すべて</option><option value="2020">2020年代</option><option value="2010">2010年代</option><option value="2000">2000年代</option><option value="1990">1990年代</option><option value="1980">1980年代</option><option value="1970">1970年代</option><option value="1960">1960年代</option><option value="1950">1950年代</option><option value="1940">1940年代</option><option value="1930">1930年代</option><option value="1920">1920年代</option></select></label><label>最低評価<select id="rating"><option value="">指定なし</option><option value="7">7.0+</option><option value="7.5">7.5+</option><option value="8">8.0+</option></select></label><label>上映時間<select id="runtime"><option value="">指定なし</option><option value="90">90分以内</option><option value="120">120分以内</option><option value="150">150分以内</option></select></label><label>製作国<select id="country"><option value="">すべて</option><option value="JP">日本</option><option value="US">アメリカ</option><option value="GB">イギリス</option><option value="FR">フランス</option><option value="KR">韓国</option><option value="IT">イタリア</option><option value="ES">スペイン</option><option value="DE">ドイツ</option><option value="IN">インド</option></select></label><label>配信<select id="provider"><option value="">すべて</option><option value="8">Netflix</option><option value="9">Prime Video</option><option value="337">Disney+</option><option value="84">U-NEXT</option><option value="15">Hulu</option><option value="350">Apple TV+</option></select></label></div><button class="apply" id="apply">この条件で探す</button></section><div class="head"><h2 id="heading">おすすめ</h2><div class="status" id="status"></div></div><div class="grid" id="grid"></div><button class="more" id="more" style="display:none">もっと見る</button></main><div class="foot">CINEMAP v0.4.47</div><script>
const API="https://backend-one-gray-94.vercel.app",genres=[["すべて",""],["ドラマ","18"],["コメディ","35"],["アクション","28"],["SF","878"],["スリラー","53"],["ホラー","27"],["恋愛","10749"],["アニメ","16"],["犯罪","80"],["ドキュメンタリー","99"],["ファンタジー","14"]];let genre="",preset="popular",page=1,totalPages=1,items=[];const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function genreUI(){$("#genres").innerHTML=genres.map(x=>'<button class="chip '+(x[1]===genre?"active":"")+'" data-g="'+x[1]+'">'+x[0]+'</button>').join("");document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{genre=b.dataset.g;genreUI()})}
function build(){let p=new URLSearchParams({page:String(page)}),era=$("#era").value,r=$("#rating").value,rt=$("#runtime").value,sort="popularity.desc";if(genre)p.set("genre",genre);if(era){p.set("from",era);p.set("to",String(+era+9))}if(r)p.set("rating",r);if(rt)p.set("runtime",rt);let country=$("#country").value,provider=$("#provider").value;if(country)p.set("country",country);if(provider)p.set("provider",provider);if(preset==="rated"){p.set("rating",r||"7.5");p.set("votes","500");sort="vote_average.desc"}if(preset==="short"){p.set("runtime","90");p.set("votes","100");sort="popularity.desc"}if(preset==="classic"){p.set("to","1999");p.set("rating",r||"7.5");p.set("votes","500");sort="vote_average.desc"}if(preset==="new"){p.set("from","2024");sort="primary_release_date.desc"}p.set("sort",sort);return p}
async function load(reset=true){if(reset){page=1;items=[]}$("#status").textContent="読み込み中…";try{let res=await fetch(API+"/api/discover?"+build(),{cache:"no-store"});if(!res.ok)throw Error(res.status);let d=await res.json();totalPages=d.total_pages||1;items=items.concat(d.movies||[]);render();$("#status").textContent=(d.total_results||items.length).toLocaleString()+"作品";$("#more").style.display=page<Math.min(totalPages,20)?"block":"none"}catch(e){$("#status").textContent="取得できませんでした";$("#grid").innerHTML='<div class="empty">作品データを取得できませんでした。</div>';$("#more").style.display="none"}}
function render(){$("#grid").innerHTML=items.map(m=>'<button class="card" data-id="'+m.tmdbId+'"><div class="poster">'+(m.poster?'<img loading="lazy" src="'+E(m.poster)+'">':'')+'</div><div class="body"><div class="title">'+E(m.title)+'</div><div class="meta">'+E(m.year||"")+" · TMDB ★ "+Number(m.score||0).toFixed(1)+'</div></div></button>').join("")||'<div class="empty">条件に合う作品がありません。</div>';document.querySelectorAll(".card").forEach(b=>b.onclick=()=>location.href="search.html?search="+encodeURIComponent(items.find(x=>String(x.tmdbId)===b.dataset.id)?.title||""))}
genreUI();document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{preset=b.dataset.p;document.querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("active",x===b));$("#heading").textContent=b.textContent;load(true)});$("#apply").onclick=()=>load(true);$("#more").onclick=()=>{page++;load(false)};load(true);
</script></body></html>
