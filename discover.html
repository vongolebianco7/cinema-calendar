.gTop{position:sticky;top:0;z-index:90;background:rgba(9,9,9,.97);backdrop-filter:blur(14px);border-bottom:1px solid #262626}.gNav{height:62px;display:flex;align-items:center;gap:12px}.gLogo{display:block;height:31px;width:auto;max-width:180px}.gSearchForm{margin-left:auto;display:flex;align-items:center;width:min(360px,42vw);height:36px;border:1px solid #333;border-radius:18px;background:#111;overflow:hidden}.gSearch{min-width:0;flex:1;height:100%;border:0;outline:0;background:transparent;color:#f2f2f2;padding:0 4px 0 13px}.gSearchBtn{width:38px;height:100%;border:0;background:transparent;color:#aaa;font-size:19px}.gMenuBtn{width:40px;height:40px;border:0;background:transparent;color:#f2f2f2;display:grid;place-items:center}.gMenuLines,.gMenuLines:before,.gMenuLines:after{display:block;width:19px;height:1px;background:currentColor;content:""}.gMenuLines{position:relative}.gMenuLines:before{position:absolute;top:-6px}.gMenuLines:after{position:absolute;top:6px}.gDrawerMask{position:fixed;inset:0;background:#0009;z-index:98;display:none}.gDrawerMask.show{display:block}.gDrawer{position:fixed;top:0;right:0;height:100dvh;width:min(320px,84vw);background:#111318;border-left:1px solid #292929;z-index:99;transform:translateX(100%);transition:.22s ease;padding:20px}.gDrawer.show{transform:translateX(0)}.gDrawerHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.gDrawerClose{width:38px;height:38px;border:0;border-radius:50%;background:#1b1d22;color:#f2f2f2;font-size:22px}.gDrawer a{display:block;color:#f2f2f2;text-decoration:none}.gDrawer>a{font-size:17px;font-weight:750;padding:14px 4px;border-bottom:1px solid #292929}@media(max-width:600px){.gNav{height:58px;gap:8px}.gLogo{height:28px;max-width:150px}.gSearchForm{width:auto;flex:1;min-width:0;height:34px}.gSearchBtn{width:32px}.gMenuBtn{width:36px}}</style></head><body><header class="gTop"><div class="wrap gNav"><a href="index.html"><img class="gLogo" src="assets/cinemap-logo.png?v=2" alt </aside><main class="wrap"><section class="hero"><h1>見る映画を探す</h1><p>タイトルが決まっていなくても、年代・ジャンル・評価・上映時間・配信先から映画を掘る。受賞作やチャートからも辿れます。</p><div class="presets"><button class="preset active" data-p="popular">いま人気</button><button class="preset" data-p="rated">高評価</button><button class="preset" data-p="short">90分以内</button><button class="preset" data-p="classic">名作を掘る</button><button class="preset" data-p="new">新しい作品</button><a class="preset" href="rankings.html?axis=awards" style="text-decoration:none">受賞作から探す</a><a class="preset" href="rankings.html" style="text-decoration:none">ランキングから探す</a></div></section><section class="personMode" id="personMode"><div class="personModeKicker">MOVIE DNA · CREATOR PATH</div><h2 id="personModeTitle"></h2><p id="personModeText"></p><div class="personModeActions" id="personModeActions"></div></section><section class="filters"><div class="label">ジャンル</div><div class="row" id="genres"></div><div class="label">条件</div><div class="selects"><label>年代<select id="era"><option value="">すべて</option><option value="2020">2020年代</option><option value="2010">2010年代</option><option value="2000">2000年代</option><option value="1990">1990年代</option><option value="1980">1980年代</option><option value="1970">1970年代</option><option value="1960">1960年代</option><option value="1950">1950年代</option><option value="1940">1940年代</option><option value="1930">1930年代</option><option value="1920">1920年代</option></select></label><label>最低評価<select id="rating"><option value="">指定なし</option><option value="7">7.0+</option><option value="7.5">7.5+</option><option value="8">8.0+</option></select></label><label>上映時間<select id="runtime"><option value="">指定なし</option><option value="90">90分以内</option><option value="120">120分以内</option><option value="150">150分以内</option></select></label><label>製作国<select id="country"><option value="">すべて</option><option value="JP">日本</option><option value="US">アメリカ</option><option value="GB">イギリス</option><option value="FR">フランス</option><option value="KR">韓国</option><option value="IT">イタリア</option><option value="ES">スペイン</option><option value="DE">ドイツ</option><option value="IN">インド</option></select></label><label>配信<select id="provider"><option value="">すべて</option><option value="8">Netflix</option><option value="9">Prime Video</option><option value="337">Disney+</option><option value="84">U-NEXT</option><option value="15">Hulu</option><option value="350">Apple TV+</option></select></label><label class="personBox">監督<input class="personInput" id="director" placeholder="例：ノーラン"><div class="suggest" id="directorSuggest" hidden></div></label><label class="personBox">俳優<input class="personInput" id="cast" placeholder="例：ブラッド・ピット"><div class="suggest" id="castSuggest" hidden></div></label></div><button class="apply" id="apply">この条件で探す</button></section><div class="head"><h2 id="heading">おすすめ</h2><div class="status" id="status"></div></div><div class="grid" id="grid"></div><button class="more" id="more" style="display:none">もっと見る</button></main><div class="foot">Cinemap v1.1.0</div><script>
const API="https://backend-one-gray-94.vercel.app",genres=[["すべて",""],["ドラマ","18"],["コメディ","35"],["アクション","28"],["SF","878"],["スリラー","53"],["ホラー","27"],["恋愛","10749"],["アニメ","16"],["犯罪","80"],["ドキュメンタリー","99"],["ファンタジー","14"]];let genre="",preset="popular",page=1,totalPages=1,items=[],directorId="",castId="";const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function genreUI(){$("#genres").innerHTML=genres.map(x=>'<button class="chip '+(x[1]===genre?"active":"")+'" data-g="'+x[1]+'">'+x[0]+'</button>').join("");document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{genre=b.dataset.g;genreUI()})}
function build(){let p=new URLSearchParams({page:String(page)}),era=$("#era").value,r=$("#rating").value,rt=$("#runtime").value,sort="popularity.desc";if(genre)p.set("genre",genre);if(era){p.set("from",era);p.set("to",String(+era+9))}if(r)p.set("rating",r);if(rt)p.set("runtime",rt);let country=$("#country").value,provider=$("#provider").value;if(country)p.set("country",country);if(provider)p.set("provider",provider);if(directorId)p.set("crew",directorId);if(castId)p.set("cast",castId);if(preset==="rated"){p.set("rating",r||"7.5");p.set("votes","500");sort="vote_average.desc"}if(preset==="short"){p.set("runtime","90");p.set("votes","100");sort="popularity.desc"}if(preset==="classic"){p.set("to","1999");p.set("rating",r||"7.5");p.set("votes","500");sort="vote_average.desc"}if(preset==="new"){p.set("from","2024");sort="primary_release_date.desc"}p.set("sort",sort);return p}
async function load(reset=true){if(reset){page=1;items=[]}$("#status").textContent="読み込み中…";try{let res=await fetch(API+"/api/discover?"+build(),{cache:"no-store"});if(!res.ok)throw Error(res.status);let d=await res.json();totalPages=d.total_pages||1;items=items.concat(d.movies||[]);render();$("#status").textContent=(d.total_results||items.length).toLocaleString()+"作品";$("#more").style.display=page<Math.min(totalPages,20)?"block":"none"}catch(e){$("#status").textContent="取得できませんでした";$("#grid").innerHTML='<div class="empty">作品データを取得できませんでした。</div>';$("#more").style.display="none"}}
function render(){$("#grid").innerHTML=items.map(m=>'<button class="card" data-id="'+m.tmdbId+'"><div class="poster">'+(m.poster?'<img loading="lazy" src="'+E(m.poster)+'">':'')+'</div><div class="body"><div class="title">'+E(m.title)+'</div><div class="meta">'+E(m.year||"")+" · TMDB ★ "+Number(m.score||0).toFixed(1)+'</div></div></button>').join("")||'<div class="empty">条件に合う作品がありません。</div>';document.querySelectorAll(".card").forEach(b=>b.onclick=()=>location.href="search.html?id="+encodeURIComponent(b.dataset.id)+"&search="+encodeURIComponent(items.find(x=>String(x.tmdbId)===b.dataset.id)?.title||""))}
async function people(inputId,boxId,kind){const el=$("#"+inputId),box=$("#"+boxId);let timer;el.oninput=()=>{if(kind==="director")directorId="";else castId="";clearTimeout(timer);const q=el.value.trim();if(q.length<2){box.hidden=true;return}timer=setTimeout(async()=>{try{const d=await (await fetch(API+"/api/people?q="+encodeURIComponent(q))).json();box.innerHTML=(d.people||[]).map(x=>'<button data-id="'+x.id+'" data-name="'+E(x.name)+'">'+E(x.name)+'<small>'+E(x.department||"")+(x.known_for?.length?" · "+E(x.known_for.join(" / ")):"")+'</small></button>').join("");box.hidden=!box.innerHTML;box.querySelectorAll("button").forEach(b=>b.onclick=()=>{el.value=b.dataset.name;if(kind==="director")directorId=b.dataset.id;else castId=b.dataset.id;box.hidden=true})}catch{box.hidden=true}},250)}}people("director","directorSuggest","director");people("cast","castSuggest","cast");const qp=new URLSearchParams(location.search),person=qp.get("person"),role=qp.get("role"),personName=qp.get("name"),fromId=qp.get("fromId"),fromTitle=qp.get("from");if(person){if(role==="監督"||role==="脚本"||role==="撮影"||role==="音楽"||role==="編集"){directorId=person;$("#director").value=personName||""}else{castId=person;$("#cast").value=personName||""}const pm=$("#personMode"),label=role||"作り手",roleText={監督:"演出と作品全体の統括",脚本:"物語・台詞・構成",撮影:"画面・光・カメラ設計",音楽:"劇伴・音楽設計",編集:"時間・リズム・構成",出演:"演技・人物表現"}[label]||"この人物が関わった作品";pm.classList.add("show");$("#personModeTitle").textContent=(personName||"人物")+" · "+label;$("#personModeText").textContent=roleText+"という視点で、この人物のフィルモグラフィーを辿ります。";$("#personModeActions").innerHTML='<a href="discover.html">通常の映画探索へ戻る</a>'+(fromId?'<a href="critic.html?id='+encodeURIComponent(fromId)+'">元の作品のCritic Mapへ戻る</a>':'');if(fromId||fromTitle){const origin=document.createElement("div");origin.className="originCard";origin.innerHTML='<strong>この作り手を辿った元の作品</strong>'+(fromId?'<a href="search.html?id='+encodeURIComponent(fromId)+'">'+E(fromTitle||"作品詳細へ戻る")+'</a>':E(fromTitle||""));pm.appendChild(origin)};$("#heading").textContent=(personName||"人物")+"の作品"}genreUI();document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{preset=b.dataset.p;document.querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("active",x===b));$("#heading").textContent=b.textContent;load(true)});$("#apply").onclick=()=>load(true);$("#more").onclick=()=>{page++;load(false)};load(true);
</script><script>(()=>{const b=document.getElementById("gMenuBtn"),d=document.getElementById("gDrawer"),m=document.getElementById("gDrawerMask"),x=document.getElementById("gDrawerClose");if(!b||!d||!m)return;const o=()=>{d.classList.add("show");m.classList.add("show")},c=()=>{d.classList.remove("show");m.classList.remove("show")};b.onclick=o;m.onclick=c;if(x)x.onclick=c})();</script></body></html>
