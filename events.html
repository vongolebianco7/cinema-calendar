</style><style id="outdoor-review-alignment">.filmCards>.outdoorFilmWrap{display:flex;flex-direction:column;min-width:0;height:100%}.outdoorFilmWrap>.filmCard{flex:1 1 auto;min-width:0}.outdoorFilmReview{margin-top:auto;min-height:42px;min-width:0}.outdoorFilmReview:empty{min-height:0}.outdoorFilmWrap .filmPoster,.outdoorFilmWrap .filmPlaceholder{width:100%;aspect-ratio:2/3;object-fit:cover}.outdoorFilmWrap .filmMeta{font-weight:600;line-height:1.5}</style><script src="js/cinelva-movie-identity.js?v=20261020-poster-recovery"></script><link rel="apple-touch-icon" href="assets/411DC24B-E557-4A36-95D2-5FA3550E7BD7.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a0c0f"><meta property="og:image" content="https://cinelva.vercel.app/assets/411DC24B-E557-4A36-95D2-5FA3550E7BD7.png"></head><body><header><div class="wrap nav"><a class="brand" href="index.html" aria-label="Cinelva"><img src="assets/411DC24B-E557-4A36-95D2-5FA3550E7BD7.png" alt="" style="width:32px;height:32px;object-fit:contain"><span>Cinelva</span></a><a href="index.html">映画カレンダーに戻る ↗</a></div></header><main class="wrap"><h1>映画カレンダー</h1><p class="lead">東京・神奈川の野外映画祭・屋外上映イベント</p><nav class="tabs" aria-label="カレンダーの種類"><a href="index.html" >劇場公開</a><a href="index.html">配信公開</a><a href="index.html">テレビ放映</a><a href="index.html">映画祭</a><a class="active" href="events.html" aria-current="page">イベント</a></nav><div class="filters" id="filters"><button class="active" data-area="all">すべて</button><button data-area="東京">東京</button><button data-area="神奈川">神奈川</button></div><div class="layout"><section class="panel"><div class="calhead"><button id="prev" aria-label="前の月">‹</button><strong id="month"></strong><button id="next" aria-label="次の月">›</button></div><div class="week"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span></div><div class="days" id="days"></div></section><section class="panel list"><h2>上映イベント</h2><div id="events"></div></section></div><p class="notice">掲載情報は公式発表をもとにした一部のイベントです。開催変更・中止、上映時間、予約の要否は必ず主催者の公式ページでご確認ください。未確認のイベントや上映作品は掲載しません。</p></main><script>
let events=[];const outdoorMovieByTitle=new Map();const TMDB_POSTER_CACHE_KEY="cinelva.events.posters.v1";let posterCache={};try{posterCache=JSON.parse(localStorage.getItem(TMDB_POSTER_CACHE_KEY)||"{}")}catch(e){}
const fallbackEvents=[
{id:"green-carpet-20261031",date:"2026-10-31",name:"Green Carpet Theater",area:"神奈川",place:"川崎競馬場",url:"https://yomiuriland-kawasakikeiba.com/2026/07/1739/",fee:"無料",movie:"",time:""},
{id:"sumida-20261010",date:"2026-10-10",name:"すみだパークシネマフェスティバル",area:"東京",place:"墨田区",movie:"ルックバック",url:"https://sumidapark-cinema.com/"},
{id:"sumida-20261011",date:"2026-10-11",name:"すみだパークシネマフェスティバル",area:"東京",place:"墨田区",movie:"ロボット・ドリームズ",tmdbId:838240,release_year:2023,poster_url:"https://image.tmdb.org/t/p/w500/43ZVm39EmBxru66yWzfQSnTf3Hc.jpg",url:"https://sumidapark-cinema.com/"},

];;
async function loadEvents(){try{const response=await fetch("data/outdoor-events.json",{cache:"no-store"});if(!response.ok)throw Error("unavailable");const data=await response.json();if(!Array.isArray(data.events))throw Error("invalid");const domestic=await fetch("data/events.json").then(r=>r.ok?r.json():{events:[]}).catch(()=>({events:[]}));const extras=(domestic.events||[]).filter(ev=>ev.service==="国内イベント").map(ev=>({id:"domestic-event:"+ev.title,date:ev.date,start_date:ev.date,end_date:ev.end_date||ev.date,name:ev.title,area:/神奈川|横浜|川崎/.test(ev.venue||"")?"神奈川":/千葉|幕張/.test(ev.venue||"")?"千葉":/東京/.test(ev.venue||"")?"東京":"その他",place:ev.venue||"",url:ev.source_url||"",movie:""}));events=[...data.events,...extras,...fallbackEvents.filter(f=>!data.events.some(e=>e.id===f.id))]}catch(error){events=fallbackEvents;console.warn("Event feed unavailable",error)}render();hydratePosters()}

const $=s=>document.querySelector(s);let view=new Date();view.setDate(1);let area="all";
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function filtered(){return events.filter(e=>area==="all"||e.area===area)}
function eventKey(e){return e.event_id||e.name+"|"+e.area+"|"+e.place}
function groups(){let map=new Map();for(let e of filtered()){let key=eventKey(e);if(!map.has(key))map.set(key,{...e,screenings:[],start_date:e.start_date||e.date,end_date:e.end_date||e.date});let g=map.get(key);if((e.start_date||e.date)<g.start_date)g.start_date=e.start_date||e.date;if((e.end_date||e.date)>g.end_date)g.end_date=e.end_date||e.date;if(e.movie)g.screenings.push(e)}return [...map.values()].sort((a,b)=>a.start_date.localeCompare(b.start_date))}
async function hydratePosters(){let changed=false;for(const e of events){if(!e.movie)continue;const identity=window.CinelvaMovieIdentity,query={title:e.movie,tmdbId:e.tmdb_id||e.tmdbId,year:e.release_year,poster:e.poster_url};const known=identity?.id(query)&&identity?.normalizePoster(e.poster_url)?identity.ingest(query):null;const hit=known||await identity?.fetchOne(query);if(!hit)continue;e.tmdbId=hit.tmdbId;e.poster_url=hit.poster;outdoorMovieByTitle.set(e.movie,hit);changed=true}if(changed)render();else mountOutdoorReviews()}

function filmCard(e){const name=esc(e.movie),movie=outdoorMovieByTitle.get(e.movie)||window.CinelvaMovieIdentity?.resolve({title:e.movie,year:e.release_year||e.year})||null;const id=Number(e.tmdb_id||e.tmdbId||movie?.tmdbId||movie?.id||0);const url="search.html?"+new URLSearchParams({...id?{id:String(id)}:{},search:e.movie});const posterUrl=window.CinelvaMovieIdentity?.posterFor(movie)||e.poster_url||movie?.poster||"";const poster=posterUrl?'<img class="filmPoster" loading="lazy" src="'+esc(posterUrl)+'" alt="'+name+'のポスター">':'<div class="filmPlaceholder">POSTER</div>';const date=e.date?new Date(e.date+"T12:00:00"):null;const when=date&&!isNaN(date)?(date.getMonth()+1)+"月"+date.getDate()+"日":(e.date||"日付未発表");const time=e.time||e.start_time||"開始時刻未発表";return '<div class="outdoorFilmWrap"><a class="filmCard" href="'+esc(url)+'">'+poster+'<div class="filmCardBody"><div class="filmTitle">'+name+'</div><div class="filmMeta">'+esc(when)+' · '+esc(time)+'</div></div></a><div class="outdoorFilmReview" data-outdoor-film="'+name+'" data-outdoor-id="'+(id||"")+'"></div></div>'}
function mountOutdoorReviews(){document.querySelectorAll('[data-outdoor-film]').forEach(el=>{if(el.dataset.gaugeMounted)return;const title=el.dataset.outdoorFilm;const m=outdoorMovieByTitle.get(title)||window.CinelvaMovieIdentity?.resolve({title})||{};const id=Number(el.dataset.outdoorId||m.tmdbId||m.id||0);if(id>0)window.CinelvaQuickRate?.mountInline(el,{...m,id,tmdbId:id,title:m.title||title})})}
function render(){let y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,monthEnd=new Date(y,m+1,0),total=Math.ceil((offset+monthEnd.getDate())/7),today=new Date(),gs=groups();$("#month").textContent=y+"年"+(m+1)+"月";let calendar="";for(let w=0;w<total;w++){let ws=new Date(y,m,1-offset+w*7),we=new Date(ws);we.setDate(ws.getDate()+6);let week=gs.filter(g=>new Date(g.start_date+"T12:00:00")<=we&&new Date(g.end_date+"T12:00:00")>=ws);calendar+='<div class="calendarRange">';for(let k=0;k<7;k++){let d=new Date(ws);d.setDate(ws.getDate()+k);calendar+='<div class="rangeDay" style="grid-column:'+(k+1)+';grid-row:1">'+d.getDate()+'</div>'}for(let i=0;i<week.length;i++){let g=week[i],a=new Date(g.start_date+"T12:00:00"),z=new Date(g.end_date+"T12:00:00"),left=a>ws?a:ws,right=z<we?z:we,from=((left.getDay()+6)%7)+1,to=((right.getDay()+6)%7)+2;calendar+='<a class="rangeBar" href="#event-'+encodeURIComponent(eventKey(g))+'" style="grid-column:'+from+'/'+to+';grid-row:'+(i+2)+'" title="'+esc(g.name)+'">'+(a<ws?'← ':'')+esc(g.name)+(z>we?' →':'')+'</a>'}calendar+='</div>'}$("#days").outerHTML='<div id="days">'+calendar+'</div>';let visible=gs.filter(g=>g.start_date<=y+"-"+String(m+1).padStart(2,"0")+"-"+String(monthEnd.getDate()).padStart(2,"0")&&g.end_date>=y+"-"+String(m+1).padStart(2,"0")+"-01");$("#events").innerHTML=visible.length?visible.map(g=>'<section class="eventGroup" id="event-'+encodeURIComponent(eventKey(g))+'"><div class="date">'+esc(g.start_date)+' 〜 '+esc(g.end_date)+' · '+esc(g.area)+'</div><h3>'+esc(g.name)+'</h3><p class="detail">'+esc(g.place)+(g.fee?' · '+esc(g.fee):'')+'</p><a class="source" href="'+esc(g.url)+'" target="_blank" rel="noopener noreferrer">公式情報 ↗</a>'+(g.screenings.length?'<div class="filmCards">'+g.screenings.sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.time||'').localeCompare(String(b.time||''))).map(filmCard).join("")+'</div>':'<p class="empty">上映作品は確認中です</p>')+'</section>').join("") :'<p class="empty">この月に掲載できる確認済みイベントはありません。</p>';mountOutdoorReviews()}
$("#prev").onclick=()=>{view.setMonth(view.getMonth()-1);render()};$("#next").onclick=()=>{view.setMonth(view.getMonth()+1);render()};document.querySelectorAll("[data-area]").forEach(b=>b.onclick=()=>{area=b.dataset.area;document.querySelectorAll("[data-area]").forEach(x=>x.classList.toggle("active",x===b));render()});loadEvents();
</script><script src="js/cinelva-library-records.js"></script><script src="js/cinelva-quick-rate.js"></script><script>mountOutdoorReviews();</script></body></html>
