<style>
:root{color-scheme:dark;--bg:#0a0a0a;--panel:#121212;--line:#292929;--fg:#f2f2f2;--muted:#aaa;--red:#ef3f3f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}a{color:inherit}button,select{font:inherit}.wrap{max-width:1180px;margin:auto;padding:0 18px}header{border-bottom:1px solid var(--line)}.nav{min-height:56px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:850;text-decoration:none;letter-spacing:-.04em}.nav a:last-child{color:var(--muted);text-decoration:none}h1{font-size:28px;margin:23px 0 2px}p.lead{color:var(--muted);margin:0 0 18px}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}.tabs a{padding:12px 0;color:var(--muted);text-decoration:none;font-weight:650}.tabs a.active{color:#fff;border-bottom:2px solid var(--red)}.filters{display:flex;gap:8px;margin:20px 0 12px;flex-wrap:wrap}.filters button{border:1px solid #383838;background:#171717;color:#ddd;border-radius:7px;padding:8px 13px;cursor:pointer}.filters button.active{border-color:var(--red);color:#fff;background:#302022}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(270px,1fr);gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.calhead button{background:#242424;border:0;color:#fff;border-radius:6px;padding:7px 13px;cursor:pointer}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week span{text-align:center;color:#999;font-size:11px}.days{margin-top:6px}.day{min-height:90px;background:#191919;border:1px solid #303030;border-radius:6px;padding:5px;overflow:hidden}.day.other{opacity:.3}.day.today{border-color:var(--red)}.num{font-size:11px;color:#ccc}.pill{display:block;width:100%;margin-top:4px;padding:4px;border:0 </style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">Cinelva</a><a href="index.html">映画カレンダーに戻る ↗</a></div></header><main class="wrap"><h1>映画カレンダー</h1><p class="lead">東京・神奈川の野外映画祭・屋外上映イベント</p><nav class="tabs" aria-label="カレンダーの種類"><a href="index.html" >劇場公開</a><a href="index.html">配信公開</a><a href="index.html">テレビ放映</a><a href="index.html">映画祭</a><a class="active" href="events.html" aria-current="page">イベント</a></nav><div class="filters" id="filters"><button class="active" data-area="all">すべて</button><button data-area="東京">東京</button><button data-area="神奈川">神奈川</button></div><div class="layout"><section class="panel"><div class="calhead"><button id="prev" aria-label="前の月">‹</button><strong id="month"></strong><button id="next" aria-label="次の月">›</button></div><div class="week"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span></div><div class="days" id="days"></div></section><section class="panel list"><h2>上映イベント</h2><div id="events"></div></section></div><p class="notice">掲載情報は公式発表をもとにした一部のイベントです。開催変更・中止、上映時間、予約の要否は必ず主催者の公式ページでご確認ください。未確認のイベントや上映作品は掲載しません。</p></main><script>
let events=[];const fallbackEvents=

{id:"sumida-20261010",date:"2026-10-10",name:"すみだパークシネマフェスティバル",area:"東京",place:"墨田区",movie:"ルックバック",url:"https://sumidapark-cinema.com/"},

];;
async function loadEvents(){try{const response=await fetch("data/outdoor-events.json",{cache:"no-store"});if(!response.ok)throw Error("unavailable");const data=await response.json();if(!Array.isArray(data.events))throw Error("invalid");events=[...data.events,...fallbackEvents.filter(f=>!data.events.some(e=>e.id===f.id))]}catch(error){events=fallbackEvents;console.warn("Event feed unavailable",error)}render()}

const $=s=>document.querySelector(s);let view=new Date();view.setDate(1);let area="all";
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function filtered(){return events.filter(e=>area==="all"||e.area===area)}
function render(){let y=view.getFullYear(),m=view.getMonth(),today=new Date(),start=(new Date(y,m,1).getDay()+6)%7,count=new Date(y,m+1,0).getDate();$("#month").textContent=y+"年"+(m+1)+"月";let byDate=new Map();filtered().forEach(e=>{if(!byDate.has(e.date))byDate.set(e.date,[]);byDate.get(e.date).push(e)});let html="";for(let i=0;i<Math.ceil((start+count)/7)*7;i++){let n=i-start+1,valid=n>=1&&n<=count,iso=valid?y+"-"+String(m+1).padStart(2,"0")+"-"+String(n).padStart(2,"0"):"",todayClass=valid&&y===today.getFullYear()&&m===today.getMonth()&&n===today.getDate()?" today":"";html+='<div class="day'+(valid?"":" other")+todayClass+'"><span class="num">'+(valid?n:"")+'</span>'+(byDate.get(iso)||[]).map(e=>'<button class="pill" data-id="'+esc(e.id)+'">'+esc(e.movie||e.name)+'</button>').join("")+'</div>'}$("#days").innerHTML=html;let monthEvents=filtered().filter(e=>e.date.slice(0,7)===y+"-"+String(m+1).padStart(2,"0")).sort((a,b)=>a.date.localeCompare(b.date));$("#events").innerHTML=monthEvents.length?monthEvents.map(e=>'<article class="item" id="'+esc(e.id)+'"><div class="date">'+esc(e.date.replaceAll("-","/"))+' · '+esc(e.area)+'</div><h3>'+esc(e.name)+'</h3><p class="detail">'+esc(e.place)+(e.movie?" · 上映作品："+esc(e.movie):"")+(e.fee?" · "+esc(e.fee):"")+'</p>'+(e.movie?'<a href="search.html?search='+encodeURIComponent(e.movie)+'">作品を探す ↗</a>　':"")+'<a href="'+esc(e.url)+'" target="_blank" rel="noopener noreferrer">公式情報 ↗</a></article>').join(""):'<p class="empty">この月に掲載できる確認済みイベントはありません。</p>';document.querySelectorAll(".pill").forEach(b=>b.addEventListener("click",()=>document.getElementById(b.dataset.id)?.scrollIntoView({behavior:"smooth",block:"center"})))}
$("#prev").onclick=()=>{view.setMonth(view.getMonth()-1);render()};$("#next").onclick=()=>{view.setMonth(view.getMonth()+1);render()};document.querySelectorAll("[data-area]").forEach(b=>b.onclick=()=>{area=b.dataset.area;document.querySelectorAll("[data-area]").forEach(x=>x.classList.toggle("active",x===b));render()});loadEvents();
</script></body></html>
