<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>ご意見・ご要望 | Cinelva</title><link rel="stylesheet" href="assets/theme.css"><link rel="stylesheet" href="assets/feedback.css"><script src="js/theme.js?v=20261104-feedback"></script><script src="js/cinelva-feedback.js" defer></script><style>body{min-height:100dvh}</style><link rel="icon" href="assets/cinelva_original_colors_transparent.png" type="image/png"><link rel="apple-touch-icon" href="assets/cinelva_original_colors_transparent.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a0c0f"><meta property="og:image" content="https://cinelva.vercel.app/assets/cinelva_original_colors_transparent.png"></head><body><main class="feedbackWrap"><a class="feedbackBrand" href="index.html"><img src="assets/cinelva_original_colors_transparent.png" alt="">Cinelva</a><h1>ご意見・ご要望</h1><p>不具合・改善のご要望・ご感想をお寄せください。ログインは不要です。</p><p class="feedbackHelp">投稿は運営者のみが確認します。氏名・住所・パスワード・鑑賞履歴などは入力しないでください。すべてのご要望への対応や返信をお約束するものではありません。</p><form id="feedbackForm"><label for="kind">種別</label><select id="kind" name="kind"><option value="bug">不具合</option><option value="idea">改善要望</option><option value="comment">感想</option></select><label for="body">内容（必須・3〜4,000文字）</label><textarea id="body" name="body" rows="8" minlength="3" maxlength="4000" required></textarea><label for="email">メールアドレス（返信をご希望の場合のみ）</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254"><div class="feedbackTrap" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div><p class="feedbackHelp"><a href="privacy.html">プライバシーポリシー</a>をご確認のうえ送信してください。</p><button type="submit">送信する</button><p id="feedbackMessage" class="feedbackMessage" role="status" aria-live="polite"></p></form><a href="index.html">Cinelvaへ戻る</a></main></body></html>
