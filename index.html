/* CINEMAP visual pass: flatter, quieter, editorial rather than dashboard-like */
body{background:#090909}
.wrap{max-width:1240px}
.top{background:#fff;border-bottom:1px solid #e9e9e9}
.nav{height:54px}
.hero{padding:22px 0 8px;border-bottom:0}
.hero h1{font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0 0 14px}
.modeTabs{display:flex;gap:22px;margin:0 0 8px;border-bottom:1px solid var(--line)}
.modeTab{flex:0 0 auto;border:0;background:transparent;padding:11px 0 10px;border-radius:0;color:var(--muted);font-weight:600}
.modeTab.active{background:transparent;color:var(--text);border:0;box-shadow:inset 0 -1px 0 var(--text);font-weight:700}
.chips{gap:6px;padding:8px 0 16px}
.chip{background:transparent;border:1px solid #2b2b2b;padding:7px 10px;color:#aaa}
.chip.active{background:#f0f0f0;color:#111;border-color:#f0f0f0}
.section{padding:14px 0 30px}
.sectionHead{margin-bottom:10px}
.section h2{font-size:15px;font-weight:700;letter-spacing:0}
.grid{gap:14px 10px}
.card{background:transparent;border:0;border-radius:0;transition:none}
.card:hover{transform:none}
.poster{background:#161616;border-radius:2px}
.body{padding:7px 0 0}
.title{font-size:12px;font-weight:600}
.meta{margin-top:5px;gap:5px}
.tag{background:transparent;border:1px solid #292929;color:#8f8f8f;padding:2px 5px;border-radius:3px}
.score{color:#aaa;font-weight:600}
.calendar{background:transparent;border:0;border-radius:0;padding:0}
.calHead{padding:2px 0 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.calHead button{background:transparent;border:1px solid var(--line);border-radius:4px;padding:7px 10px}
.day{border:1px solid #222;border-radius:3px;background:#0d0d0d}
.day.today{border:1px solid #666;background:#101010;box-shadow:none}
.day.today b{background:transparent;color:var(--text);padding:0}
.dot{border-radius:2px}
.detailSection{background:transparent!important;border:0!important;border-top:1px solid var(--line)!important;border-radius:0!important;padding:14px 0!important;margin:0!important}
.detailSection:first-of-type{border-top:0!important}
.detailSection.info,.detailSection.release,.detailSection.streaming,.detailSection.tv,.detailSection.location,.detailSection.history,.detailSection.story,.detailSection.theater,.detailSection.linksSec{border-left:0!important}
.detailSection h3{font-size:13px;font-weight:700;margin-bottom:10px}
.contextGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.contextCard{border:1px solid #292929;border-radius:5px;padding:10px;display:grid;gap:5px}
.contextCard b{font-size:11px}.contextCard span{font-size:11px;color:#aaa;line-height:1.55}
.traceGroup{margin-top:16px}.traceTitle{display:block;font-size:12px;margin-bottom:9px;color:#ddd}
.timelineHead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}.timelineHead h3{font-size:17px;margin:2px 0 0}.movieTimeline{margin-top:8px}.timelineItem{display:grid;grid-template-columns:18px 1fr;gap:10px;min-height:72px}.timelineRail{position:relative}.timelineRail:before{content:"";position:absolute;left:7px;top:0;bottom:0;width:1px;background:#333}.timelineRail i{position:absolute;left:3px;top:7px;width:9px;height:9px;border-radius:50%;background:#ddd;border:2px solid #101010;z-index:1}.timelineBody{padding:0 0 19px}.timelineMeta{display:flex;align-items:center;gap:8px;margin-bottom:4px}.timelineMeta time{font-size:11px;color:#ddd;font-variant-numeric:tabular-nums}.timelineMeta span{font-size:9px;letter-spacing:.08em;color:#888}.timelineBody>b{font-size:13px}.timelineNote{margin-top:5px;color:#777}.timelineCaution{margin:5px 0 0;color:#777;line-height:1.6}
@media(max-width:600px){.contextGrid{grid-template-columns:1fr}}
.sheet{background:#101010;border-radius:10px 10px 0 0;padding:20px 18px}
.close{background:transparent;border:1px solid var(--line);box-shadow:none;border-radius:50%;width:36px;height:36px}
.links{margin-top:10px}
.links a{background:transparent;color:var(--text);border:1px solid #343434;border-radius:4px;padding:8px 10px;font-weight:600}
.historyEntry,.locationCard,.theaterBox{background:transparent!important;border:1px solid #272727!important;border-radius:4px!important}
.watchSummaryRow{padding:10px 0}
.watchSummaryLabel{font-weight:600}
.search{background:transparent;border-color:#292929;border-radius:4px}
.searchResults{background:#111;border-color:#292929;border-radius:4px}
.drawer{background:#0d0d0d}
.drawerClose{background:transparent;border:1px solid var(--line)}
@media(max-width:760px){
  .wrap{padding:0 14px}
  .hero{padding-top:16px}
  .hero h1{font-size:18px}
  .modeTabs{gap:16px;overflow-x:auto;scrollbar-width:none}
  .modeTab{font-size:12px;white-space:nowrap}
  .grid{gap:12px 8px}
  .sheet{border-radius:8px 8px 0 0}
}

.brand{display:flex;align-items:center;text-decoration:none;min-width:104px}
.brandLogo{display:block;width:auto;height:34px;object-fit:contain}
.top .brandLogo{height:32px}
.heroActions{margin-top:16px;display:flex;gap:9px;flex-wrap:wrap}
.heroAction{display:inline-flex;align-items:center;text-decoration:none;font-weight:800;border-radius:8px;padding:10px 14px;border:1px solid #d8d8d8;color:#202124;background:#f2f0eb}
.heroAction.alt{background:#e8edf0}
.heroAction.ghost{background:#fff}

@media(max-width:600px){.brandLogo{display:block;width:auto;height:34px;object-fit:contain}.top .brandLogo{height:32px}}

/* CINEMAP light header */
.top{background:#fff!important;border-bottom-color:#e7e7e7!important}
.top .search{color:#171717;background:#fff;border-color:#d8d8d8}
.top .search::placeholder{color:#777}
.top .menuBtn{color:#1b1b1b}
.top .brand{color:#111}

button.active,.chip.active,.dateBtn.active,.modeTab.active{background:#f4f4f4!important;color:#111!important;border-color:#f4f4f4!important}
button.active *,.chip.active *,.dateBtn.active *,.modeTab.active *{color:#111!important}
@media(max-width:600px){.brandLogo{height:29px}.top .brandLogo{height:28px}}
.heroSearchWrap{margin-top:14px}.heroSearchWrap .searchBox{margin-left:0;width:min(560px,100%)}

/* unified CINEMAP header */
.gTop{position:sticky;top:0;z-index:90;background:rgba(9,9,9,.96);backdrop-filter:blur(14px);border-bottom:1px solid #262626}
.gTop .wrap{max-width:1180px;margin:auto;padding:0 18px}.gNav{height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.gBrand{display:flex;align-items:center;min-width:0;text-decoration:none}
.gLogo{display:block;height:31px;width:auto;max-width:166px;object-fit:contain}
.gMenuBtn{width:40px;height:40px;border:0;background:transparent;color:#f2f2f2;display:grid;place-items:center;padding:0}
.gMenuLines,.gMenuLines:before,.gMenuLines:after{display:block;width:19px;height:1px;background:currentColor;content:""}
.gMenuLines{position:relative}.gMenuLines:before{position:absolute;top:-6px}.gMenuLines:after{position:absolute;top:6px}
.gDrawerMask{position:fixed;inset:0;background:#0009;z-index:98;display:none}.gDrawerMask.show{display:block}
.gDrawer{position:fixed;top:0;right:0;height:100dvh;width:min(320px,84vw);background:#111318;border-left:1px solid #292929;z-index:99;transform:translateX(100%);transition:.22s ease;padding:20px}
.gDrawer.show{transform:translateX(0)}
.gDrawerHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.gDrawerClose{width:38px;height:38px;border:0;border-radius:50%;background:#1b1d22;color:#f2f2f2;font-size:22px}
.gDrawer>a{display:block;color:#f2f2f2;text-decoration:none;font-size:17px;font-weight:750;padding:14px 4px;border-bottom:1px solid #292929}
@media(max-width:600px){.gLogo{height:28px;max-width:150px}}

</style>

<script>
const STREAMING_SERVICES=["Netflix","Prime Video","Disney+","U-NEXT","Hulu","Apple TV+","ABEMA","Lemino"];
const services=["すべて","劇場公開",...STREAMING_SERVICES];
let movies=[],directors={},festivalEvents=[],theaterSchedules={},releaseHistory={records:[]},availabilitySnapshot={movies:{}},filmingLocations={movies:{}};
const savedMode=localStorage.getItem("cinemaNow.mode");
const savedActive=localStorage.getItem("cinemaNow.active");
let active=savedActive||"すべて", mode=["streaming","theatrical","tv","festival"].includes(savedMode)?savedMode:"streaming", view=new Date();
let runtimeMin=0,runtimeMax=0;
const $=s=>document.querySelector(s);
let modalScrollY=0;
function showModal(){modalScrollY=window.scrollY||document.documentElement.scrollTop||0;document.body.style.top="-"+modalScrollY+"px";document.body.classList.add("modalOpen");$("#modal").classList.add("show")}
function hideModal(){document.body.classList.remove("modalOpen");document.body.style.top="";$("#modal").classList.remove("show");window.scrollTo(0,modalScrollY)}
function runtimeOk(m){if(!runtimeMin&&!runtimeMax)return true;let r=Number(m.runtime||0);if(!r)return false;return (!runtimeMin||r>=runtimeMin)&&(!runtimeMax||r<=runtimeMax)}
function filtered(){return movies.filter(m=>{let ok=mode==="streaming"?m.event==="streaming":mode==="theatrical"?(m.event==="theatrical"||m.service==="劇場公開"):mode==="tv"?m.event==="tv":m.event==="festival";let serviceOk=active==="すべて"||m.service===active;return ok&&serviceOk})}
function streamingReleaseServices(){
 const found=[...new Set(movies.filter(m=>m.event==="streaming"&&m.service).map(m=>m.service))];
 const ordered=STREAMING_SERVICES.filter(s=>found.includes(s));
 const extras=found.filter(s=>!STREAMING_SERVICES.includes(s)).sort((a,b)=>a.localeCompare(b,"ja"));
 return [...ordered,...extras]
}
function renderChips(){
 let tvPreferred=["日本テレビ","テレビ朝日","TBS","テレビ東京","フジテレビ","NHK総合"];
 let tvFound=[...new Set(movies.filter(m=>m.event==="tv"&&m.service).map(m=>m.service))];
 let tvExtras=tvFound.filter(x=>!tvPreferred.includes(x));
 let ss=mode==="streaming"?["すべて",...streamingReleaseServices()]:mode==="tv"?["すべて",...tvPreferred,...tvExtras]:mode==="festival"?["すべて","国内映画祭","海外映画祭","国内イベント"].filter(x=>x==="すべて"||movies.some(m=>m.event==="festival"&&m.service===x)):["すべて"];
 if(!ss.includes(active))active="すべて";
 $("#chips").innerHTML=ss.map(s=>'<button class="chip '+(s===active?'active':'')+'" data-s="'+s+'">'+s+'</button>').join("");

const holidayCache=new Map();
function japaneseHolidays(year){
 if(holidayCache.has(year))return holidayCache.get(year);
 let holidays=new Map();
 if(year<2000||year>2099)return holidays;
 const put=(month,day,name)=>{holidays.set(new Date(year,month-1,day).toLocaleDateString("sv-SE"),name)};
 // Legal national holidays (modern calendar); equinox dates are calculated for 2000–2099.
 const nthMonday=(month,n)=>{let first=new Date(year,month-1,1).getDay();return 1+((8-first)%7)+(n-1)*7};
 const equinox=(spring)=>Math.floor((spring?20.8431:23.2488)+0.242194*(year-1980)-Math.floor((year-1980)/4));
 put(1,1,"元日");put(1,nthMonday(1,2),"成人の日");put(2,11,"建国記念の日");
 if(year>=2020)put(2,23,"天皇誕生日");
 put(3,equinox(true),"春分の日");put(4,29,"昭和の日");put(5,3,"憲法記念日");put(5,4,"みどりの日");put(5,5,"こどもの日");
 if(year===2020){put(7,23,"海の日");put(7,24,"スポーツの日");put(8,10,"山の日")}
 else if(year===2021){put(7,22,"海の日");put(7,23,"スポーツの日");put(8,8,"山の日")}
 else{put(7,nthMonday(7,3),"海の日");put(8,11,"山の日");put(10,nthMonday(10,2),"スポーツの日")}
 put(9,nthMonday(9,3),"敬老の日");put(9,equinox(false),"秋分の日");
 put(11,3,"文化の日");put(11,23,"勤労感謝の日");
 // 国民の休日: weekdays sandwiched between two national holidays.
 const original=new Set(holidays.keys());
 for(let d=new Date(year,0,2);d.getFullYear()===year;d.setDate(d.getDate()+1)){
  let key=d.toLocaleDateString("sv-SE");if(holidays.has(key)||d.getDay()===0)continue;
  let prev=new Date(d),next=new Date(d);prev.setDate(prev.getDate()-1);next.setDate(next.getDate()+1);
  if(original.has(prev.toLocaleDateString("sv-SE"))&&original.has(next.toLocaleDateString("sv-SE")))holidays.set(key,"国民の休日");
 }
 // 振替休日: after a Sunday national holiday, the next non-holiday becomes a holiday.
 [...original].sort().forEach(key=>{
  let d=new Date(key+"T00:00:00");if(d.getDay()!==0)return;
  d.setDate(d.getDate()+1);
  while(holidays.has(d.toLocaleDateString("sv-SE")))d.setDate(d.getDate()+1);
  if(d.getFullYear()===year)holidays.set(d.toLocaleDateString("sv-SE"),"振替休日")
 });
 holidayCache.set(year,holidays);
 return holidays
}

let backendConfigPromise=null;
async function getBackendConfig(){
  if(!backendConfigPromise){
    backendConfigPromise=fetch("data/backend.json?"+Date.now(),{cache:"no-store"})
      .then(r=>r.ok?r.json():null)
      .catch(()=>null);
  }

}
async function fetchBackendOrFallback(apiPath,fallbackPath){
  try{
    const cfg=await getBackendConfig();
    if(cfg&&cfg.enabled&&cfg.base_url){
      const base=String(cfg.base_url).replace(/\/$/,"");
      const apiRes=await fetch(base+apiPath,{cache:"no-store"});
      if(apiRes.ok)return apiRes;
    }
  }catch(e){console.warn("API backend unavailable; using static JSON fallback",apiPath,e)}

}
