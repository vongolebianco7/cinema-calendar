<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2人で何観る？ | CINEMAP</title>
<style>
:root{--bg:#111318;--panel:#181b21;--panel2:#20242c;--line:#303641;--text:#f2f3f5;--muted:#9ca3af;--accent:#ef3f3f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(900px,100%);margin:auto;padding:0 16px}.top{position:sticky;top:0;z-index:20;background:#111318e8;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{height:58px;display:flex;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:.04em}.brandA{position:relative;display:inline-block}.brandA:after{content:"";position:absolute;width:0;height:0;border-top:3px solid transparent;border-bottom:3px solid transparent;border-left:5px solid var(--accent);left:50%;top:56%;transform:translate(-42%,-50%)}.nav a{margin-left:auto;color:var(--text);text-decoration:none;font-size:12px}.hero{padding:28px 0 18px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:.12em;font-weight:800}.hero h1{font-size:clamp(30px,8vw,48px);margin:7px 0 8px;line-height:1}.hero p{margin:0;color:var(--muted);line-height:1.6;font-size:13px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}.step{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#111;font-weight:900;font-size:12px;margin-right:7px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filter label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.filter select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:11px}.services{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.svc{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:6px;padding:8px 10px;font-size:11px}.svc.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:900}.primary,.secondary{border:0;border-radius:7px;padding:12px 15px;font-weight:900;font-size:14px}.primary{background:var(--accent);color:#111}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.deck{max-width:430px;margin:0 auto}.progress{font-size:11px;color:var(--muted);text-align:center;margin-bottom:8px}.movieCard{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.poster{aspect-ratio:2/3;background:#222;position:relative}.poster img{width:100%;height:100%;object-fit:cover;display:block}.poster .badge{position:absolute;left:8px;top:8px;background:#000c;border-radius:6px;padding:5px 8px;font-size:10px;font-weight:900}.movieBody{padding:14px}.movieBody h2{font-size:21px;line-height:1.25;margin:0 0 8px}.meta{font-size:12px;color:var(--muted);line-height:1.6}.avail{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.avail span{font-size:9px;padding:4px 6px;border-radius:6px;background:#242832;border:1px solid var(--line)}.voteBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.voteBtns button{padding:14px;border-radius:13px;border:1px solid var(--line);font-weight:900;font-size:15px}.no{background:#242832;color:#ddd}.yes{background:#24452f;color:#baf0c8}.shareBox{border:1px solid #66532e;background:#241f15;border-radius:8px;padding:13px;margin-top:10px}.matches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.matchCard{background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden;cursor:pointer}.matchCard img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#222;display:block}.matchBody{padding:9px}.matchBody b{font-size:12px;line-height:1.35;display:block}.matchScore{color:var(--accent);font-size:11px;margin-top:4px}.empty{text-align:center;color:var(--muted);padding:30px 10px}.hidden{display:none!important}.resultHero{text-align:center;padding:12px 0 18px}.resultHero strong{font-size:44px;color:var(--accent)}.tiny{font-size:10px;color:var(--muted)}.why{margin-top:8px;font-size:11px;line-height:1.55;color:#c7cbd2}
@media(min-width:700px){.matches{grid-template-columns:repeat(4,minmax(0,1fr))}.deck{max-width:480px}}

/* CINEMAP visual pass */
body{background:#090909}
.panel,.movie,.dnaCard,.card,.rankCard{background:transparent!important;box-shadow:none!important}
.panel,.movie,.dnaCard,.card,.rankCard{border-color:#272727!important;border-radius:6px!important}
.hero{padding-top:22px}
.hero h1{font-weight:750;letter-spacing:-.025em}
.eyebrow{display:none}
button,.primary,.secondary,.svc,.chip{border-radius:4px!important;box-shadow:none!important}
.primary{background:#ef3f3f!important;color:#fff!important}
.secondary,.svc,.chip{background:transparent!important}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><div class="brand">CINEM<span class="brandA">A</span>P</div><a href="index.html">← カレンダー</a></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">MOVIE MATCH</div><h1>2人で何観る？</h1><p>お互いが「観たい」と選んだ映画だけを最後に表示。ログインもDBも不要。選択内容は共有URLに保存します。URLを知る人は読み取れるため、送り先にご注意ください。</p></section>

<section class="panel" id="setup">
 <div><span class="step">1</span><b>条件を決める</b></div>
 <div class="filters" style="margin-top:12px">
  <div class="filter"><label>何を観る？</label><select id="scope"><option value="all">配信・劇場から探す</option><option value="watch">今、見放題で観られる作品</option><option value="release">配信開始予定・新着</option><option value="theater">劇場公開作品</option></select></div>
  <div class="filter"><label>作品のジャンル</label><select id="genre"><option value="">おまかせ</option><option>ドラマ</option><option>アクション</option><option>コメディ</option><option>SF</option><option>ホラー</option><option>アニメ</option><option>ロマンス</option><option>スリラー</option><option>ミステリー</option><option>ファンタジー</option><option>ドキュメンタリー</option><option>ファミリー</option></select></div>
  <div class="filter"><label>上映時間</label><select id="runtime"><option value="0">指定なし</option><option value="90">90分以内</option><option value="120">120分以内</option><option value="150">150分以内</option><option value="180">180分以内</option></select></div>
  <div class="filter"><label>TMDB評価</label><select id="minScore"><option value="0">指定なし</option><option value="6">★6.0以上</option><option value="7">★7.0以上</option><option value="8">★8.0以上</option></select></div>
  <div class="filter"><label>製作国</label><select id="country"><option value="">指定なし</option><option value="jp">邦画</option><option value="other">洋画</option></select></div>
  <div class="filter"><label>候補数</label><select id="count"><option>8</option><option>12</option><option selected>16</option><option>20</option><option>24</option></select></div>
 </div>
 <div class="tiny" style="margin-top:12px">利用したいサブスク（見放題の判定には最新の確認データを使用）</div>
 <div class="services" id="services"></div>
 <div class="actions"><button class="primary" id="start">候補を選ぶ</button></div>
</section>

<section class="panel hidden" id="vote">
 <div><span class="step">2</span><b id="voteTitle">観たい映画を選ぶ</b></div>
 <div class="deck" style="margin-top:12px">
  <div class="progress" id="progress"></div>
  <div id="card"></div>
 </div>
</section>

<section class="panel hidden" id="share">
 <div><span class="step">3</span><b>相手に送る</b></div>
 <div class="shareBox">選択内容は共有URLに含まれます。URLを受け取った人は内容を読み取れるため、公開SNSへの投稿は避け、相手に直接送ってください。</div>
 <div class="actions"><button class="primary" id="shareBtn">共有する</button><button class="secondary" id="copyBtn">リンクをコピー</button></div>
</section>

<section class="panel hidden" id="result">
 <div class="resultHero"><div class="tiny">2人の一致率</div><strong id="rate">0%</strong><div id="resultText"></div></div>
 <div class="matches" id="matches"></div>
 <div class="actions"><button class="secondary" id="again">もう一度やる</button></div>
</section>
</main>
<script>
let movies=[],availability={movies:{}},candidates=[],likes=[],cursor=0,phase="host",hostLikes=[],selectedServices=[];
const $=s=>document.querySelector(s);
const SERVICES=["Netflix","Prime Video","Disney+","U-NEXT","Hulu","Apple TV+","ABEMA","Lemino","FOD","WOWOWオンデマンド","DMM TV","Rakuten TV"];
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(s){return String(s||"").toLowerCase().replace(/[\s　・･:：!！?？「」『』【】\[\]()（）/／\-―ー\.]+/g,"")}
function b64e(obj){let str=encodeURIComponent(JSON.stringify(obj)).replace(/%([0-9A-F]{2})/g,(_,p)=>String.fromCharCode(parseInt(p,16)));return btoa(str).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function b64d(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";let bin=atob(s),pct="";for(let i=0;i<bin.length;i++)pct+="%"+bin.charCodeAt(i).toString(16).padStart(2,"0");return JSON.parse(decodeURIComponent(pct))}
function keyOf(m){return m.id?"i"+m.id:"t"+m.title}
function findByKey(k){if(!k)return null;return k[0]==="i"?movies.find(m=>String(m.id)===k.slice(1)):movies.find(m=>m.title===k.slice(1))}
function providers(m){let a=m.id&&availability.movies[String(m.id)];return a?[...(a.flatrate||a.services||[])]:[]}
function renderServices(){selectedServices=["Netflix","Prime Video","Disney+","U-NEXT","Hulu"];$("#services").innerHTML=SERVICES.map(s=>'<button type="button" class="svc '+(selectedServices.includes(s)?"active":"")+'" data-s="'+esc(s)+'">'+esc(s)+'</button>').join("");document.querySelectorAll(".svc").forEach(b=>b.onclick=()=>{let s=b.dataset.s;if(selectedServices.includes(s))selectedServices=selectedServices.filter(x=>x!==s);else selectedServices.push(s);b.classList.toggle("active")})}
function buildCandidates(){
 const max=+$("#runtime").value,count=+$("#count").value,minScore=+$("#minScore").value,
 scope=$("#scope").value,genre=$("#genre").value,country=$("#country").value;
 const seen=new Set(),pool=[],today=new Date().toLocaleDateString("sv-SE");
 for(const m of movies){
  if(m.event==="festival"||!m.title||!m.poster)continue;
  let k=keyOf(m);if(seen.has(k))continue;
  const ps=providers(m),hasSelected=ps.some(x=>selectedServices.includes(x)),
   releaseSelected=selectedServices.includes(m.service);
  if(scope==="theater"&&m.event!=="theatrical")continue;
  if(scope==="release"&&m.event!=="streaming")continue;
  if(scope==="watch"&&!hasSelected)continue;
  if(scope!=="theater"&&scope!=="watch"&&selectedServices.length&&m.event!=="theatrical"&&!releaseSelected&&!hasSelected)continue;
  if(scope==="watch"&&!selectedServices.length)continue;
  if(max&&(!m.runtime||m.runtime>max))continue;
  if(minScore&&(!m.score||m.score<minScore))continue;
  if(genre&&!(m.genres||[]).some(g=>String(g).includes(genre)))continue;
  const isJp=(m.countries||[]).some(n=>/日本|Japan/i.test(n));
  if(country==="jp"&&!isJp||country==="other"&&(!m.countries?.length||isJp))continue;
  seen.add(k);
  const freshness=m.date?Math.round((new Date(m.date+"T00:00:00")-new Date(today+"T00:00:00"))/86400000):90;
  const weight=Number(m.score||0)*10+(hasSelected?12:0)-Math.min(90,Math.abs(freshness))*.05;
  pool.push({m,weight})
 }
 pool.sort((a,b)=>b.weight-a.weight||a.m.title.localeCompare(b.m.title,"ja"));
 const chosen=[],step=Math.max(1,Math.floor(pool.length/Math.max(count,1)));
 for(let i=0;chosen.length<count&&i<pool.length;i+=step)chosen.push(pool[i].m);
 for(const x of pool){if(chosen.length>=count)break;if(!chosen.includes(x.m))chosen.push(x.m)}
 return chosen.slice(0,count)
}
function movieCard(m){
 let ps=providers(m),sv=[m.service,...ps].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i);
 return '<div class="movieCard"><div class="poster"><img src="'+esc(m.poster)+'" alt=""><span class="badge">'+esc(m.date||"")+'</span></div><div class="movieBody"><h2>'+esc(m.title)+'</h2><div class="meta">'+(m.runtime?esc(m.runtime)+"分 · ":"")+'TMDB ★ '+Number(m.score||0).toFixed(1)+(m.genres&&m.genres.length?" · "+esc(m.genres.slice(0,2).join(" / ")):"")+'</div><div class="avail">'+sv.slice(0,5).map(x=>'<span>'+esc(x)+'</span>').join("")+'</div><div class="voteBtns"><button class="no" onclick="vote(false)">今回はなし</button><button class="yes" onclick="vote(true)">観たい</button></div></div></div>'
}
function showVote(){
 $("#setup").classList.add("hidden");$("#share").classList.add("hidden");$("#result").classList.add("hidden");$("#vote").classList.remove("hidden");
 $("#voteTitle").textContent=phase==="host"?"あなたが観たい映画を選ぶ":"相手も同じ候補を選ぶ";
 renderCurrent()
}
function renderCurrent(){
 if(cursor>=candidates.length){finishVoting();return}
 $("#progress").textContent=(cursor+1)+" / "+candidates.length;
 $("#card").innerHTML=movieCard(candidates[cursor])
}
window.vote=function(yes){if(yes)likes.push(keyOf(candidates[cursor]));cursor++;renderCurrent()}
function shareState(){return {v:2,c:candidates.map(keyOf),h:likes,s:selectedServices,r:+$("#runtime").value}}
function finishVoting(){
 $("#vote").classList.add("hidden");
 if(phase==="host"){
  hostLikes=[...likes];
  history.replaceState(null,"",location.pathname+"#"+b64e(shareState()));
  $("#share").classList.remove("hidden")
 }else showResults()
}
async function doShare(){
 let url=location.href,text="CINEMAPで『2人で何観る？』やろう";
 if(navigator.share){try{await navigator.share({title:"2人で何観る？",text,url});return}catch(e){}}
 try{await navigator.clipboard.writeText(url);alert("共有リンクをコピーしました")}catch(e){prompt("このリンクを共有してください",url)}
}
function matchReason(m){
 let ps=providers(m).filter(x=>selectedServices.includes(x));
 let bits=[];
 if(ps.length)bits.push("確認済みの見放題先: "+ps.slice(0,2).join(" / "));
 if(m.runtime)bits.push(m.runtime+"分");
 bits.push("TMDB ★ "+Number(m.score||0).toFixed(1));
 return bits.join(" · ")
}
function showResults(){
 let matched=likes.filter(x=>hostLikes.includes(x)),den=Math.max(1,new Set([...likes,...hostLikes]).size),rate=Math.round(matched.length/den*100);
 $("#rate").textContent=rate+"%";
 $("#resultText").textContent=matched.length?matched.length+"作品で一致しました":"今回は一致なし。条件を変えてもう一度！";
 let ms=matched.map(findByKey).filter(Boolean).sort((a,b)=>(b.score||0)-(a.score||0));
 $("#matches").innerHTML=ms.length?ms.map(m=>'<article class="matchCard" data-k="'+esc(keyOf(m))+'"><img src="'+esc(m.poster||"")+'" alt=""><div class="matchBody"><b>'+esc(m.title)+'</b><div class="matchScore">★ '+Number(m.score||0).toFixed(1)+(m.runtime?" · "+m.runtime+"分":"")+'</div><div class="why">'+esc(matchReason(m))+'</div></div></article>').join(""):'<div class="empty" style="grid-column:1/-1">一致した作品はありません</div>';
 $("#result").classList.remove("hidden");
 document.querySelectorAll(".matchCard").forEach(x=>x.onclick=()=>{let m=findByKey(x.dataset.k);if(m&&m.tmdb)open(m.tmdb,"_blank")})
}
function beginHost(){candidates=buildCandidates();if(candidates.length<2){alert("条件に合う候補が少なすぎます。ジャンル・評価・上映時間・配信条件を広げてください。");return}phase="host";likes=[];cursor=0;showVote()}
function beginGuest(state){
 phase="guest";hostLikes=Array.isArray(state.h)?state.h:[];selectedServices=Array.isArray(state.s)?state.s:[];candidates=(Array.isArray(state.c)?state.c:[]).map(findByKey).filter(Boolean);likes=[];cursor=0;
 $("#setup").classList.add("hidden");showVote()
}
async function boot(){
 let [mr,ar]=await Promise.all([fetch("data/movies.json?"+Date.now()),fetch("data/availability.json?"+Date.now()).catch(()=>null)]);
 movies=(await mr.json()).movies||[];if(ar&&ar.ok)availability=await ar.json();
 renderServices();
 $("#start").onclick=beginHost;$("#shareBtn").onclick=doShare;$("#copyBtn").onclick=async()=>{let url=location.href;try{await navigator.clipboard.writeText(url);alert("リンクをコピーしました")}catch(e){prompt("このリンクをコピーしてください",url)}};$("#again").onclick=()=>{location.href="match.html"};
 if(location.hash.length>1){try{let state=b64d(location.hash.slice(1));if((state.v===1||state.v===2)&&Array.isArray(state.c)&&state.c.length&&state.c.length<=30&&Array.isArray(state.h))beginGuest(state)}catch(e){}}
}
boot()
</script>
</body>
</html>
