<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2人で何観る？ | CINEMA NOW</title>
<style>
:root{--bg:#0f1115;--panel:#181b21;--panel2:#20242c;--line:#303640;--text:#f5f5f7;--muted:#9aa1ac;--accent:#e8b44f;--yes:#2f8f63;--no:#7e3b45}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:0 16px}.top{position:sticky;top:0;z-index:20;background:#0f1115e8;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:.03em}.brand b{color:var(--accent)}a{color:inherit}.back{text-decoration:none;font-size:13px;color:var(--muted)}.hero{padding:26px 0 14px}.eyebrow{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:800}.hero h1{font-size:32px;line-height:1.1;margin:7px 0 9px}.hero p{color:var(--muted);font-size:13px;line-height:1.6}.step{margin:12px 0 18px;padding:10px 12px;border:1px solid var(--line);background:var(--panel);border-radius:12px;font-size:12px;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 45px #0005}.poster{aspect-ratio:16/10;background:#222;position:relative;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover}.poster .missing{height:100%;display:flex;align-items:center;justify-content:center;color:#747b86;font-weight:800}.badge{position:absolute;left:10px;top:10px;background:#000c;border:1px solid #ffffff22;border-radius:999px;padding:5px 8px;font-size:10px}.content{padding:14px}.title{font-size:22px;font-weight:900;line-height:1.2}.meta{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.55}.services{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.service{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:5px 7px;background:var(--panel2)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.actions button,.primary,.secondary{border:0;border-radius:13px;padding:14px 12px;font-size:15px;font-weight:900;color:white}.no{background:var(--no)}.yes{background:var(--yes)}.primary{display:block;width:100%;background:var(--accent);color:#161616}.secondary{display:block;width:100%;background:var(--panel2);border:1px solid var(--line)}.counter{text-align:center;color:var(--muted);font-size:11px;margin:8px 0 0}.shareBox,.resultBox{display:none}.shareBox.show,.resultBox.show{display:block}.shareLink{width:100%;margin-top:10px;padding:10px;border-radius:9px;border:1px solid var(--line);background:#11141a;color:#dfe3e8;font-size:11px}.matches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.match{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.match img,.match .ph{width:100%;aspect-ratio:2/3;object-fit:cover;background:#24272e}.match .ph{display:flex;align-items:center;justify-content:center;color:#777}.matchBody{padding:8px}.matchBody b{display:block;font-size:12px;line-height:1.35}.matchBody span{display:block;margin-top:4px;font-size:10px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:28px 12px}.mini{font-size:11px;color:var(--muted);line-height:1.55;margin-top:8px}@media(min-width:600px){.matches{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><div class="brand">CINEMA <b>NOW</b></div><a class="back" href="index.html">← カレンダー</a></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">MOVIE MATCH</div><h1>2人で何観る？</h1><p>1人目が観たい映画を選び、リンクを送る。2人目も選ぶと、2人とも「観たい」映画だけが残ります。ログイン不要・無料です。</p></section>
<div id="step" class="step">作品データを読み込み中…</div>
<section id="picker"><div id="card" class="card"></div><div class="actions"><button id="no" class="no">今回はなし</button><button id="yes" class="yes">観たい</button></div><div id="counter" class="counter"></div></section>
<section id="shareBox" class="shareBox"><button id="shareBtn" class="primary">相手にリンクを送る</button><input id="shareLink" class="shareLink" readonly><p class="mini">選択内容はURLの中だけに保存されます。サーバー保存やアカウント登録はありません。</p><button id="restart" class="secondary">最初からやり直す</button></section>
<section id="resultBox" class="resultBox"><h2>2人とも観たい映画</h2><div id="matches" class="matches"></div><button id="restart2" class="secondary">もう一度やる</button></section>
</main>
<script>
let movies=[],availability={movies:{}},pool=[],i=0,yes=[],host=[];
const $=s=>document.querySelector(s);
function keyOf(m){return m.id?String(m.id):"t:"+encodeURIComponent(m.title)}
function uniq(arr){let seen=new Set();return arr.filter(m=>{let k=keyOf(m);if(seen.has(k))return false;seen.add(k);return true})}
function svcList(m){let a=m.id&&availability.movies?availability.movies[String(m.id)]:null;let xs=a?[...(a.flatrate||a.services||[])]:[];return [...new Set([m.service,...xs].filter(Boolean))].slice(0,4)}
function score(m){return Number(m.score||0).toFixed(1)}
function cardHtml(m){let services=svcList(m).map(s=>'<span class="service">'+s+'</span>').join("");return '<div class="poster">'+(m.poster?'<img src="'+m.poster+'" alt="" loading="lazy">':'<div class="missing">NO IMAGE</div>')+'<span class="badge">'+(m.event==="theatrical"?"劇場公開":"配信")+'</span></div><div class="content"><div class="title">'+m.title+'</div><div class="meta">TMDB ★ '+score(m)+(m.runtime?' · '+m.runtime+'分':'')+(m.date?' · '+m.date:'')+'</div><div class="services">'+services+'</div></div>'}
function draw(){if(i>=pool.length){finish();return}$("#card").innerHTML=cardHtml(pool[i]);$("#counter").textContent=(i+1)+" / "+pool.length}
function finish(){$("#picker").style.display="none";if(host.length){showResults()}else{showShare()}}
function showShare(){let chosen=yes.slice(0,24).map(keyOf);if(!chosen.length){$("#step").textContent="最低1本は「観たい」を選んでください";$("#picker").style.display="block";i=0;yes=[];draw();return}let payload=btoa(JSON.stringify(chosen)).replace(/=+$/,"").replace(/\+/g,"-").replace(/\//g,"_");let url=location.origin+location.pathname+"?host="+payload;$("#shareLink").value=url;$("#shareBox").classList.add("show");$("#step").textContent="1人目の選択完了。相手にリンクを送ってください。"}
function showResults(){let matches=yes.filter(m=>host.includes(keyOf(m)));$("#resultBox").classList.add("show");$("#step").textContent="マッチ結果";$("#matches").innerHTML=matches.length?matches.map(m=>'<article class="match">'+(m.poster?'<img src="'+m.poster+'" alt="">':'<div class="ph">NO IMAGE</div>')+'<div class="matchBody"><b>'+m.title+'</b><span>'+svcList(m).join(" / ")+'</span></div></article>').join(""):'<div class="empty" style="grid-column:1/-1">今回は一致なし。もう一度やると候補を変えられます。</div>'}
function choose(v){if(v)yes.push(pool[i]);i++;draw()}
function parseHost(){let p=new URLSearchParams(location.search).get("host");if(!p)return[];try{p=p.replace(/-/g,"+").replace(/_/g,"/");while(p.length%4)p+="=";return JSON.parse(atob(p))}catch(e){return[]}}
async function boot(){let [mr,ar]=await Promise.all([fetch("data/movies.json?"+Date.now()),fetch("data/availability.json?"+Date.now()).catch(()=>null)]);let md=await mr.json();movies=md.movies||[];if(ar&&ar.ok)availability=await ar.json();host=parseHost();let base=uniq(movies.filter(m=>m.event==="streaming"||m.event==="theatrical")).filter(m=>m.title&&m.date).sort((a,b)=>b.date.localeCompare(a.date));if(host.length){pool=host.map(k=>base.find(m=>keyOf(m)===k)).filter(Boolean);$("#step").textContent="相手が選んだ"+pool.length+"本から、あなたも観たい作品を選んでください。"}else{pool=base.filter(m=>m.poster).slice(0,18);$("#step").textContent="観たい作品を選んでください。最後に共有リンクを作ります。"}draw()}
$("#yes").onclick=()=>choose(true);$("#no").onclick=()=>choose(false);
$("#shareBtn").onclick=async()=>{let url=$("#shareLink").value;if(navigator.share){try{await navigator.share({title:"2人で何観る？",text:"CINEMA NOWで映画を合わせよう",url});return}catch(e){}}try{await navigator.clipboard.writeText(url);$("#shareBtn").textContent="リンクをコピーしました"}catch(e){}};
$("#restart").onclick=$("#restart2").onclick=()=>{location.href=location.pathname};
boot().catch(()=>{$("#step").textContent="データを読み込めませんでした"});
</script>
</body></html>
