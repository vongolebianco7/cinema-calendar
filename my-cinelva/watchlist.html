<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>見たい映画 | CINELVA</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#111;color:#eee}body{margin:0}header,main{max-width:880px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #333}a{color:inherit}header a{text-decoration:none}main h1{font-size:26px}p{color:#aaa}ul{padding:0;list-style:none}li{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px;border:1px solid #383838;border-radius:12px;margin:10px 0;background:#1a1a1a}li a{flex:1}button{background:#282828;color:#eee;border:1px solid #555;padding:9px 13px;border-radius:8px;cursor:pointer}button:hover{background:#393939}</style></head><body><header><a href="../index.html"><strong>CINELVA</strong></a><a href="./">← My CINELVA</a></header><main><h1>見たい映画</h1><p>あとで観たい作品をまとめて確認できます。</p><p id="count"></p><ul id="films"></ul><p><a href="../search.html">映画を探す →</a></p></main><script>(()=>{'use strict';const key='cinelva-want-to-watch-v1',list=document.getElementById('films'),count=document.getElementById('count');const read=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{return {}}};function render(){const items=Object.values(read()).filter(x=>x&&/^[1-9]\d*$/.test(String(x.id))).sort((a,b)=>String(b.savedAt||'').localeCompare(String(a.savedAt||'')));count.textContent=items.length+'本';list.replaceChildren();if(!items.length){const li=document.createElement('li');li.textContent='まだ登録された映画はありません。';list.append(li)}for(const item of items){const li=document.createElement('li'),a=document.createElement('a'),button=document.createElement('button');a.href='../search.html?id='+encodeURIComponent(item.id)+'&search='+encodeURIComponent(item.title||'');a.textContent=item.title||'作品';button.type='button';button.textContent='解除';button.onclick=()=>{const data=read();delete data[String(item.id)];localStorage.setItem(key,JSON.stringify(data));render()};li.append(a,button);list.append(li)}}window.addEventListener('storage',render);render()})();</script></body></html>
