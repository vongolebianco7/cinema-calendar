<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MY CINEMAP | CINEMAP</title><style>:root{--bg:#090909;--panel:#141414;--line:#2b2b2b;--text:#f5f5f5;--muted:#929292;--accent:#e84a4a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",sans-serif}.wrap{max-width:1100px;margin:auto;padding:0 16px}header{border-bottom:1px solid var(--line);position:sticky;top:0;background:#090909f2;z-index:8}.nav{height:60px;display:flex;align-items:center}.brand{font-weight:950;color:#fff;text-decoration:none;font-size:20px}.nav span{margin-left:auto;color:#777;font-size:11px}.hero{padding:28px 0 16px}.hero h1{font-size:32px;margin:0}.hero p{color:var(--muted);line-height:1.6;font-size:13px}.editor{display:grid;grid-template-columns:360px 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.label{font-size:10px;color:#888;font-weight:800;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.08em}input,select,button{font:inherit}input,select{width:100%;background:#0e0e0e;border:1px solid #363636;color:#fff;border-radius:9px;padding:11px}.searchRow{display:flex;gap:7px}.searchRow button,.action{border:0;border-radius:9px;background:#eee;color:#111;font-weight:850;padding:0 13px}.results{max-height:230px;overflow:auto;margin-top:8px}.result{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;border-top:1px solid #252525;padding:7px 0}.result img{width:38px;aspect-ratio:2/3;object-fit:cover}.result b{font-size:11px}.result button{border:1px solid #444;background:#222;color:#fff;border-radius:7px;padding:7px}.list{margin-top:8px}.item{display:grid;grid-template-columns:26px 36px 1fr auto;gap:7px;align-items:center;padding:6px 0;border-top:1px solid #242424}.item img{width:36px;aspect-ratio:2/3;object-fit:cover}.item b{font-size:11px}.move{display:grid;gap:2px}.move button,.remove{background:#222;border:0;color:#bbb;border-radius:5px}.previewWrap{overflow:auto}.art{width:100%;aspect-ratio:4/5;background:#e8e1d4;color:#111;padding:5.5%;position:relative;overflow:hidden}.art.dark{background:#111;color:#f5f0e8}.art.red{background:#7d1518;color:#fff7e9}.kicker{font-size:clamp(8px,1.2vw,12px);letter-spacing:.25em;font-weight:800}.artTitle{font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,5vw,58px);line-height:.9;margin:2% 0 4%;max-width:90%;text-transform:uppercase}.artSub{font-size:clamp(9px,1.3vw,13px);opacity:.65;margin-bottom:4%}.rankGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5%;height:67%}.rank{border-top:1px solid currentColor;padding-top:2%;display:grid;grid-template-columns:22% 1fr;gap:5%;min-height:0}.num{font-family:Georgia,serif;font-size:clamp(24px,4vw,48px);line-height:1}.movieName{font-size:clamp(9px,1.35vw,14px);font-weight:850;line-height:1.1}.year{font-size:clamp(7px,1vw,10px);opacity:.55;margin-top:4px}.credit{position:absolute;bottom:2.5%;right:5.5%;font-size:clamp(7px,1vw,10px);font-weight:800;letter-spacing:.14em}.buttons{display:flex;gap:8px;margin-top:12px}.buttons button{flex:1;padding:12px;border:0;border-radius:9px;font-weight:850}.primary{background:#fff}.secondary{background:#222!important;color:#fff!important;border:1px solid #3a3a3a!important}.legal{color:#777;font-size:10px;line-height:1.5;margin-top:10px}.foot{text-align:center;color:#666;font-size:11px;padding:30px}@media(max-width:760px){.editor{grid-template-columns:1fr}.previewWrap{margin:0 -4px}.art{min-width:0}.artTitle{font-size:10vw}.rankGrid{height:66%}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">CINEMAP</a><span>MY CINEMAP</span></div></header><main class="wrap"><section class="hero"><h1>MY CINEMAP</h1><p>あなたのベスト10、ワースト10、オールタイムベストを作る。選んで、並べて、そのままSNS用の一枚へ。</p></section><div class="editor"><section class="panel"><div class="label">List title</div><input id="title" value="2026 MY BEST FILMS" maxlength="45"><div class="label">Caption</div><input id="sub" value="10 films that stayed with me." maxlength="60"><div class="label">Design</div><select id="theme"><option value="">Editorial / Ivory</option><option value="dark">Midnight / Black</option><option value="red">Festival / Red</option></select><div class="label">映画を追加</div><div class="searchRow"><input id="q" placeholder="作品名を検索"><button id="go">検索</button></div><div id="results" class="results"></div><div class="label">Ranking <span id="count">0/10</span></div><div id="list" class="list"></div><div class="buttons"><button id="clear" class="secondary">クリア</button></div><div class="legal">初期版のSNS画像は権利処理を明確にするため、映画ポスターそのものを書き出さず、作品名・年・順位によるオリジナルデザインで生成します。作品検索画面内のポスター表示とは分離しています。</div></section><section><div class="previewWrap"><div id="art" class="art"><div class="kicker">MY CINEMAP · PERSONAL FILM LIST</div><div id="artTitle" class="artTitle"></div><div id="artSub" class="artSub"></div><div id="rankGrid" class="rankGrid"></div><div class="credit">CINEMAP</div></div></div><div class="buttons"><button id="save" class="primary">画像を作成</button><button id="copy" class="secondary">リストをコピー</button></div><div id="msg" class="legal"></div></section></div></main><div class="foot">CINEMAP v0.4.51</div><script>const API="https://backend-one-gray-94.vercel.app",E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),q=document.getElementById("q");let picks=JSON.parse(localStorage.getItem("cinemap-my-list")||"[]");function persist(){localStorage.setItem("cinemap-my-list",JSON.stringify(picks));render()}function render(){document.getElementById("count").textContent=picks.length+"/10";document.getElementById("list").innerHTML=picks.map((m,i)=>'<div class="item"><b>'+(i+1)+'</b>'+(m.poster?'<img src="'+E(m.poster)+'">':'<div></div>')+'<b>'+E(m.title)+'</b><div class="move"><button data-up="'+i+'">↑</button><button data-down="'+i+'">↓</button><button class="remove" data-x="'+i+'">×</button></div></div>').join("");document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));document.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>move(+b.dataset.down,1));document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{picks.splice(+b.dataset.x,1);persist()});document.getElementById("artTitle").textContent=document.getElementById("title").value;document.getElementById("artSub").textContent=document.getElementById("sub").value;document.getElementById("rankGrid").innerHTML=picks.slice(0,10).map((m,i)=>'<div class="rank"><div class="num">'+String(i+1).padStart(2,"0")+'</div><div><div class="movieName">'+E(m.title)+'</div><div class="year">'+E(m.year||"")+'</div></div></div>').join("");document.getElementById("art").className="art "+document.getElementById("theme").value}function move(i,d){let j=i+d;if(j<0||j>=picks.length)return;[picks[i],picks[j]]=[picks[j],picks[i]];persist()}async function search(){let t=q.value.trim();if(!t)return;let box=document.getElementById("results");box.textContent="検索中…";try{let r=await fetch(API+"/api/movies?q="+encodeURIComponent(t)+"&limit=12"),d=await r.json(),seen=new Set(),a=[...(d.movies||[]),...(d.external||[])].filter(m=>{let k=m.tmdbId||m.id;if(seen.has(k))return false;seen.add(k);return true}).slice(0,12);box.innerHTML=a.map((m,i)=>'<div class="result">'+(m.poster?'<img src="'+E(m.poster)+'">':'<div></div>')+'<b>'+E(m.title)+'<br><span style="color:#777">'+E(m.year||"")+'</span></b><button data-add="'+i+'">追加</button></div>').join("");box.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{if(picks.length>=10)return;if(!picks.some(x=>(x.tmdbId||x.id)===(a[+b.dataset.add].tmdbId||a[+b.dataset.add].id))){picks.push(a[+b.dataset.add]);persist()}})}catch{box.textContent="検索できませんでした"}}document.getElementById("go").onclick=search;q.onkeydown=e=>{if(e.key==="Enter")search()};["title","sub"].forEach(id=>document.getElementById(id).oninput=render);document.getElementById("theme").onchange=render;document.getElementById("clear").onclick=()=>{picks=[];persist()};document.getElementById("copy").onclick=async()=>{let t=document.getElementById("title").value+"\n\n"+picks.map((m,i)=>(i+1)+". "+m.title+(m.year?" ("+m.year+")":"")).join("\n")+"\n\n#CINEMAP";await navigator.clipboard.writeText(t);document.getElementById("msg").textContent="リストをコピーしました。"};document.getElementById("save").onclick=async()=>{let art=document.getElementById("art"),w=1080,h=1350,c=document.createElement("canvas"),x=c.getContext("2d");c.width=w;c.height=h;let theme=document.getElementById("theme").value,bg=theme==="dark"?"#111111":theme==="red"?"#7d1518":"#e8e1d4",fg=theme?"#f5f0e8":"#111111";x.fillStyle=bg;x.fillRect(0,0,w,h);x.fillStyle=fg;x.font="700 20px -apple-system, sans-serif";x.fillText("MY CINEMAP · PERSONAL FILM LIST",70,80);x.font="700 58px Georgia, serif";let title=document.getElementById("title").value.toUpperCase(),words=title.split(" "),lines=[""];for(let word of words){let z=lines[lines.length-1]+(lines[lines.length-1]?" ":"")+word;if(x.measureText(z).width>900)lines.push(word);else lines[lines.length-1]=z}lines.slice(0,2).forEach((l,i)=>x.fillText(l,70,160+i*62));x.globalAlpha=.62;x.font="24px -apple-system, sans-serif";x.fillText(document.getElementById("sub").value,70,300);x.globalAlpha=1;let top=370,row=170;for(let i=0;i<Math.min(10,picks.length);i++){let col=i%2,r=Math.floor(i/2),left=70+col*485,y=top+r*row;x.strokeStyle=fg;x.globalAlpha=.35;x.beginPath();x.moveTo(left,y);x.lineTo(left+420,y);x.stroke();x.globalAlpha=1;x.font="48px Georgia, serif";x.fillText(String(i+1).padStart(2,"0"),left,y+60);x.font="700 23px -apple-system, sans-serif";let name=picks[i].title,short=name.length>24?name.slice(0,23)+"…":name;x.fillText(short,left+85,y+45);x.globalAlpha=.55;x.font="18px -apple-system, sans-serif";x.fillText(String(picks[i].year||""),left+85,y+73);x.globalAlpha=1}x.font="700 18px -apple-system, sans-serif";x.fillText("CINEMAP",900,1300);c.toBlob(async blob=>{let file=new File([blob],"my-cinemap.png",{type:"image/png"});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:document.getElementById("title").value});document.getElementById("msg").textContent="共有シートを開きました。"}else{let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="my-cinemap.png";a.click();document.getElementById("msg").textContent="画像を作成しました。"}}catch(e){if(e.name!=="AbortError")document.getElementById("msg").textContent="画像の共有に失敗しました。"}},"image/png")};render();</script></body></html>
