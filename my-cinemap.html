<main><div class="eyebrow">A MOMENT FROM YOUR MOVIE LIFE</div><h1>鑑賞実績の共有画像</h1><p class="hint">このブラウザに保存した鑑賞記録から画像を自動生成します。自由作成の映画棚は使いません。</p>
<div class="toolbar"><label>対象期間<br><select id="period"><option value="year">今年</option><option value="all">生涯</option></select></label><label>並び順<br><select id="imageSort"><option value="date">鑑賞日順</option><option value="rating">評価ランキング</option></select></label><label>画像サイズ<br><select id="format"><option value="portrait">縦長</option><option value="square">正方形</option><option value="landscape">横長</option></select></label><a class="button" href="data-backup.html">記録をバックアップ</a></div>
<div class="layout"><div class="preview"><canvas id="art" aria-label="鑑賞実績の共有画像プレビュー"></canvas></div><aside class="side"><h2 id="summary">鑑賞実績</h2><p class="hint" id="detail"></p><div class="buttons"><button class="button primary" id="save">PNGを保存</button><button class="button" id="share">共有</button></div><p class="hint">画像には鑑賞記録の作品名、公開年、評価を使います。ポスター画像の読み込みや利用条件を確認できない場合は、作品名のカードに切り替わります。</p><p class="status" id="status" role="status" aria-live="polite"></p></aside></div></main>
<dialog id="saveDialog"><button class="button" id="closeDialog">閉じる</button><h2>画像を保存</h2><p class="hint">iPhoneでは画像を長押しして「写真に保存」を選んでください。</p><img id="savePreview" alt="鑑賞実績画像"><a id="download" class="button primary" download="cinelva-viewing-records.png">画像ファイルをダウンロード</a></dialog>
