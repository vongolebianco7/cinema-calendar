<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Ocean v0.9 visual benchmark</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020c13;color:#e8f6f5;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}main,.oceanProbe{position:fixed;inset:0;overflow:hidden}.oceanProbe{touch-action:none;background:#052735}.photoHabitat{position:absolute;inset:-6%;background-image:linear-gradient(180deg,rgba(0,22,34,.02),rgba(0,22,31,.20)),url('https://commons.wikimedia.org/wiki/Special:Redirect/file/Great_Barrier_Reef_photos_06.jpg?width=1920');background-position:48% 46%;background-size:cover;filter:saturate(.76) contrast(1.08) brightness(.72);transform:scale(1.08);will-change:transform}.oceanProbe:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 46% -3%,rgba(177,240,235,.13),transparent 44%),linear-gradient(180deg,rgba(0,18,28,.01),rgba(0,13,21,.26));box-shadow:inset 0 0 120px rgba(0,8,16,.40)}.oceanProbe canvas{position:absolute;inset:0;width:100%;height:100%;display:block;mix-blend-mode:screen;opacity:.72}.probeMark,.probeHint{position:absolute;z-index:3;text-shadow:0 1px 8px #00151c}.probeMark{left:16px;top:16px;font:600 9px/1.2 ui-monospace,monospace;letter-spacing:.16em;color:rgba(226,247,245,.62)}.probeHint{left:0;right:0;bottom:18px;text-align:center;font-size:10px;letter-spacing:.08em;color:rgba(225,244,242,.54)}</style></head><body><main><div class="oceanProbe" data-ocean-benchmark="0.9"><div class="photoHabitat"></div><canvas></canvas><div class="probeMark">OCEAN · ENVIRONMENT BENCHMARK 0.9</div><div class="probeHint">DRAG TO LOOK AROUND</div></div></main><script src="js/ocean-v9-probe.js"></script></body></html>
