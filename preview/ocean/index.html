<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111a">
  <title>映画の海 | Cinemap</title>
  <meta http-equiv="refresh" content="0; url=ocean-demo.html?view=dashboard">
  <style>
    html,body{margin:0;min-height:100%;background:#07111a;color:#edf3f5;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
    body{display:grid;place-items:center;min-height:100svh}
    a{color:#b9e4e1}
  </style>
</head>
<body>
  <p>映画の海を開いています。<a href="ocean-demo.html?view=dashboard">開かない場合はこちら</a></p>
  <script>
    (function(){
      var params = new URLSearchParams(location.search);
      if (!params.has('view')) params.set('view','dashboard');
      var target = 'ocean-demo.html?' + params.toString() + location.hash;
      location.replace(target);
    })();
  </script>
</body>
</html>
