ckground:#032431;margin-bottom:16px}.ocean3dCanvas{display:block;width:100%;height:100%;touch-action:none}.ocean3dStatus{position:absolute;z-index:2;left:10px;right:10px;bottom:10px;max-width:calc(100% - 20px);padding:10px 12px;border:1px solid #a8d8d53d;border-radius:13px;background:#02171dc7;backdrop-filter:blur(12px);display:flex;flex-wrap:wrap;gap:4px 9px;align-items:baseline;overflow-wrap:anywhere}.ocean3dStatus small{flex-basis:100%;font-size:9px;letter-spacing:.06em}.ocean3dStatus strong{font:normal 17px Georgia,serif}.ocean3dStatus span,.ocean3dStatus em{font-size:10px;font-style:normal;color:#d4e5e3}.ocean3dError{position:absolute;z-index:3;left:10px;right:10px;bottom:10px;margin:0;padding:10px;background:#35191be8;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}@media(max-width:600px){.wrap{padding:0 12px}.page{padding-top:16px}.brand{font-size:24px}.nav{gap:8px}.nav a:not(.brand){font-size:10px}.toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar strong{grid-column:1/-1;margin:0}.action{text-align:center;padding:10px 7px}.ocean3dPrimary{height:58svh;min-height:400px;border-radius:13px}.ocean3dStatus em{flex-basis:100%}.panel{padding:14px}}</style></head><body><header class="top"><nav class="wrap nav"><a class="brand" href="index.html">Cinemap</a><a href="index.html">通常画面へ</a><a href="my-cinemap.html">ランキング画像</a></nav></header><main class="wrap page"><section id="onboarding" hidden><h1>観た映画を、その場で評価。</h1><div class="toolbar"><strong id="onboardCount">0本記録済み</strong><a href="ocean-demo.html?view=dashboard" class="action">映画の海を見る</a></div><div class="grid" id="filmGrid"></div></section><section id="dashboard" hidden><h1>あなたの映画の海</h1><p class="lead">映画を観て評価するほど、生命と環境が育っていきます。</p><div class="toolbar"><strong id="dashboardCount">0本記録済み</strong><a href="ocean-demo.html?view=add" class="action primary">続けて記録する</a><a href="search.html" class="action">映画を探す</a></div><div id="universe"></div><section class="panel"><
