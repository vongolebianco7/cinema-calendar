<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
  <title>Cinemap Ocean Rendering PoC</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#061719;color:#e9f7f4;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}body{min-height:100vh}.shell{max-width:920px;margin:auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom))}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.bar a,.bar button{border:1px solid #426c68;background:#0d2929;color:#e9f7f4;border-radius:999px;padding:8px 11px;text-decoration:none;font:inherit}.bar a.active{background:#d9f1e9;color:#08201f}.stage{position:relative;height:min(66vh,620px);min-height:430px;border-radius:18px;overflow:hidden;background:#0b3435;border:1px solid #214a48;touch-action:pan-y}.stage canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:10px;left:10px;z-index:5;background:rgba(3,20,20,.76);border:1px solid rgba(200,240,232,.25);border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.45;pointer-events:none}.note{font-size:13px;color:#abc8c4;margin:10px 2px 0}.fail{color:#ffd6c9}.pass{color:#c8f4dc}</style>
</head>
<body>
<main class="shell">
  <div class="bar" id="modes"></div>
  <div class="bar" id="states"></div>
  <section class="stage" id="stage"><div class="hud" id="hud">loading…</div></section>
  <p class="note">同一 seed / 同一成熟度で A–E を比較。見た目の必須ゲートを通らない方式は性能に関係なく不採用。</p>
</main>
<script type="module" src="./poc-main.js"></script>
</body>
</html>
