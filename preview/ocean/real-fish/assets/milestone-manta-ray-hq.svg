<!-- dorsal pattern and depth cues -->
<path d="M537 230 C558 208 578 199 600 199 C622 199 642 208 663 230 C644 222 624 219 600 219 C576 219 556 222 537 230Z" fill="#d4e0e4" opacity=".56"/>
