<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Manta ray">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8498a3"/>
    <stop offset="0.28" stop-color="#3f5866"/>
    <stop offset="0.68" stop-color="#172b38"/>
    <stop offset="1" stop-color="#0a1720"/>
  </linearGradient>
  <linearGradient id="leftWing" x1="1" y1="0" x2="0" y2="0.8">
    <stop offset="0" stop-color="#6f8793"/>
    <stop offset="0.38" stop-color="#314c5a"/>
    <stop offset="1" stop-color="#102530"/>
  </linearGradient>
  <linearGradient id="rightWing" x1="0" y1="0" x2="1" y2="0.8">
    <stop offset="0" stop-color="#718a96"/>
    <stop offset="0.38" stop-color="#334f5e"/>
    <stop offset="1" stop-color="#102530"/>
  </linearGradient>
  <radialGradient id="chest" cx="50%" cy="36%" r="65%">
    <stop offset="0" stop-color="#b8c8ce" stop-opacity=".82"/>
    <stop offset=".32" stop-color="#718994" stop-opacity=".35"/>
    <stop offset="1" stop-color="#0c1f29" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b9c9cf" stop-opacity=".75"/>
    <stop offset="1" stop-color="#4b6672" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
</defs>

<!-- broad pectoral fins -->
<path d="M565 220 C480 190 420 178 360 178 C268 178 178 206 92 258 C48 285 22 313 14 338 C48 330 85 325 124 326 C180 327 235 341 292 365 C356 392 417 420 487 447 C510 456 536 463 566 467 C558 416 553 368 553 322 C553 280 557 246 565 220Z" fill="url(#leftWing)"/>
