<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cinemap Ocean Photo Ecosystem</title><style>*{box-sizing:border-box}html,body{margin:0;background:#031418;color:#eef;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:760px;margin:auto;padding:14px}.controls{display:flex;gap:8px;overflow:auto;padding:6px 0 12px}.controls button{border:1px solid #9bd3cf66;background:#09282d;color:#eaffff;border-radius:999px;padding:9px 14px;font:inherit;white-space:nowrap}.controls button[aria-pressed=true]{background:#dff7ef;color:#082326}.stage{position:relative;overflow:hidden;border-radius:24px;aspect-ratio:3/4;background:#07333b url('optimized/scene-seabed.webp') center/cover no-repeat;box-shadow:0 20px 70px #0009;isolation:isolate}.water{position:absolute;inset:0;background:linear-gradient(#0da6b126,#00323b18 55%,#00171f50);z-index:1}.ray{position:absolute;top:-20%;width:20%;height:85%;background:linear-gradient(180deg,#e9fff72c,transparent);filter:blur(10px);transform:rotate(10deg);opacity:.55;z-index:2;animation:ray 9s ease-in-out infinite alternate}.ray.r2{left:58%;animation-delay:-3s;opacity:.3}.ray.r1{left:18%}.fish{position:absolute;z-index:4;height:auto;object-fit:contain;filter:drop-shadow(0 8px 12px #00101855);will-change:transform;animation:swim var(--dur) ease-in-out var(--delay) infinite alternate}.fish.far{opacity:.58;filter:blur(.25px) saturate(.78)}.fish.near{filter:drop-shadow(0 12px 15px #00101870) saturate(.95) contrast(1.03)}.particles{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:radial-gradient(circle,#dfffff55 0 1px,transparent 1.5px);background-size:67px 73px;opacity:.22;animation:particles 14s linear infinite}.hud{position:absolute;z-index:6;left:14px;right:14px;bottom:14px;padding:12px 14px;border-radius:16px;background:#001a20c9;backdrop-filter:blur(10px)}.hud p{margin:4px 0;color:#c8dcdd}.metric{font-variant-numeric:tabular-nums}@keyframes swim{0%{transform:translate3d(-7%,1%,0) rotate(-.4deg)}45%{transform:translate3d(1%,-1%,0) rotate(.2deg)}100%{transform:translate3d(8%,.5%,0) rotate(-.15deg)}}@keyframes ray{to{transform:translateX(8%) rotate(12deg);opacity:.35}}@keyframes particles{to{background-position:18px -73px}}@media(prefers-reduced-motion:reduce){.fish,.ray,.particles{animation:none}}</style></head><body><main><div class="controls" id="controls"></div><div class="stage" id="stage"><div class="water"></div><div class="ray r1"></div><div class="ray r2"></div><div class="particles"></div><div class="hud"><strong id="title"></strong><p id="eco"></p><p class="metric" id="fps">FPS measuring…</p></div></div></main><script>const STATES={0:{count:0,species:0,label:'静かな海'},10:{count:1,species:1,label:'最初の生命'},30:{count:3,species:2,label:'小さな群れ'},100:{count:8,species:3,label:'育った海'},300:{count:14,species:4,label:'豊かな生態系'},500:{count:20,species:5,label:'成熟した大海原'}};const ASSETS=['optimized/fish-real.webp','optimized/goldfish.webp','optimized/tench.webp','optimized/nase.webp','optimized/weatherfish.webp'];const stage=document.querySelector('#stage'),controls=document.querySelector('#controls');let state=Number(new URLSearchParams(location.search).get('state')||100);if(!STATES[state])state=100;function rng(n){let x=(n+1)*2654435761>>>0;return()=>((x=(x*1664525+1013904223)>>>0)/4294967296)}function render(s){state=s;document.querySelectorAll('.fish').forEach(n=>n.remove());const cfg=STATES[s],r=rng(s);for(let i=0;i<cfg.count;i++){const img=document.createElement('img');const z=.25+r()*.75;img.className='fish '+(z<.48?'far':z>.78?'near':'mid');img.src=ASSETS[i%cfg.species];img.alt='';img.style.width=(12+z*18)+'%';img.style.left=(-3+r()*76)+'%';img.style.top=(12+r()*60)+'%';img.style.setProperty('--dur',(5+r()*5)+'s');img.style.setProperty('--delay',(-r()*5)+'s');img.style.opacity=Math.min(1,.45+z*.7);stage.appendChild(img)}document.querySelector('#title').textContent=cfg.label+' · '+s+'本';document.querySelector('#eco').textContent=cfg.species+'魚種 / '+cfg.count+'個体 / 写真ベース';[...controls.children].forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.state)===s))}Object.keys(STATES).forEach(k=>{const b=document.createElement('button');b.textContent=k+'本';b.dataset.state=k;b.onclick=()=>render(Number(k));controls.appendChild(b)});render(state);let last=performance.now(),frames=[],long=0,c=0;function tick(now){const d=now-last;last=now;if(d>0&&d<100){frames.push(1000/d);if(d>32)long++}if(frames.length>180)frames.shift();if(++c%20===0&&frames.length){const s=[...frames].sort((a,b)=>a-b);document.querySelector('#fps').textContent='FPS median '+Math.round(s[Math.floor(s.length/2)])+' · long '+long}requestAnimationFrame(tick)}requestAnimationFrame(tick);window.__OCEAN_PHOTO__={STATES,ASSETS,render};</script></body></html>
