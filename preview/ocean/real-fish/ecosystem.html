<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cinemap Ocean Photo Ecosystem</title><style>*{box-sizing:border-box}html,body{margin:0;background:#031418;color:#eef;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:760px;margin:auto;padding:14px}.controls{display:flex;gap:8px;overflow:auto;padding:6px 0 12px}.controls button{border:1px solid #9bd3cf66;background:#09282d;color:#eaffff;border-radius:999px;padding:9px 14px;font:inherit;white-space:nowrap}.controls button[aria-pressed=true]{background:#dff7ef;color:#082326}.fallback{margin:0 0 12px;padding:15px 16px;border:1px solid #9bd3cf55;border-radius:16px;background:#08272d;color:#eaffff}.fallback[hidden]{display:none}.fallback p{margin:5px 0;color:#bdd6d7;font-size:13px;line-height:1.55}.stage{position:relative;overflow:hidden;border-radius:24px;aspect-ratio:3/4;background:#087fc3 url('optimized/ocean-background-approved.webp') center/cover no-repeat;box-shadow:0 20px 70px #0009;isolation:isolate;--energy:.9;--habitat:0;filter:saturate(var(--energy));perspective:900px}.stage.failed .fishWrap,.stage.failed .seabedCreature{display:none}.blueWash{position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 50% 3%,#dfffff2b 0 15%,transparent 42%);pointer-events:none}.habitatLayer{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 50%,rgba(0,72,104,.06) 74%,rgba(0,50,72,.10) 100%);opacity:calc(var(--habitat) * .45);pointer-events:none}.water{position:absolute;inset:0;background:linear-gradient(180deg,rgba(68,220,238,.025),transparent 35%,rgba(0,38,83,.055));z-index:1}.ray{position:absolute;top:-20%;width:20%;height:85%;background:linear-gradient(180deg,#f4ffff73 0%,#d8ffff42 30%,transparent 100%);filter:blur(10px);transform:rotate(10deg);opacity:.62;z-index:2;animation:ray 9s ease-in-out infinite alternate}.ray.r2{left:58%;animation-delay:-3s;opacity:.3}.ray.r1{left:18%}.fishWrap{position:absolute;z-index:4;will-change:transform;transform-origin:50% 50%;transform-style:preserve-3d;animation:swimPath var(--dur) ease-in-out var(--delay) infinite}.fishWrap.far{opacity:.48;filter:blur(.45px) saturate(.72);z-index:3}.fishWrap.mid{opacity:.78;filter:saturate(.9);z-index:4}.fishWrap.near{filter:drop-shadow(0 12px 15px #00101870) saturate(1) contrast(1.04);z-index:5}.fishBody{display:block;width:100%;height:auto;object-fit:contain;clip-path:inset(0 24% 0 0);transform-origin:58% 50%;will-change:transform;animation:bodyPulse var(--beat) ease-in-out var(--delay) infinite alternate}.fishTail{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;clip-path:inset(0 0 0 70%);transform-origin:70% 50%;will-change:transform;animation:tailBeat var(--beat) ease-in-out var(--delay) infinite alternate}.seabedCreature{position:absolute;z-index:5;will-change:transform;animation:seabedDrift var(--dur) ease-in-out var(--delay) infinite}.seabedCreature img{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 10px #00101855)}.particles{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:radial-gradient(circle,#dfffff55 0 1px,transparent 1.5px);background-size:67px 73px;opacity:calc(.12 + var(--habitat) * .07);animation:particles 14s linear infinite}.hud{position:absolute;z-index:6;left:14px;right:14px;bottom:14px;padding:12px 14px;border-radius:16px;background:#001a20c9;backdrop-filter:blur(10px)}.hud p{margin:4px 0;color:#c8dcdd}.metric{font-variant-numeric:tabular-nums}@keyframes swimPath{0%{transform:translate3d(-8%,1%,0) rotateY(0deg) rotate(-.5deg)}42%{transform:translate3d(8%,-2%,0) rotateY(0deg) rotate(.3deg)}50%{transform:translate3d(9%,-1%,0) rotateY(180deg) rotate(0deg)}92%{transform:translate3d(-7%,2%,0) rotateY(180deg) rotate(-.25deg)}100%{transform:translate3d(-8%,1%,0) rotateY(360deg) rotate(-.5deg)}}@keyframes tailBeat{0%{transform:rotateY(-7deg) skewY(-1.5deg)}100%{transform:rotateY(7deg) skewY(1.5deg)}}@keyframes bodyPulse{0%{transform:scaleY(.988) rotate(.1deg)}100%{transform:scaleY(1.006) rotate(-.1deg)}}@keyframes seabedDrift{0%{transform:translate3d(-2px,0,0) rotate(-.5deg)}100%{transform:translate3d(3px,-2px,0) rotate(.5deg)}}@keyframes ray{to{transform:translateX(8%) rotate(12deg);opacity:.35}}@keyframes particles{to{background-position:18px -73px}}@media(prefers-reduced-motion:reduce){.fishWrap,.fishBody,.fishTail,.seabedCreature,.ray,.particles{animation:none}}</style></head><body><main><div class="controls" id="controls"></div><section class="fallback" id="oceanFallback" hidden><strong>映画の海</strong><p>画像なしでも、あなたの記録から生態系の状態を確認できます。</p><p id="fallbackStats">記録を読み込んでいます…</p></section><div class="stage" id="stage"><div class="blueWash"></div><div class="habitatLayer"></div><div class="water"></div><div class="ray r1"></div><div class="ray r2"></div><div class="particles"></div><div class="hud"><strong id="title"></strong><p id="eco"></p><p class="metric" id="fps">FPS measuring…</p></div></div></main><script>const STATES={0:{count:0,label:'静かな海',habitatTier:0},10:{count:2,label:'最初の生命',habitatTier:.18},20:{count:3,label:'魚影が増える海',habitatTier:.26},30:{count:4,label:'小さな群れ',habitatTier:.34},40:{count:6,label:'多彩な魚影',habitatTier:.4},50:{count:8,label:'多彩な海',habitatTier:.46},60:{count:10,label:'海底もにぎやか',habitatTier:.52},70:{count:12,label:'珍しい出会い',habitatTier:.58},80:{count:14,label:'豊かなリーフ',habitatTier:.66},90:{count:16,label:'レアな海',habitatTier:.74},100:{count:18,label:'育った海',habitatTier:.82},300:{count:22,label:'豊かな生態系',habitatTier:.92},500:{count:26,label:'成熟した大海原',habitatTier:1}};let CREATURES=[];let CATALOG_SCALE={globalPresentationScale:1.2};let TERRAIN={seabedProfile:[],obstacles:[]};const seabedClearance=12;const RECORD_KEY='cinemap-ocean-demo-records-v1';const stage=document.querySelector('#stage'),controls=document.querySelector('#controls'),fallback=document.querySelector('#oceanFallback'),fallbackStats=document.querySelector('#fallbackStats');let state=Number(new URLSearchParams(location.search).get('state')||100);if(!STATES[state])state=100;function readRecords(){try{const raw=localStorage.getItem(RECORD_KEY);const parsed=raw?JSON.parse(raw):{};return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:{}}catch{return{}}}function ratingEnergy(records){const ratings=Object.values(records||{}).map(r=>Number(r&&r.rating)).filter(r=>Number.isFinite(r)&&r>0);if(!ratings.length)return 0;const avg=ratings.reduce((a,b)=>a+b,0)/ratings.length;return avg>=4.3?2:avg>=3.5?1:0}function recordDiversity(records){const rows=Object.values(records||{});const genres=new Set(),regions=new Set(),directors=new Set();rows.forEach(r=>{(Array.isArray(r&&r.genres)?r.genres:[]).forEach(g=>g&&genres.add(g));if(r&&r.region)regions.add(r.region);if(r&&r.director)directors.add(r.director)});const score=genres.size+regions.size*2+Math.min(directors.size,6);return score>=16?5:score>=10?4:score>=6?3:score>=3?2:rows.length?1:0}function activateFallback(){const records=readRecords(),cfg=STATES[state],diversity=recordDiversity(records),energy=ratingEnergy(records);fallbackStats.textContent=Object.keys(records).length+'本の記録 · 生態多様性 '+diversity+' · 評価エネルギー '+energy+' · '+cfg.label;fallback.hidden=false;stage.classList.add('failed')}window.addEventListener('error',activateFallback);function rng(n){let x=(n+1)*2654435761>>>0;return()=>((x=(x*1664525+1013904223)>>>0)/4294967296)}function clamp(v,min,max){return Math.max(min,Math.min(max,v))}function weightedPool(items){const pool=[];items.forEach(c=>{const n=Math.max(1,Math.round(Number(c.spawnWeight||1)*2));for(let i=0;i<n;i++)pool.push(c)});return pool}function depthClass(c,r){const bias=c.depthBias||'midground',roll=r();if(bias==='foreground')return roll<.72?'near':roll<.93?'mid':'far';if(bias==='background')return roll<.68?'far':roll<.94?'mid':'near';return roll<.16?'near':roll<.80?'mid':'far'}function depthFactor(cls){return cls==='near'?1.20:cls==='far'?.58:.88}function presentationScale(c){const global=Number(CATALOG_SCALE.globalPresentationScale)||1.2;return Number(c.presentationScale)||global}function zoneTopRange(zone='midwater'){if(zone.includes('seabed')||zone.includes('bottom'))return[58,75];if(zone.includes('reef-lower'))return[43,66];if(zone.includes('reef'))return[28,58];if(zone.includes('upper'))return[6,34];if(zone.includes('midwater'))return[16,58];return[12,58]}function populationTarget(cfg,energy){return Math.min(84,Math.max(0,cfg.count*3+energy*2))}function seabedYAt(x){const points=TERRAIN.seabedProfile||[];if(!points.length)return 76;const px=clamp(x,0,100);for(let i=1;i<points.length;i++){const a=points[i-1],b=points[i];if(px<=b.x){const t=(px-a.x)/Math.max(1,b.x-a.x);return a.y+(b.y-a.y)*t}}return points[points.length-1].y}function avoidTerrain(anchor,splitLane=0){let x=anchor.x,y=Math.min(anchor.y,seabedYAt(x)-seabedClearance);for(const o of TERRAIN.obstacles||[]){const dx=(x-o.cx)/Math.max(1,o.rx),dy=(y-o.cy)/Math.max(1,o.ry),d=Math.sqrt(dx*dx+dy*dy);if(d<1.25){const side=dx===0?(splitLane||1):Math.sign(dx);const force=(1.25-d)*Number(o.strength||0);x+=side*force*10;y-=force*8}}return{x:clamp(x,4,92),y:clamp(y,4,seabedYAt(x)-seabedClearance),splitLane}}function schoolAnchor(c,r){if(!c.schooling)return null;const range=zoneTopRange(c.zone),raw={x:12+r()*65,y:range[0]+r()*(range[1]-range[0])};return avoidTerrain(raw,0)}function renderFish(c,r,energy,anchor,splitLane=0){const wrap=document.createElement('div'),body=document.createElement('img'),tail=document.createElement('img');const cls=depthClass(c,r),range=zoneTopRange(c.zone),scale=(Number(c.displayScale)||1)*presentationScale(c)*depthFactor(cls);wrap.className='fishWrap '+cls;wrap.dataset.depth=cls;wrap.dataset.zone=c.zone||'midwater';wrap.dataset.lane=String(splitLane);wrap.style.width=((7.5+2.2*r())*scale)+'%';const terrainAnchor=anchor?avoidTerrain(anchor,splitLane):null;const left=terrainAnchor?clamp(terrainAnchor.x+splitLane*5+(r()-.5)*18,-2,88):(-2+r()*90);const top=terrainAnchor?clamp(terrainAnchor.y+splitLane*2.5+(r()-.5)*12,range[0],Math.min(range[1],seabedYAt(left)-seabedClearance)):(range[0]+r()*(range[1]-range[0]));wrap.style.left=left+'%';wrap.style.top=top+'%';wrap.style.setProperty('--dur',Math.max(5.8,9+r()*5-energy*.6)+'s');wrap.style.setProperty('--beat',(0.44+r()*.22-energy*.03)+'s');wrap.style.setProperty('--delay',(-r()*5)+'s');body.className='fishBody';tail.className='fishTail';body.src=tail.src=c.asset;body.alt=tail.alt='';body.addEventListener('error',activateFallback,{once:true});tail.addEventListener('error',activateFallback,{once:true});wrap.append(body,tail);stage.appendChild(wrap)}function renderSeabed(c,r){const wrap=document.createElement('div'),img=document.createElement('img'),scale=(Number(c.displayScale)||.6)*presentationScale(c);wrap.className='seabedCreature';wrap.dataset.depth=c.depthBias||'foreground';wrap.dataset.zone=c.zone||'seabed';wrap.style.width=(3.1+4.4*scale)+'%';wrap.style.left=(5+r()*82)+'%';const range=zoneTopRange(c.zone);wrap.style.top=(range[0]+r()*(range[1]-range[0]))+'%';wrap.style.setProperty('--dur',(8+r()*5)+'s');wrap.style.setProperty('--delay',(-r()*4)+'s');img.src=c.asset;img.alt='';img.addEventListener('error',activateFallback,{once:true});wrap.appendChild(img);stage.appendChild(wrap)}function render(s){state=s;stage.classList.remove('failed');fallback.hidden=true;document.querySelectorAll('.fishWrap,.seabedCreature').forEach(n=>n.remove());const cfg=STATES[s],records=readRecords();const energy=ratingEnergy(records),diversity=recordDiversity(records);const habitat=Math.min(1,cfg.habitatTier+Math.max(0,diversity-1)*.035);stage.style.setProperty('--energy',(0.92+energy*.08).toFixed(2));stage.style.setProperty('--habitat',habitat.toFixed(2));const r=rng(s*10+energy+diversity*17),unlocked=CREATURES.filter(c=>Number(c.unlockAt)<=s),fish=unlocked.filter(c=>c.kind==='fish'),nonfish=unlocked.filter(c=>c.kind!=='fish');const target=populationTarget(cfg,energy),pool=weightedPool(fish),mandatory=s>=50?fish.slice(0,Math.min(10,fish.length)):fish,schoolAnchors=new Map(),schoolCounts=new Map();function anchorFor(c){if(!c.schooling)return null;if(!schoolAnchors.has(c.id))schoolAnchors.set(c.id,schoolAnchor(c,r));return schoolAnchors.get(c.id)}function laneFor(c){if(!c.schooling)return 0;const n=schoolCounts.get(c.id)||0;schoolCounts.set(c.id,n+1);return n%3===0?-1:n%3===1?1:0}mandatory.forEach(c=>renderFish(c,r,energy,anchorFor(c),laneFor(c)));for(let i=mandatory.length;i<target&&pool.length;i++){const c=pool[Math.floor(r()*pool.length)];renderFish(c,r,energy,anchorFor(c),laneFor(c))}const rareChance=Math.min(.75,.14+s/180);const seabedCount=Math.min(7,Math.floor(s/20));for(let i=0;i<seabedCount&&nonfish.length;i++){const c=nonfish[i%nonfish.length];if(c.rarity==='common'||c.rarity==='uncommon'||r()<rareChance)renderSeabed(c,r)}document.querySelector('#title').textContent=cfg.label+' · '+s+'本';document.querySelector('#eco').textContent=fish.length+'魚種 / '+unlocked.length+'生物種 / '+target+'個体前後 / 写真ベース';[...controls.children].forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.state)===s))}Object.keys(STATES).forEach(k=>{const b=document.createElement('button');b.textContent=k+'本';b.dataset.state=k;b.onclick=()=>render(Number(k));controls.appendChild(b)});async function init(){try{const [catalogRes,terrainRes]=await Promise.all([fetch('creature-catalog.json'),fetch('terrain-map.json')]);if(!catalogRes.ok)throw new Error('catalog');if(!terrainRes.ok)throw new Error('terrain');const catalog=await catalogRes.json();CREATURES=catalog.creatures||[];CATALOG_SCALE=catalog.scaleReference||CATALOG_SCALE;TERRAIN=await terrainRes.json();render(state)}catch(e){activateFallback()}}init();window.addEventListener('storage',e=>{if(e.key===RECORD_KEY&&CREATURES.length){try{render(state)}catch(err){activateFallback()}}});let last=performance.now(),frames=[],long=0,c=0;function tick(now){const d=now-last;last=now;if(d>0&&d<100){frames.push(1000/d);if(d>32)long++}if(frames.length>180)frames.shift();if(++c%20===0&&frames.length){const s=[...frames].sort((a,b)=>a-b);document.querySelector('#fps').textContent='FPS median '+Math.round(s[Math.floor(s.length/2)])+' · long '+long}requestAnimationFrame(tick)}requestAnimationFrame(tick);window.__OCEAN_PHOTO__={STATES,get CREATURES(){return CREATURES},get TERRAIN(){return TERRAIN},render,ratingEnergy,recordDiversity,depthClass,zoneTopRange,populationTarget,seabedYAt,avoidTerrain,schoolAnchor,activateFallback};</script></body></html>
