<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cinemap Ocean Photo Ecosystem</title><style>*{box-sizing:border-box}html,body{margin:0;background:#031418;color:#eef;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:760px;margin:auto;padding:14px}.controls{display:flex;gap:8px;overflow:auto;padding:6px 0 12px}.controls button{border:1px solid #9bd3cf66;background:#09282d;color:#eaffff;border-radius:999px;padding:9px 14px;font:inherit;white-space:nowrap}.controls button[aria-pressed=true]{background:#dff7ef;color:#082326}.stage{position:relative;overflow:hidden;border-radius:24px;aspect-ratio:3/4;background:#07333b url('optimized/scene-seabed.webp') center/cover no-repeat;box-shadow:0 20px 70px #0009;isolation:isolate;--energy:.9;--habitat:0;filter:saturate(var(--energy));perspective:900px}.habitatLayer{position:absolute;inset:42% -8% -10%;z-index:1;background-image:url('optimized/scene-seabed.webp');background-size:145% auto;background-position:center bottom;opacity:calc(var(--habitat) * .14);filter:saturate(1.08) contrast(1.06);transform:scale(1.08);pointer-events:none}.water{position:absolute;inset:0;background:linear-gradient(#0da6b126,#00323b18 55%,#00171f50);z-index:1}.ray{position:absolute;top:-20%;width:20%;height:85%;background:linear-gradient(180deg,#e9fff72c,transparent);filter:blur(10px);transform:rotate(10deg);opacity:.55;z-index:2;animation:ray 9s ease-in-out infinite alternate}.ray.r2{left:58%;animation-delay:-3s;opacity:.3}.ray.r1{left:18%}.fishWrap{position:absolute;z-index:4;will-change:transform;transform-origin:50% 50%;transform-style:preserve-3d;animation:swimPath var(--dur) ease-in-out var(--delay) infinite}.fishWrap.far{opacity:.58;filter:blur(.25px) saturate(.78)}.fishWrap.near{filter:drop-shadow(0 12px 15px #00101870) saturate(.95) contrast(1.03)}.fishBody{display:block;width:100%;height:auto;object-fit:contain;clip-path:inset(0 24% 0 0);transform-origin:58% 50%;will-change:transform;animation:bodyPulse var(--beat) ease-in-out var(--delay) infinite alternate}.fishTail{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;clip-path:inset(0 0 0 70%);transform-origin:70% 50%;will-change:transform;animation:tailBeat var(--beat) ease-in-out var(--delay) infinite alternate}.particles{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:radial-gradient(circle,#dfffff55 0 1px,transparent 1.5px);background-size:67px 73px;opacity:calc(.12 + var(--habitat) * .07);animation:particles 14s linear infinite}.hud{position:absolute;z-index:6;left:14px;right:14px;bottom:14px;padding:12px 14px;border-radius:16px;background:#001a20c9;backdrop-filter:blur(10px)}.hud p{margin:4px 0;color:#c8dcdd}.metric{font-variant-numeric:tabular-nums}@keyframes swimPath{0%{transform:translate3d(-8%,1%,0) rotateY(0deg) rotate(-.5deg)}42%{transform:translate3d(8%,-2%,0) rotateY(0deg) rotate(.3deg)}50%{transform:translate3d(9%,-1%,0) rotateY(180deg) rotate(0deg)}92%{transform:translate3d(-7%,2%,0) rotateY(180deg) rotate(-.25deg)}100%{transform:translate3d(-8%,1%,0) rotateY(360deg) rotate(-.5deg)}}@keyframes tailBeat{0%{transform:rotateY(-7deg) skewY(-1.5deg)}100%{transform:rotateY(7deg) skewY(1.5deg)}}@keyframes bodyPulse{0%{transform:scaleY(.988) rotate(.1deg)}100%{transform:scaleY(1.006) rotate(-.1deg)}}@keyframes ray{to{transform:translateX(8%) rotate(12deg);opacity:.35}}@keyframes particles{to{background-position:18px -73px}}@media(prefers-reduced-motion:reduce){.fishWrap,.fishBody,.fishTail,.ray,.particles{animation:none}}</style></head><body><main><div class="controls" id="controls"></div><div class="stage" id="stage"><div class="habitatLayer"></div><div class="water"></div><div class="ray r1"></div><div class="ray r2"></div><div class="particles"></div><div class="hud"><strong id="title"></strong><p id="eco"></p><p class="metric" id="fps">FPS measuring…</p></div></div></main><script>const STATES={0:{count:0,species:0,label:'静かな海',habitatTier:0},10:{count:1,species:1,label:'最初の生命',habitatTier:.18},30:{count:3,species:2,label:'小さな群れ',habitatTier:.34},100:{count:8,species:3,label:'育った海',habitatTier:.58},300:{count:14,species:4,label:'豊かな生態系',habitatTier:.78},500:{count:20,species:5,label:'成熟した大海原',habitatTier:1}};const ASSETS=['optimized/fish-real.webp','optimized/goldfish.webp','optimized/tench.webp','optimized/nase.webp','optimized/weatherfish.webp'];const RECORD_KEY='cinemap-ocean-demo-records-v1';const stage=document.querySelector('#stage'),controls=document.querySelector('#controls');let state=Number(new URLSearchParams(location.search).get('state')||100);if(!STATES[state])state=100;function readRecords(){try{const raw=localStorage.getItem(RECORD_KEY);const parsed=raw?JSON.parse(raw):{};return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:{}}catch{return{}}}function ratingEnergy(records){const ratings=Object.values(records||{}).map(r=>Number(r&&r.rating)).filter(r=>Number.isFinite(r)&&r>0);if(!ratings.length)return 0;const avg=ratings.reduce((a,b)=>a+b,0)/ratings.length;return avg>=4.3?2:avg>=3.5?1:0}function recordDiversity(records){const rows=Object.values(records||{});const genres=new Set(),regions=new Set(),directors=new Set();rows.forEach(r=>{(Array.isArray(r&&r.genres)?r.genres:[]).forEach(g=>g&&genres.add(g));if(r&&r.region)regions.add(r.region);if(r&&r.director)directors.add(r.director)});const score=genres.size+regions.size*2+Math.min(directors.size,6);return score>=16?5:score>=10?4:score>=6?3:score>=3?2:rows.length?1:0}function rng(n){let x=(n+1)*2654435761>>>0;return()=>((x=(x*1664525+1013904223)>>>0)/4294967296)}function render(s){state=s;document.querySelectorAll('.fishWrap').forEach(n=>n.remove());const cfg=STATES[s],records=readRecords();const energy=ratingEnergy(records),diversity=recordDiversity(records);const effectiveSpecies=cfg.species===0?0:Math.min(cfg.species,Math.max(1,diversity));const count=cfg.count===0?0:cfg.count+energy;const habitat=Math.min(1,cfg.habitatTier+Math.max(0,diversity-1)*.045);const r=rng(s*10+energy+diversity*17);stage.style.setProperty('--energy',(0.9+energy*.1).toFixed(2));stage.style.setProperty('--habitat',habitat.toFixed(2));for(let i=0;i<count;i++){const wrap=document.createElement('div');const body=document.createElement('img');const tail=document.createElement('img');const z=.25+r()*.75;const src=ASSETS[i%effectiveSpecies];wrap.className='fishWrap '+(z<.48?'far':z>.78?'near':'mid');wrap.style.width=(12+z*18)+'%';wrap.style.left=(-3+r()*76)+'%';wrap.style.top=(12+r()*60)+'%';wrap.style.setProperty('--dur',Math.max(5.2,8+r()*5-energy*.7)+'s');wrap.style.setProperty('--beat',(0.42+r()*.22-energy*.035)+'s');wrap.style.setProperty('--delay',(-r()*5)+'s');wrap.style.opacity=Math.min(1,.45+z*.7);body.className='fishBody';tail.className='fishTail';body.src=tail.src=src;body.alt='';tail.alt='';wrap.append(body,tail);stage.appendChild(wrap)}document.querySelector('#title').textContent=cfg.label+' · '+s+'本';document.querySelector('#eco').textContent=effectiveSpecies+'魚種 / '+count+'個体 / 生態多様性 '+diversity+' / 写真ベース';[...controls.children].forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.state)===s))}Object.keys(STATES).forEach(k=>{const b=document.createElement('button');b.textContent=k+'本';b.dataset.state=k;b.onclick=()=>render(Number(k));controls.appendChild(b)});render(state);window.addEventListener('storage',e=>{if(e.key===RECORD_KEY)render(state)});let last=performance.now(),frames=[],long=0,c=0;function tick(now){const d=now-last;last=now;if(d>0&&d<100){frames.push(1000/d);if(d>32)long++}if(frames.length>180)frames.shift();if(++c%20===0&&frames.length){const s=[...frames].sort((a,b)=>a-b);document.querySelector('#fps').textContent='FPS median '+Math.round(s[Math.floor(s.length/2)])+' · long '+long}requestAnimationFrame(tick)}requestAnimationFrame(tick);window.__OCEAN_PHOTO__={STATES,ASSETS,render,ratingEnergy,recordDiversity};</script></body></html>
