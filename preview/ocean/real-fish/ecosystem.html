<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cinemap Ocean Photo Ecosystem</title><style>*{box-sizing:border-box}html,body{margin:0;background:#031418;color:#eef;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:760px;margin:auto;padding:14px}.controls{display:flex;gap:8px;overflow:auto;padding:6px 0 12px}.controls button{border:1px solid #9bd3cf66;background:#09282d;color:#eaffff;border-radius:999px;padding:9px 14px;font:inherit;white-space:nowrap}.controls button[aria-pressed=true]{background:#dff7ef;color:#082326}.fallback{margin:0 0 12px;padding:15px 16px;border:1px solid #9bd3cf55;border-radius:16px;background:#08272d;color:#eaffff}.fallback[hidden]{display:none}.fallback p{margin:5px 0;color:#bdd6d7;font-size:13px;line-height:1.55}.stage{position:relative;overflow:hidden;border-radius:24px;aspect-ratio:3/4;background:#0a8fd0 url('optimized/scene-seabed.webp') center/cover no-repeat;box-shadow:0 20px 70px #0009;isolation:isolate;--energy:.9;--habitat:0;filter:saturate(var(--energy));perspective:900px}.stage.failed .fishWrap,.stage.failed .seabedCreature{display:none}.blueWash{position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 50% 7%,#a7f4ff66 0 18%,transparent 42%),linear-gradient(180deg,#20c9ff66 0%,#079ee35c 34%,#0878c24f 62%,#064f8855 100%);mix-blend-mode:screen;pointer-events:none}.habitatLayer{position:absolute;inset:42% -8% -10%;z-index:1;background-image:url('optimized/scene-seabed.webp');background-size:145% auto;background-position:center bottom;opacity:calc(var(--habitat) * .14);filter:saturate(1.14) contrast(1.03) brightness(1.08);transform:scale(1.08);pointer-events:none}.water{position:absolute;inset:0;background:linear-gradient(180deg,#82eaff1f 0%,#22c8ff18 25%,#078fd329 58%,#034b7b42 100%);z-index:1}.ray{position:absolute;top:-20%;width:20%;height:85%;background:linear-gradient(180deg,#f4ffff73 0%,#d8ffff42 30%,transparent 100%);filter:blur(10px);transform:rotate(10deg);opacity:.62;z-index:2;animation:ray 9s ease-in-out infinite alternate}.ray.r2{left:58%;animation-delay:-3s;opacity:.3}.ray.r1{left:18%}.fishWrap{position:absolute;z-index:4;will-change:transform;transform-origin:50% 50%;transform-style:preserve-3d;animation:swimPath var(--dur) ease-in-out var(--delay) infinite}.fishWrap.far{opacity:.58;filter:blur(.25px) saturate(.78)}.fishWrap.near{filter:drop-shadow(0 12px 15px #00101870) saturate(.95) contrast(1.03)}.fishBody{display:block;width:100%;height:auto;object-fit:contain;clip-path:inset(0 24% 0 0);transform-origin:58% 50%;will-change:transform;animation:bodyPulse var(--beat) ease-in-out var(--delay) infinite alternate}.fishTail{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;clip-path:inset(0 0 0 70%);transform-origin:70% 50%;will-change:transform;animation:tailBeat var(--beat) ease-in-out var(--delay) infinite alternate}.seabedCreature{position:absolute;z-index:5;will-change:transform;animation:seabedDrift var(--dur) ease-in-out var(--delay) infinite}.seabedCreature img{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 10px #00101855)}.particles{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:radial-gradient(circle,#dfffff55 0 1px,transparent 1.5px);background-size:67px 73px;opacity:calc(.12 + var(--habitat) * .07);animation:particles 14s linear infinite}.hud{position:absolute;z-index:6;left:14px;right:14px;bottom:14px;padding:12px 14px;border-radius:16px;background:#001a20c9;backdrop-filter:blur(10px)}.hud p{margin:4px 0;color:#c8dcdd}.metric{font-variant-numeric:tabular-nums}@keyframes swimPath{0%{transform:translate3d(-8%,1%,0) rotateY(0deg) rotate(-.5deg)}42%{transform:translate3d(8%,-2%,0) rotateY(0deg) rotate(.3deg)}50%{transform:translate3d(9%,-1%,0) rotateY(180deg) rotate(0deg)}92%{transform:translate3d(-7%,2%,0) rotateY(180deg) rotate(-.25deg)}100%{transform:translate3d(-8%,1%,0) rotateY(360deg) rotate(-.5deg)}}@keyframes tailBeat{0%{transform:rotateY(-7deg) skewY(-1.5deg)}100%{transform:rotateY(7deg) skewY(1.5deg)}}@keyframes bodyPulse{0%{transform:scaleY(.988) rotate(.1deg)}100%{transform:scaleY(1.006) rotate(-.1deg)}}@keyframes seabedDrift{0%{transform:translate3d(-2px,0,0) rotate(-.5deg)}100%{transform:translate3d(3px,-2px,0) rotate(.5deg)}}@keyframes ray{to{transform:translateX(8%) rotate(12deg);opacity:.35}}@keyframes particles{to{background-position:18px -73px}}@media(prefers-reduced-motion:reduce){.fishWrap,.fishBody,.fishTail,.seabedCreature,.ray,.particles{animation:none}}</style></head><body><main><div class="controls" id="controls"></div><section class="fallback" id="oceanFallback" hidden><strong>映画の海</strong><p>画像なしでも、あなたの記録から生態系の状態を確認できます。</p><p id="fallbackStats">記録を読み込んでいます…</p></section><div class="stage" id="stage"><div class="blueWash"></div><div class="habitatLayer"></div><div class="water"></div><div class="ray r1"></div><div class="ray r2"></div><div class="particles"></div><div class="hud"><strong id="title"></strong><p id="eco"></p><p class="metric" id="fps">FPS measuring…</p></div></div></main><script>const STATES={0:{count:0,label:'静かな海',habitatTier:0},10:{count:2,label:'最初の生命',habitatTier:.18},20:{count:3,label:'魚影が増える海',habitatTier:.26},30:{count:4,label:'小さな群れ',habitatTier:.34},40:{count:6,label:'多彩な魚影',habitatTier:.4},50:{count:8,label:'多彩な海',habitatTier:.46},60:{count:10,label:'海底もにぎやか',habitatTier:.52},70:{count:12,label:'珍しい出会い',habitatTier:.58},80:{count:14,label:'豊かなリーフ',habitatTier:.66},90:{count:16,label:'レアな海',habitatTier:.74},100:{count:18,label:'育った海',habitatTier:.82},300:{count:22,label:'豊かな生態系',habitatTier:.92},500:{count:26,label:'成熟した大海原',habitatTier:1}};let CREATURES=[];const SIZE={small:.68,'small-medium':.82,medium:.92,'medium-large':1.08,large:1.2};const RECORD_KEY='cinemap-ocean-demo-records-v1';const stage=document.querySelector('#stage'),controls=document.querySelector('#controls'),fallback=document.querySelector('#oceanFallback'),fallbackStats=document.querySelector('#fallbackStats');let state=Number(new URLSearchParams(location.search).get('state')||100);if(!STATES[state])state=100;function readRecords(){try{const raw=localStorage.getItem(RECORD_KEY);const parsed=raw?JSON.parse(raw):{};return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:{}}catch{return{}}}function ratingEnergy(records){const ratings=Object.values(records||{}).map(r=>Number(r&&r.rating)).filter(r=>Number.isFinite(r)&&r>0);if(!ratings.length)return 0;const avg=ratings.reduce((a,b)=>a+b,0)/ratings.length;return avg>=4.3?2:avg>=3.5?1:0}function recordDiversity(records){const rows=Object.values(records||{});const genres=new Set(),regions=new Set(),directors=new Set();rows.forEach(r=>{(Array.isArray(r&&r.genres)?r.genres:[]).forEach(g=>g&&genres.add(g));if(r&&r.region)regions.add(r.region);if(r&&r.director)directors.add(r.director)});const score=genres.size+regions.size*2+Math.min(directors.size,6);return score>=16?5:score>=10?4:score>=6?3:score>=3?2:rows.length?1:0}function activateFallback(){const records=readRecords(),cfg=STATES[state],diversity=recordDiversity(records),energy=ratingEnergy(records);fallbackStats.textContent=Object.keys(records).length+'本の記録 · 生態多様性 '+diversity+' · 評価エネルギー '+energy+' · '+cfg.label;fallback.hidden=false;stage.classList.add('failed')}window.addEventListener('error',activateFallback);function rng(n){let x=(n+1)*2654435761>>>0;return()=>((x=(x*1664525+1013904223)>>>0)/4294967296)}function weightedPool(items){const pool=[];items.forEach(c=>{const n=Math.max(1,Math.round(Number(c.spawnWeight||1)*2));for(let i=0;i<n;i++)pool.push(c)});return pool}function renderFish(c,r,energy){const wrap=document.createElement('div'),body=document.createElement('img'),tail=document.createElement('img');const z=.25+r()*.75,size=SIZE[c.size]||.9;wrap.className='fishWrap '+(z<.48?'far':z>.78?'near':'mid');wrap.style.width=((5.4+z*8.2)*size)+'%';wrap.style.left=(-2+r()*90)+'%';let top=8+r()*66;if(c.zone==='open-water')top=6+r()*38;else if(c.zone==='seabed'||c.zone==='reef-bottom'||c.zone==='open-water-bottom')top=55+r()*20;else if(c.zone==='reef')top=25+r()*44;wrap.style.top=top+'%';wrap.style.setProperty('--dur',Math.max(5.8,9+r()*5-energy*.6)+'s');wrap.style.setProperty('--beat',(0.44+r()*.22-energy*.03)+'s');wrap.style.setProperty('--delay',(-r()*5)+'s');wrap.style.opacity=Math.min(1,.45+z*.68);body.className='fishBody';tail.className='fishTail';body.src=tail.src=c.asset;body.alt=tail.alt='';body.addEventListener('error',activateFallback,{once:true});tail.addEventListener('error',activateFallback,{once:true});wrap.append(body,tail);stage.appendChild(wrap)}function renderSeabed(c,r){const wrap=document.createElement('div'),img=document.createElement('img'),size=SIZE[c.size]||.6;wrap.className='seabedCreature';wrap.style.width=(3.2+size*5.2)+'%';wrap.style.left=(5+r()*82)+'%';wrap.style.top=(68+r()*12)+'%';wrap.style.setProperty('--dur',(8+r()*5)+'s');wrap.style.setProperty('--delay',(-r()*4)+'s');img.src=c.asset;img.alt='';img.addEventListener('error',activateFallback,{once:true});wrap.appendChild(img);stage.appendChild(wrap)}function render(s){state=s;stage.classList.remove('failed');fallback.hidden=true;document.querySelectorAll('.fishWrap,.seabedCreature').forEach(n=>n.remove());const cfg=STATES[s],records=readRecords();const energy=ratingEnergy(records),diversity=recordDiversity(records);const habitat=Math.min(1,cfg.habitatTier+Math.max(0,diversity-1)*.035);stage.style.setProperty('--energy',(0.92+energy*.08).toFixed(2));stage.style.setProperty('--habitat',habitat.toFixed(2));const r=rng(s*10+energy+diversity*17),unlocked=CREATURES.filter(c=>Number(c.unlockAt)<=s),fish=unlocked.filter(c=>c.kind==='fish'),nonfish=unlocked.filter(c=>c.kind!=='fish');const target=Math.min(28,cfg.count+energy),pool=weightedPool(fish),mandatory=s>=50?fish.slice(0,Math.min(10,fish.length)):fish;mandatory.forEach(c=>renderFish(c,r,energy));for(let i=mandatory.length;i<target&&pool.length;i++)renderFish(pool[Math.floor(r()*pool.length)],r,energy);const rareChance=Math.min(.75,.14+s/180);const seabedCount=Math.min(7,Math.floor(s/20));for(let i=0;i<seabedCount&&nonfish.length;i++){const c=nonfish[i%nonfish.length];if(c.rarity==='common'||c.rarity==='uncommon'||r()<rareChance)renderSeabed(c,r)}document.querySelector('#title').textContent=cfg.label+' · '+s+'本';document.querySelector('#eco').textContent=fish.length+'魚種 / '+unlocked.length+'生物種 / '+target+'個体前後 / 写真ベース';[...controls.children].forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.state)===s))}Object.keys(STATES).forEach(k=>{const b=document.createElement('button');b.textContent=k+'本';b.dataset.state=k;b.onclick=()=>render(Number(k));controls.appendChild(b)});async function init(){try{const res=await fetch('creature-catalog.json');if(!res.ok)throw new Error('catalog');const catalog=await res.json();CREATURES=catalog.creatures||[];render(state)}catch(e){activateFallback()}}init();window.addEventListener('storage',e=>{if(e.key===RECORD_KEY&&CREATURES.length){try{render(state)}catch(err){activateFallback()}}});let last=performance.now(),frames=[],long=0,c=0;function tick(now){const d=now-last;last=now;if(d>0&&d<100){frames.push(1000/d);if(d>32)long++}if(frames.length>180)frames.shift();if(++c%20===0&&frames.length){const s=[...frames].sort((a,b)=>a-b);document.querySelector('#fps').textContent='FPS median '+Math.round(s[Math.floor(s.length/2)])+' · long '+long}requestAnimationFrame(tick)}requestAnimationFrame(tick);window.__OCEAN_PHOTO__={STATES,get CREATURES(){return CREATURES},render,ratingEnergy,recordDiversity,activateFallback};</script></body></html>
