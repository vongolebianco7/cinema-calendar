<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ocean Real Fish PoC</title><style>*{box-sizing:border-box}html,body{margin:0;background:#02161b;color:#eef;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:760px;margin:auto;padding:18px}.stage{position:relative;overflow:hidden;border-radius:24px;aspect-ratio:3/4;background:radial-gradient(ellipse at 50% 18%,#2f8991 0,#0b5660 32%,#07343e 64%,#021b24 100%);box-shadow:0 20px 80px #0008}.water{position:absolute;inset:0;background:linear-gradient(174deg,#a9fff218 0 8%,transparent 24%),radial-gradient(circle at 30% 15%,#d8fff81c,transparent 35%);filter:blur(.2px)}.fish{position:absolute;width:min(84%,560px);height:auto;left:8%;top:27%;object-fit:contain;filter:drop-shadow(0 18px 22px #00101870) saturate(.92) contrast(1.04);animation:swim 7s ease-in-out infinite alternate;will-change:transform}.veil{position:absolute;inset:0;background:linear-gradient(180deg,#55d8df08,#00181f16 60%,#00101345);pointer-events:none}.label{position:absolute;left:16px;right:16px;bottom:16px;padding:14px 16px;border-radius:16px;background:#001a20c9;backdrop-filter:blur(12px)}h1{font-size:24px;margin:0 0 10px}p{margin:5px 0;color:#c4d5d8}.metric{font-variant-numeric:tabular-nums}@keyframes swim{0%{transform:translate3d(-4%,1%,0) rotate(-.5deg) scale(.98)}45%{transform:translate3d(1%,-1%,0) rotate(.3deg) scale(1)}100%{transform:translate3d(5%,.5%,0) rotate(-.2deg) scale(1.015)}}@media(prefers-reduced-motion:reduce){.fish{animation:none}}</style></head><body><main><h1>1匹だけで「本物」に見えるか</h1><p>群れ・海草・成長システムへ進む前の実写ゲート。</p><div class="stage"><div class="water"></div><img class="fish" src="fish-real.png" alt="実写から切り抜いた魚"><div class="veil"></div><div class="label"><strong>REAL FISH QUALITY GATE</strong><p>実写個体・透明背景・ローカル配信</p><p class="metric" id="fps">FPS measuring…</p></div></div></main><script>let last=performance.now(),frames=[],count=0;function tick(now){const d=now-last;last=now;if(d>0&&d<100)frames.push(1000/d);if(frames.length>180)frames.shift();if(++count%20===0&&frames.length){const s=[...frames].sort((a,b)=>a-b);document.querySelector('#fps').textContent='FPS median '+Math.round(s[Math.floor(s.length/2)])}requestAnimationFrame(tick)}requestAnimationFrame(tick)</script></body></html>
