<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ocean Real Fish PoC</title><style>*{box-sizing:border-box}html,body{margin:0;background:#02161b;color:#eef;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:760px;margin:auto;padding:18px}.stage{position:relative;overflow:hidden;border-radius:24px;aspect-ratio:3/4;background:radial-gradient(ellipse at 50% 16%,#348f97 0,#0c5963 30%,#073640 62%,#021b24 100%);box-shadow:0 20px 80px #0008}.water{position:absolute;inset:0;background:linear-gradient(174deg,#d1fff51b 0 7%,transparent 24%),radial-gradient(circle at 28% 14%,#e4fff920,transparent 34%);animation:water 8s ease-in-out infinite alternate}.swimmer{position:absolute;width:min(86%,580px);aspect-ratio:711/359;left:7%;top:27%;animation:travel 7s cubic-bezier(.45,.05,.55,.95) infinite alternate;will-change:transform}.fish-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 22px #00101870) saturate(.94) contrast(1.05)}.body{clip-path:inset(0 0 0 23%)}.tail{clip-path:inset(0 69% 0 0);transform-origin:30% 50%;animation:tail 1.15s ease-in-out infinite alternate;will-change:transform}.veil{position:absolute;inset:0;background:linear-gradient(180deg,#55d8df08,#00181f12 60%,#00101340);pointer-events:none}.label{position:absolute;left:16px;right:16px;bottom:16px;padding:14px 16px;border-radius:16px;background:#001a20c9;backdrop-filter:blur(12px)}h1{font-size:24px;margin:0 0 10px}p{margin:5px 0;color:#c4d5d8}.metric{font-variant-numeric:tabular-nums}@keyframes travel{0%{transform:translate3d(-5%,1.5%,0) rotate(-.5deg) scale(.97)}42%{transform:translate3d(-.5%,-1%,0) rotate(.2deg) scale(.995)}100%{transform:translate3d(6%,.5%,0) rotate(-.15deg) scale(1.02)}}@keyframes tail{0%{transform:rotate(-2.8deg) skewY(-.6deg)}100%{transform:rotate(2.8deg) skewY(.6deg)}}@keyframes water{to{transform:translate3d(0,.6%,0) scale(1.01)}}@media(prefers-reduced-motion:reduce){.swimmer,.tail,.water{animation:none}}</style></head><body><main><h1>1匹だけで「本物」に見えるか</h1><p>実写個体の質感を壊さず、尾だけを独立して自然に動かす。</p><div class="stage"><div class="water"></div><div class="swimmer"><img class="fish-layer body" src="fish-real.png" alt="実写から切り抜いた魚"><img class="fish-layer tail" src="fish-real.png" alt="" aria-hidden="true"></div><div class="veil"></div><div class="label"><strong>REAL FISH QUALITY GATE</strong><p>実写個体・尾びれ分離・GPU transform</p><p class="metric" id="fps">FPS measuring…</p><p class="metric" id="long">Long frames measuring…</p></div></div></main><script>let last=performance.now(),frames=[],longFrames=0,count=0;function tick(now){const d=now-last;last=now;if(d>0&&d<100){frames.push(1000/d);if(d>32)longFrames++}if(frames.length>180)frames.shift();if(++count%20===0&&frames.length){const s=[...frames].sort((a,b)=>a-b);document.querySelector('#fps').textContent='FPS median '+Math.round(s[Math.floor(s.length/2)]);document.querySelector('#long').textContent='Long frames '+longFrames}requestAnimationFrame(tick)}requestAnimationFrame(tick)</script></body></html>
