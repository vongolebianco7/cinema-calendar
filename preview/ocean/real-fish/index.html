<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ocean Real Fish PoC</title><style>*{box-sizing:border-box}html,body{margin:0;background:#02161b;color:#eef;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:760px;margin:auto;padding:18px}.stage{position:relative;overflow:hidden;border-radius:24px;aspect-ratio:3/4;background:#07333b;box-shadow:0 20px 80px #0008}.stage img{position:absolute;width:132%;height:100%;left:-16%;top:0;object-fit:cover;animation:drift 14s ease-in-out infinite alternate;will-change:transform}.veil{position:absolute;inset:0;background:linear-gradient(180deg,#2ad1df10,#00181f30 65%,#00101370);pointer-events:none}.label{position:absolute;left:16px;right:16px;bottom:16px;padding:14px 16px;border-radius:16px;background:#001a20c9;backdrop-filter:blur(12px)}h1{font-size:24px;margin:0 0 10px}p{margin:5px 0;color:#c4d5d8}.metric{font-variant-numeric:tabular-nums}@keyframes drift{0%{transform:translate3d(-1.5%,0,0) scale(1.02)}100%{transform:translate3d(1.5%,-.5%,0) scale(1.035)}}@media(prefers-reduced-motion:reduce){.stage img{animation:none}}</style></head><body><main><h1>1匹だけで「本物」に見えるか</h1><p>群れ・海草・成長システムはまだ作らない。まずこの品質線を通す。</p><div class="stage"><img src="fish.jpg" alt="写実的な魚のPoC"><div class="veil"></div><div class="label"><strong>REAL FISH QUALITY TARGET</strong><p>鱗・眼・ヒレ・水中光・奥行きを最優先</p><p class="metric" id="fps">FPS measuring…</p></div></div></main><script>let last=performance.now(),frames=[],count=0;function tick(now){const d=now-last;last=now;if(d>0&&d<100)frames.push(1000/d);if(frames.length>120)frames.shift();if(++count%20===0&&frames.length){const s=[...frames].sort((a,b)=>a-b);document.querySelector('#fps').textContent='FPS median '+Math.round(s[Math.floor(s.length/2)])}requestAnimationFrame(tick)}requestAnimationFrame(tick)</script></body></html>
