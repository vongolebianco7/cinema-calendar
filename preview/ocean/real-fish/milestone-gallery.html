<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocean milestone gallery</title><style>html,body{margin:0;background:#031418;color:#eff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:900px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.card{background:linear-gradient(#0a3440,#06232d);border:1px solid #8bd8d944;border-radius:20px;padding:14px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between}.stage{height:130px;display:grid;place-items:center;overflow:hidden}.stage>*{width:min(92%,220px);filter:drop-shadow(0 12px 16px #0008)}.name{font-weight:700}.meta{font-size:12px;color:#a9c9ce;margin-top:4px}</style></head><body><main><h1>Ocean 記念生物 QA Gallery</h1><p>本体へ統合する前に、シルエット・切り抜き・相対サイズを確認する開発用画面です。</p><div class="grid" data-milestone-gallery></div></main><script src="milestone-atlas.js?v=2"></script><script>const order=['clownfish','sea-turtle','seahorse','ocean-sunfish','giant-octopus','manta-ray','dolphin','hammerhead-shark','large-shark','dugong','minke-whale','orca','humpback-whale','whale-shark','blue-whale'];const labels={'clownfish':'カクレクマノミ','sea-turtle':'ウミガメ','seahorse':'タツノオトシゴ','ocean-sunfish':'マンボウ','giant-octopus':'大ダコ','manta-ray':'マンタ','dolphin':'イルカ','hammerhead-shark':'ハンマーヘッドシャーク','large-shark':'大型サメ','dugong':'ジュゴン','minke-whale':'ミンククジラ','orca':'シャチ','humpback-whale':'ザトウクジラ','whale-shark':'ジンベイザメ','blue-whale':'シロナガスクジラ'};(async()=>{const manifest=await CinemapOceanMilestoneAtlas.loadCatalog();const grid=document.querySelector('[data-milestone-gallery]');for(const key of order){const spec=manifest.species[key],card=document.createElement('article'),stage=document.createElement('div');card.className='card';stage.className='stage';const creature=CinemapOceanMilestoneAtlas.createCreature(key,manifest);creature.style.width=Math.min(96,42+spec.presentationScale*13)+'%';stage.appendChild(creature);card.append(stage);card.insertAdjacentHTML('beforeend','<div><div class="name">'+labels[key]+'</div><div class="meta">scale '+spec.presentationScale+' · '+spec.motion+' · '+spec.habitat+'</div></div>');grid.appendChild(card)}})();</script></body></html>
