<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ocean Ordinary Species QA</title><style>*{box-sizing:border-box}body{margin:0;background:#031418;color:#eef;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:820px;margin:auto;padding:18px}.lead{color:#bcd7d8;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{border:1px solid #8ecbc955;border-radius:18px;background:#08272d;padding:12px}.stage{height:190px;position:relative;overflow:hidden;border-radius:14px;background:radial-gradient(circle at 50% 5%,#dfffff55,transparent 35%),linear-gradient(#169ed1,#0875ad 55%,#075b79)}.fishWrap{position:absolute;left:18%;top:37%;width:64%;will-change:transform;--dur:10s}.fishBody{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 14px #00101866)}h2{font-size:17px;margin:10px 0 3px}.meta{font-size:12px;color:#a8c7c8;line-height:1.5}.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:999px;background:#dff7ef;color:#082326;font-size:11px}@media(max-width:480px){main{padding:12px}.grid{grid-template-columns:1fr 1fr;gap:9px}.stage{height:150px}.card{padding:8px}h2{font-size:14px}.meta{font-size:10px}}</style></head><body><main><h1>通常魚 QA Gallery</h1><p class="lead">Ocean本体へ統合する前に、追加7種の見分けやすさ・相対サイズ・泳ぎ方を単体で確認する開発用ギャラリー。</p><div class="grid" id="grid"></div></main><script src="ordinary-species-motion.js?v=1"></script><script>const IDS=['palette-surgeonfish','firefish-goby','six-line-wrasse','damselfish','lyretail-anthias','red-seabream','filefish'];const ROLE={'palette-surgeonfish':'3〜7匹の小群','firefish-goby':'岩礁下部でホバリング','six-line-wrasse':'岩礁を縫う単独魚','damselfish':'10〜25匹の密な小群','lyretail-anthias':'12〜28匹の横に広い群れ','red-seabream':'単独〜少数の重い巡航','filefish':'中〜下層をゆっくり漂う'};fetch('creature-catalog.json').then(r=>r.json()).then(catalog=>{const byId=new Map(catalog.creatures.map(c=>[c.id,c]));const grid=document.getElementById('grid');for(const id of IDS){const c=byId.get(id);if(!c)continue;const card=document.createElement('article');card.className='card';card.dataset.species=id;card.innerHTML='<div class="stage"><div class="fishWrap" data-motion-profile="'+(c.motionProfile||'')+'"><img class="fishBody" src="'+c.asset+'" alt="'+c.name+'"></div></div><h2>'+c.name+'</h2><div class="meta">'+ROLE[id]+'<br>'+c.realLengthCm+'cm基準 · '+c.zone+'</div><span class="badge">'+(c.motionProfile||'standard-cruise')+'</span>';grid.appendChild(card)}grid.querySelectorAll('[data-motion-profile]').forEach(el=>window.CinemapOceanOrdinaryMotion?.applyNode?.(el))}).catch(e=>{document.getElementById('grid').textContent='catalog load failed: '+e.message});</script></body></html>
