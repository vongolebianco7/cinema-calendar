<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>映画ランキング | CINEMAP</title>
<style>
:root{--bg:#0b0c10;--panel:#15171d;--panel2:#1d2028;--text:#f5f1e8;--muted:#9ca3af;--accent:#ef3f3f;--line:#2a2e37}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:14px}button,input{font:inherit}h1,h2,h3,.brand{font-family:inherit}
.wrap{max-width:1180px;margin:auto;padding:0 18px}.top{position:sticky;top:0;z-index:20;background:rgba(11,12,16,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{height:56px;display:flex;align-items:center;gap:12px}.menuBtn{margin-left:auto;width:38px;height:38px;border:0;background:transparent;color:var(--text);display:grid;place-items:center;padding:0}.menuLines,.menuLines:before,.menuLines:after{display:block;width:18px;height:1px;background:currentColor;content:""}.menuLines{position:relative}.menuLines:before{position:absolute;top:-6px}.menuLines:after{position:absolute;top:6px}.drawerMask{position:fixed;inset:0;background:#0008;z-index:80;display:none}.drawerMask.show{display:block}.drawer{position:fixed;top:0;right:0;height:100dvh;width:min(320px,84vw);background:#111318;border-left:1px solid var(--line);z-index:81;transform:translateX(100%);transition:.22s ease;padding:20px}.drawer.show{transform:translateX(0)}.drawerHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.drawerClose{width:38px;height:38px;border:0;border-radius:50%;background:var(--panel2);color:var(--text);font-size:22px}.drawer a{display:block;color:var(--text);text-decoration:none;font-size:17px;font-weight:750;padding:14px 4px;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.04em;font-size:18px}.brandA{position:relative;display:inline-block}.brandA:after{content:"";position:absolute;width:0;height:0;border-top:3px solid transparent;border-bottom:3px solid transparent;border-left:5px solid var(--accent);left:50%;top:56%;transform:translate(-42%,-50%)}.nav a{color:var(--text);text-decoration:none;font-size:12px;font-weight:700}
.hero{padding:28px 0 14px}.hero h1{font-size:clamp(28px,6vw,46px);line-height:1.05;margin:0 0 8px;font-weight:850}.hero p{color:var(--muted);max-width:720px;line-height:1.6}
.chips{display:flex;gap:8px;overflow:auto;padding:8px 0 16px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;padding:8px 11px;font-size:12px}.chip.active{background:var(--text);color:#111}
.rankGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.rankCard{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;color:inherit;text-decoration:none}.rankCard img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#222}.body{padding:9px}.no{color:var(--accent);font-weight:900;font-size:12px}.title{font-weight:750;font-size:13px;line-height:1.3;margin-top:3px}.meta{color:var(--muted);font-size:11px;margin-top:5px}.note{color:var(--muted);font-size:11px;line-height:1.5;margin:14px 0 24px}.moreWrap{text-align:center;margin:18px 0}.moreBtn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:6px;padding:10px 20px;font-weight:800;display:none}.listRank{display:flex;flex-direction:column;gap:8px}.listRow{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:12px}.listNo{font-size:18px;font-weight:900;color:var(--accent)}.listTitle{font-weight:750;line-height:1.35}.listMeta{color:var(--muted);font-size:12px;text-align:right}
@media(max-width:760px){.wrap{padding:0 12px}.rankGrid{grid-template-columns:repeat(3,1fr);gap:6px}.body{padding:7px}.title{font-size:11px}.hero{padding:20px 0 10px}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><div class="brand">CINEM<span class="brandA">A</span>P</div><button class="menuBtn" id="menuBtn" aria-label="メニュー"><span class="menuLines" aria-hidden="true"></span></button></div></header><div class="drawerMask" id="drawerMask"></div><aside class="drawer" id="drawer"><div class="drawerHead"><div class="brand">CINEM<span class="brandA">A</span>P</div><button class="drawerClose" id="drawerClose">×</button></div><a href="index.html">カレンダー</a><a href="rankings.html">映画ランキング</a><a href="theaters.html">劇場スケジュール</a></aside>
<main class="wrap">
<section class="hero"><h1>映画ランキング</h1><p>評価・興行など、利用条件が明確なデータから映画を探せます。</p></section><div class="chips" id="axisChips"><button class="chip active" data-axis="tmdb">TMDB評価</button><button class="chip" data-axis="year">今年</button></div>
<div id="tmdbFilters"><div class="chips" id="regionChips"></div><div class="chips" id="genreChips"></div><div class="chips" id="eraChips"></div></div><div id="yearFilters" style="display:none"><div class="chips" id="yearRegionChips"></div><div class="chips" id="yearGenreChips"></div></div><div id="boxFilters" style="display:none"><div class="chips" id="boxRegionChips"></div><div class="chips" id="boxGenreChips"></div><div class="chips" id="boxEraChips"></div></div><div class="rankGrid" id="grid"></div><div class="moreWrap"><button class="moreBtn" id="moreBtn">もっと見る</button></div><div class="note" id="sourceNote"></div>
<div class="note">ランキングはTMDB評価を使用し、少数票の偏りを抑えるため一定数以上の投票がある作品を対象にしています。</div>
</main>
<script>
let rankings={},manifest={},yearRankings={},yearValue="",legacyGenres={},extra={},axis="tmdb",regionActive="邦画",genreActive="すべて",eraActive="",yearRegion="邦画",yearGenre="すべて",boxRegion="邦画",boxGenre="すべて",boxEra="すべて";
const $=s=>document.querySelector(s);
function render(){$("#moreBtn").style.display="none";document.querySelectorAll("[data-axis]").forEach(b=>b.classList.toggle("active",b.dataset.axis===axis));$("#tmdbFilters").style.display=axis==="tmdb"?"block":"none";$("#yearFilters").style.display=axis==="year"?"block":"none";$("#boxFilters").style.display=axis==="boxoffice"?"block":"none";if(axis==="year"){let regions=Object.keys(yearRankings||{});if(!regions.length){$("#grid").className="rankGrid";$("#grid").innerHTML='<div class="empty">今年のランキングデータは次回更新後に表示されます</div>';$("#sourceNote").textContent="";return}if(!yearRankings[yearRegion])yearRegion=regions[0];let genres=Object.keys(yearRankings[yearRegion]||{}),opts=["すべて",...genres];if(!opts.includes(yearGenre))yearGenre="すべて";$("#yearRegionChips").innerHTML=regions.map(x=>'<button class="chip '+(x===yearRegion?'active':'')+'" data-year-region="'+x+'">'+x+'</button>').join("");$("#yearGenreChips").innerHTML=opts.map(x=>'<button class="chip '+(x===yearGenre?'active':'')+'" data-year-genre="'+x+'">'+x+'</button>').join("");document.querySelectorAll("[data-year-region]").forEach(b=>b.onclick=()=>{yearRegion=b.dataset.yearRegion;yearGenre="すべて";render()});document.querySelectorAll("[data-year-genre]").forEach(b=>b.onclick=()=>{yearGenre=b.dataset.yearGenre;render()});let list;if(yearGenre==="すべて"){let map=new Map();genres.forEach(g=>(yearRankings[yearRegion][g]||[]).forEach(m=>{let p=map.get(m.id);if(!p||m.score>p.score)map.set(m.id,m)}));list=[...map.values()].sort((a,b)=>(b.score||0)-(a.score||0)||(b.votes||0)-(a.votes||0)).slice(0,200)}else list=yearRankings[yearRegion][yearGenre]||[];$("#grid").className="rankGrid";$("#grid").innerHTML=list.length?list.map((m,i)=>'<a class="rankCard" target="_blank" href="'+m.tmdb+'">'+(m.poster?'<img src="'+m.poster+'" loading="lazy">':'')+'<div class="body"><div class="no">#'+(i+1)+'</div><div class="title">'+m.title+'</div><div class="meta">'+(m.date||m.year||"")+' · ★ '+Number(m.score||0).toFixed(1)+' · '+(m.votes||0)+'票</div></div></a>').join(""):'<div class="empty">該当作品がありません</div>';$("#sourceNote").textContent=(yearValue||"今年")+"公開作品のTMDBユーザー評価順";return}$("#grid").className="rankGrid";let regions=Object.keys(rankings||{});if(!regions.length&&Object.keys(legacyGenres||{}).length){$("#regionChips").innerHTML='<span class="chip active">総合</span>';let genres=Object.keys(legacyGenres);if(!genreActive||!legacyGenres[genreActive])genreActive=genres[0]||"";$("#genreChips").innerHTML=genres.map(x=>'<button class="chip '+(x===genreActive?'active':'')+'" data-genre="'+x+'">'+x+'</button>').join("");$("#eraChips").innerHTML='<span class="chip active">全年代</span>';document.querySelectorAll("[data-genre]").forEach(b=>b.onclick=()=>{genreActive=b.dataset.genre;render()});let list=legacyGenres[genreActive]||[];$("#grid").innerHTML=list.map((m,i)=>'<a class="rankCard" target="_blank" href="'+m.tmdb+'">'+(m.poster?'<img src="'+m.poster+'" loading="lazy">':'')+'<div class="body"><div class="no">#'+(i+1)+'</div><div class="title">'+m.title+'</div><div class="meta">'+(m.year||"")+' · ★ '+Number(m.score||0).toFixed(1)+' · '+(m.votes||0)+'票</div></div></a>').join("");$("#sourceNote").textContent="TMDBユーザー評価順";return}if(!regions.length){$("#grid").innerHTML='<p>ランキングデータを読み込めませんでした。</p>';return}if(!rankings[regionActive])regionActive=regions[0];let genres=Object.keys(rankings[regionActive]||{}),genreOptions=["すべて",...genres];if(!genreActive||!genreOptions.includes(genreActive))genreActive="すべて";let eraSource=genreActive==="すべて"?(rankings[regionActive][genres[0]]||{}):(rankings[regionActive][genreActive]||{});let eras=Object.keys(eraSource);if(!eraActive||!eras.includes(eraActive))eraActive=eras[eras.length-1]||"";$("#regionChips").innerHTML=regions.map(x=>'<button class="chip '+(x===regionActive?'active':'')+'" data-region="'+x+'">'+x+'</button>').join("");$("#genreChips").innerHTML=genreOptions.map(x=>'<button class="chip '+(x===genreActive?'active':'')+'" data-genre="'+x+'">'+x+'</button>').join("");$("#eraChips").innerHTML=eras.map(x=>'<button class="chip '+(x===eraActive?'active':'')+'" data-era="'+x+'">'+x+'</button>').join("");document.querySelectorAll("[data-region]").forEach(b=>b.onclick=()=>{regionActive=b.dataset.region;genreActive="すべて";eraActive="";render()});document.querySelectorAll("[data-genre]").forEach(b=>b.onclick=()=>{genreActive=b.dataset.genre;eraActive="";render()});document.querySelectorAll("[data-era]").forEach(b=>b.onclick=()=>{eraActive=b.dataset.era;render()});let list;if(genreActive==="すべて"){let map=new Map();genres.forEach(g=>(((rankings[regionActive]||{})[g]||{})[eraActive]||[]).forEach(m=>{let prev=map.get(m.id);if(!prev||m.score>prev.score)map.set(m.id,m)}));list=[...map.values()].sort((a,b)=>(b.score||0)-(a.score||0)||(b.votes||0)-(a.votes||0)).slice(0,50)}else list=(((rankings[regionActive]||{})[genreActive]||{})[eraActive]||[]);$("#grid").innerHTML=list.map((m,i)=>'<a class="rankCard" target="_blank" href="'+m.tmdb+'">'+(m.poster?'<img src="'+m.poster+'" loading="lazy">':'')+'<div class="body"><div class="no">#'+(i+1)+'</div><div class="title">'+m.title+'</div><div class="meta">'+(m.year||"")+' · ★ '+Number(m.score||0).toFixed(1)+' · '+(m.votes||0)+'票</div></div></a>').join("");$("#sourceNote").textContent="TMDBユーザー評価順";setupMore(list,genres)}
function drawTmdbList(list){$("#grid").className="rankGrid";$("#grid").innerHTML=list.map((m,i)=>'<a class="rankCard" target="_blank" href="'+m.tmdb+'">'+(m.poster?'<img src="'+m.poster+'" loading="lazy">':'')+'<div class="body"><div class="no">#'+(i+1)+'</div><div class="title">'+m.title+'</div><div class="meta">'+(m.year||"")+' · ★ '+Number(m.score||0).toFixed(1)+' · '+(m.votes||0)+'票</div></div></a>').join("")}
function setupMore(current,genres){
 let btn=$("#moreBtn"),filters=(manifest.filters||{})[regionActive]||{};
 let available=false;
 if(genreActive==="すべて")available=genres.some(g=>filters[g]&&filters[g][eraActive]&&filters[g][eraActive].count>(((rankings[regionActive]||{})[g]||{})[eraActive]||[]).length);
 else available=!!(filters[genreActive]&&filters[genreActive][eraActive]&&filters[genreActive][eraActive].count>current.length);
 if(!available)return;
 btn.style.display="inline-block";btn.textContent="もっと見る";
 btn.onclick=async()=>{
  btn.disabled=true;btn.textContent="読み込み中…";
  try{
   let files=[];
   if(genreActive==="すべて")files=genres.map(g=>filters[g]&&filters[g][eraActive]&&filters[g][eraActive].file).filter(Boolean);
   else files=[filters[genreActive][eraActive].file];
   let data=await Promise.all(files.map(x=>fetch(x+"?"+Date.now()).then(r=>r.json())));
   let map=new Map();
   data.forEach(d=>(d.items||[]).forEach(m=>{let p=map.get(m.id);if(!p||m.score>p.score)map.set(m.id,m)}));
   let full=[...map.values()].sort((a,b)=>(b.score||0)-(a.score||0)||(b.votes||0)-(a.votes||0)).slice(0,200);
   drawTmdbList(full);btn.style.display="none";$("#sourceNote").textContent="TMDBユーザー評価順 · "+full.length+"作品表示";
  }catch(e){btn.disabled=false;btn.textContent="もっと見る"}
 }
}
function openDrawer(){$("#drawer").classList.add("show");$("#drawerMask").classList.add("show")}
function closeDrawer(){$("#drawer").classList.remove("show");$("#drawerMask").classList.remove("show")}
$("#menuBtn").addEventListener("click",openDrawer);
$("#drawerClose").addEventListener("click",closeDrawer);
$("#drawerMask").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
async function boot(){try{let [r,m,y,e]=await Promise.all([fetch("data/rankings.json?"+Date.now()),fetch("data/rankings_manifest.json?"+Date.now()).catch(()=>null),fetch("data/rankings_year.json?"+Date.now()).catch(()=>null),fetch("data/rankings_extra.json?"+Date.now())]);let d=await r.json();let md=m&&m.ok?await m.json():{};let yd=y&&y.ok?await y.json():{};let x=await e.json();rankings=d.rankings||{};manifest=md||{};yearRankings=yd.rankings||{};yearValue=yd.year||new Date().getFullYear();legacyGenres=d.genres||{};extra=x||{};document.querySelectorAll("[data-axis]").forEach(b=>b.onclick=()=>{axis=b.dataset.axis;render()});render()}catch(err){$("#grid").innerHTML='<p>ランキングデータを読み込めませんでした。</p>'}}boot();
</script>
</body></html>
