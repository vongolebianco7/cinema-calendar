<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CINEMA CHARTS | CINEMAP</title>
<style>
:root{--bg:#0b0c10;--panel:#15171d;--panel2:#1d2028;--text:#f5f1e8;--muted:#9ca3af;--accent:#ef3f3f;--line:#2a2e37}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:14px}button,input{font:inherit}h1,h2,h3,.brand{font-family:inherit}
.wrap{max-width:1180px;margin:auto;padding:0 18px}.top{position:sticky;top:0;z-index:20;background:rgba(11,12,16,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{height:56px;display:flex;align-items:center;gap:12px}.menuBtn{margin-left:auto;width:38px;height:38px;border:0;background:transparent;color:var(--text);display:grid;place-items:center;padding:0}.menuLines,.menuLines:before,.menuLines:after{display:block;width:18px;height:1px;background:currentColor;content:""}.menuLines{position:relative}.menuLines:before{position:absolute;top:-6px}.menuLines:after{position:absolute;top:6px}.drawerMask{position:fixed;inset:0;background:#0008;z-index:80;display:none}.drawerMask.show{display:block}.drawer{position:fixed;top:0;right:0;height:100dvh;width:min(320px,84vw);background:#111318;border-left:1px solid var(--line);z-index:81;transform:translateX(100%);transition:.22s ease;padding:20px}.drawer.show{transform:translateX(0)}.drawerHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.drawerClose{width:38px;height:38px;border:0;border-radius:50%;background:var(--panel2);color:var(--text);font-size:22px}.drawer a{display:block;color:var(--text);text-decoration:none;font-size:17px;font-weight:750;padding:14px 4px;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.04em;font-size:18px}.brandA{position:relative;display:inline-block}.brandA:after{content:"";position:absolute;width:0;height:0;border-top:3px solid transparent;border-bottom:3px solid transparent;border-left:5px solid var(--accent);left:50%;top:56%;transform:translate(-42%,-50%)}.nav a{color:var(--text);text-decoration:none;font-size:12px;font-weight:700}
.hero{padding:28px 0 14px}.hero h1{font-size:clamp(28px,6vw,46px);line-height:1.05;margin:0 0 8px;font-weight:850}.hero p{color:var(--muted);max-width:720px;line-height:1.6}
.chips{display:flex;gap:8px;overflow:auto;padding:8px 0 16px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;padding:8px 11px;font-size:12px}.chip.active{background:var(--text);color:#111}
.rankGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.rankCard{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;color:inherit;text-decoration:none}.rankCard img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#222}.body{padding:9px}.no{color:var(--accent);font-weight:900;font-size:12px}.title{font-weight:750;font-size:13px;line-height:1.3;margin-top:3px}.meta{color:var(--muted);font-size:11px;margin-top:5px}.note{color:var(--muted);font-size:11px;line-height:1.5;margin:14px 0 24px}.moreWrap{text-align:center;margin:18px 0}.moreBtn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:6px;padding:10px 20px;font-weight:800;display:none}.listRank{display:flex;flex-direction:column;gap:8px}.listRow{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:12px}.listNo{font-size:18px;font-weight:900;color:var(--accent)}.listTitle{font-weight:750;line-height:1.35}.listMeta{color:var(--muted);font-size:12px;text-align:right}
@media(max-width:760px){.wrap{padding:0 12px}.rankGrid{grid-template-columns:repeat(3,1fr);gap:6px}.body{padding:7px}.title{font-size:11px}.hero{padding:20px 0 10px}}

/* CINEMAP visual pass */
body{background:#090909}
.panel,.movie,.dnaCard,.card,.rankCard{background:transparent!important;box-shadow:none!important}
.panel,.movie,.dnaCard,.card,.rankCard{border-color:#272727!important;border-radius:6px!important}
.hero{padding-top:22px}
.hero h1{font-weight:750;letter-spacing:-.025em}
.eyebrow{display:none}
button,.primary,.secondary,.svc,.chip{border-radius:4px!important;box-shadow:none!important}
.primary{background:#ef3f3f!important;color:#fff!important}
.secondary,.svc,.chip{background:transparent!important}

.brand{display:flex;align-items:center;text-decoration:none}
.brandLogo{display:block;width:auto;height:34px;object-fit:contain}
.top .brandLogo{height:32px}
@media(max-width:600px){.brandLogo{display:block;width:auto;height:34px;object-fit:contain}.top .brandLogo{height:32px}}

button.active,.chip.active,.dateBtn.active,.modeTab.active{background:#f4f4f4!important;color:#111!important;border-color:#f4f4f4!important}
button.active *,.chip.active *,.dateBtn.active *,.modeTab.active *{color:#111!important}
@media(max-width:600px){.brandLogo{height:29px}.top .brandLogo{height:28px}}

/* unified CINEMAP header */
.gTop{position:sticky;top:0;z-index:90;background:rgba(9,9,9,.96);backdrop-filter:blur(14px);border-bottom:1px solid #262626}
.gTop .wrap{max-width:1180px;margin:auto;padding:0 18px}.gNav{height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.gBrand{display:flex;align-items:center;min-width:0;text-decoration:none}
.gLogo{display:block;height:31px;width:auto;max-width:166px;object-fit:contain}
.gMenuBtn{width:40px;height:40px;border:0;background:transparent;color:#f2f2f2;display:grid;place-items:center;padding:0}
.gMenuLines,.gMenuLines:before,.gMenuLines:after{display:block;width:19px;height:1px;background:currentColor;content:""}
.gMenuLines{position:relative}.gMenuLines:before{position:absolute;top:-6px}.gMenuLines:after{position:absolute;top:6px}
.gDrawerMask{position:fixed;inset:0;background:#0009;z-index:98;display:none}.gDrawerMask.show{display:block}
.gDrawer{position:fixed;top:0;right:0;height:100dvh;width:min(320px,84vw);background:#111318;border-left:1px solid #292929;z-index:99;transform:translateX(100%);transition:.22s ease;padding:20px}
.gDrawer.show{transform:translateX(0)}
.gDrawerHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.gDrawerClose{width:38px;height:38px;border:0;border-radius:50%;background:#1b1d22;color:#f2f2f2;font-size:22px}
.gDrawer>a{display:block;color:#f2f2f2;text-decoration:none;font-size:17px;font-weight:750;padding:14px 4px;border-bottom:1px solid #292929}
@media(max-width:600px){.gLogo{height:28px;max-width:150px}}

.filterLabel{font-size:9px;letter-spacing:.14em;color:#6f747d;font-weight:800;margin-top:8px}.chartAxes{margin-bottom:2px}
</style>
</head>

<main class="wrap">
<section class="hero"><h1>CINEMA CHARTS</h1><p>評価と興行から、映画を時代・地域・ジャンルで横断して見る。</p></section>

<div class="chartAxes">
 <div class="filterLabel">CHART</div>
 <div class="chips" id="axisChips">
  <button class="chip active" data-axis="rating">ユーザー評価</button>
  <button class="chip" data-axis="boxoffice">興行収入</button>
 </div>
</div>

<div id="ratingFilters">
 <div class="filterLabel">REGION</div><div class="chips" id="regionChips"></div>
 <div class="filterLabel">GENRE</div><div class="chips" id="genreChips"></div>
 <div class="filterLabel">ERA</div><div class="chips" id="eraChips"></div>
</div>

<div id="boxFilters" style="display:none">
 <div class="filterLabel">REGION</div><div class="chips" id="boxRegionChips"></div>
 <div class="filterLabel">PERIOD</div><div class="chips" id="boxEraChips"></div>
</div>

<div class="rankGrid" id="grid"></div>
<div class="moreWrap"><button class="moreBtn" id="moreBtn">もっと見る</button></div>
<div class="note" id="sourceNote"></div>
</main>
<script>
let rankings={},manifest={},yearRankings={},yearValue="",legacyGenres={},boxoffice={},axis="rating";
let regionActive="すべて",genreActive="すべて",eraActive="",boxRegion="すべて",boxEra="歴代";
const $=s=>document.querySelector(s);
const uniqById=list=>{const m=new Map();list.forEach(x=>{const k=x.id||x.title;const p=m.get(k);if(!p||(x.score||0)>(p.score||0))m.set(k,x)});return [...m.values()]};
function allRegions(){return ["すべて",...Object.keys(rankings||{})]}
function baseRegions(){return regionActive==="すべて"?Object.keys(rankings||{}):[regionActive]}
function allGenres(regions){
 const s=new Set();regions.forEach(r=>Object.keys(rankings[r]||{}).forEach(g=>s.add(g)));return [...s]
}
function availableEras(regions,genres){
 const s=new Set();regions.forEach(r=>genres.forEach(g=>Object.keys(((rankings[r]||{})[g]||{})).forEach(e=>s.add(e))));
 return [...s]
}
function yearList(regions,genre){
 let list=[];regions.forEach(r=>{
   const gs=Object.keys(yearRankings[r]||{});
   (genre==="すべて"?gs:[genre]).forEach(g=>list.push(...((yearRankings[r]||{})[g]||[])));
 });
 return uniqById(list).sort((a,b)=>(b.score||0)-(a.score||0)||(b.votes||0)-(a.votes||0));
}
function ratingList(regions,genre,era){
 if(era==="今年")return yearList(regions,genre);
 let list=[];regions.forEach(r=>{
   const gs=Object.keys(rankings[r]||{});
   (genre==="すべて"?gs:[genre]).forEach(g=>list.push(...((((rankings[r]||{})[g]||{})[era])||[])));
 });
 return uniqById(list).sort((a,b)=>(b.score||0)-(a.score||0)||(b.votes||0)-(a.votes||0));
}
function card(m,i){
 return '<a class="rankCard" target="_blank" href="'+(m.tmdb||"#")+'">'+(m.poster?'<img src="'+m.poster+'" loading="lazy">':'<div style="aspect-ratio:2/3;background:#171717"></div>')+'<div class="body"><div class="no">#'+(i+1)+'</div><div class="title">'+m.title+'</div><div class="meta">'+(m.date||m.year||"")+' · ★ '+Number(m.score||0).toFixed(1)+' · '+(m.votes||0)+'票</div></div></a>'
}
function renderRating(){
 const regions=baseRegions();
 let genres=allGenres(regions);
 const genreOpts=["すべて",...genres];
 if(!genreOpts.includes(genreActive))genreActive="すべて";
 const useGenres=genreActive==="すべて"?genres:[genreActive];
 let eras=availableEras(regions,useGenres);
 eras.sort();
 const eraOpts=["今年",...eras.slice().reverse()];
 if(!eraActive||!eraOpts.includes(eraActive))eraActive="今年";
 $("#regionChips").innerHTML=allRegions().map(x=>'<button class="chip '+(x===regionActive?'active':'')+'" data-region="'+x+'">'+x+'</button>').join("");
 $("#genreChips").innerHTML=genreOpts.map(x=>'<button class="chip '+(x===genreActive?'active':'')+'" data-genre="'+x+'">'+x+'</button>').join("");
 $("#eraChips").innerHTML=eraOpts.map(x=>'<button class="chip '+(x===eraActive?'active':'')+'" data-era="'+x+'">'+x+'</button>').join("");
 document.querySelectorAll("[data-region]").forEach(b=>b.onclick=()=>{regionActive=b.dataset.region;genreActive="すべて";eraActive="今年";render()});
 document.querySelectorAll("[data-genre]").forEach(b=>b.onclick=()=>{genreActive=b.dataset.genre;eraActive="今年";render()});
 document.querySelectorAll("[data-era]").forEach(b=>b.onclick=()=>{eraActive=b.dataset.era;render()});
 const list=ratingList(regions,genreActive,eraActive).slice(0,80);
 $("#grid").className="rankGrid";$("#grid").innerHTML=list.length?list.map(card).join(""):'<div class="empty">該当作品がありません</div>';
 $("#sourceNote").textContent=(eraActive==="今年"?(yearValue||new Date().getFullYear())+"年公開作品 · ":"")+"TMDBユーザー評価順";
}
function renderBox(){
 const regions=["すべて","邦画","洋画"];
 $("#boxRegionChips").innerHTML=regions.map(x=>'<button class="chip '+(x===boxRegion?'active':'')+'" data-box-region="'+x+'">'+x+'</button>').join("");
 const years=Object.keys(boxoffice.by_year||{}).sort().reverse();
 const periods=["歴代",...years];
 if(!periods.includes(boxEra))boxEra="歴代";
 $("#boxEraChips").innerHTML=periods.map(x=>'<button class="chip '+(x===boxEra?'active':'')+'" data-box-era="'+x+'">'+x+'</button>').join("");
 document.querySelectorAll("[data-box-region]").forEach(b=>b.onclick=()=>{boxRegion=b.dataset.boxRegion;render()});
 document.querySelectorAll("[data-box-era]").forEach(b=>b.onclick=()=>{boxEra=b.dataset.boxEra;render()});
 let list=boxEra==="歴代"?(boxoffice.all_time||[]):((boxoffice.by_year||{})[boxEra]||[]);
 if(boxRegion!=="すべて")list=list.filter(x=>x.region===boxRegion);
 list=[...list].sort((a,b)=>(b.gross||0)-(a.gross||0));
 $("#grid").className="listRank";
 $("#grid").innerHTML=list.length?list.map((m,i)=>'<div class="listRow"><div class="listNo">#'+(i+1)+'</div><div><div class="listTitle">'+m.title+'</div><div class="meta">'+(m.year||boxEra||"")+' · '+m.region+'</div></div><div class="listMeta">'+Number(m.gross||0).toFixed(1)+'億円</div></div>').join(""):'<div class="empty">該当作品がありません</div>';
 const src=boxEra==="歴代"?"興行通信社・歴代興収ベスト100":"日本映画製作者連盟・年次興行資料";
 $("#sourceNote").textContent="日本国内興行収入 · "+src;
}
function render(){
 $("#moreBtn").style.display="none";
 document.querySelectorAll("[data-axis]").forEach(b=>b.classList.toggle("active",b.dataset.axis===axis));
 $("#ratingFilters").style.display=axis==="rating"?"block":"none";
 $("#boxFilters").style.display=axis==="boxoffice"?"block":"none";
 axis==="boxoffice"?renderBox():renderRating();
}
async function boot(){
 try{
  const [r,m,y,b]=await Promise.all([
   fetch("data/rankings.json?"+Date.now()),
   fetch("data/rankings_manifest.json?"+Date.now()).catch(()=>null),
   fetch("data/rankings_year.json?"+Date.now()).catch(()=>null),
   fetch("data/boxoffice.json?"+Date.now())
  ]);
  const d=await r.json();rankings=d.rankings||{};legacyGenres=d.genres||{};
  manifest=m&&m.ok?await m.json():{};
  const yd=y&&y.ok?await y.json():{};yearRankings=yd.rankings||{};yearValue=yd.year||new Date().getFullYear();
  boxoffice=await b.json();
  document.querySelectorAll("[data-axis]").forEach(btn=>btn.onclick=()=>{axis=btn.dataset.axis;render()});
  render();
 }catch(err){$("#grid").innerHTML='<p>チャートデータを読み込めませんでした。</p>'}
}
boot();
</script>
