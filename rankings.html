function allRegions(){return ["すべて",...Object.keys(rankings||{}),"アジア"]}function baseRegions(){return regionActive==="アジア"?[]:regionActive==="すべて"?Object.keys(rankings||{}):[regionActive]}function allGenres(regions){const s=new Set();regions.forEach(r=>Object.keys(rankings[r]||{}).forEach(g=>s.add(g)));return [...s]}function availableEras(regions,genres){const s=new Set();regions.forEach(r=>genres.forEach(g=>Object.keys(((rankings[r]||{})[g]||{})).forEach(e=>s.add(e))));return [...s]}

async function resolveMovie(name){if(movieLookupCache.has(name))return movieLookupCache.get(name);try{const r=await fetch("https://backend-one-gray-94.vercel.app/api/movies?q="+encodeURIComponent(name)+"&limit=5",{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json(),rows=[...(d.movies||[]),...(d.external||[])],n=name.toLowerCase();let hit=rows.find(x=>String(x.original_title||"").toLowerCase()===n)||rows.find(x=>String(x.title||"").toLowerCase()===n)||rows[0]||null;movieLookupCache.set(name,hit);return hit}catch{movieLookupCache.set(name,null);return null}}

function awardFilmName(m){return String(m.title||"").split(" — ")[0].trim()}async function hydrateAwardCards(list){const names=[...new Set(list.slice(0,60).map(awardFilmName))];let cursor=0;async function worker(){while(cursor<names.length){const name=names[cursor++],movie=await resolveMovie(name);if(!movie)continue;document.querySelectorAll('[data-award-film="'+CSS.escape(name)+'"]').forEach(card=>{const t=card.querySelector("[data-award-title]"),img=card.querySelector("[data-award-poster]"),link=card.querySelector("[data-award-detail]");if(t)t.textContent=movie.title||name;if(img&&movie.poster){img.src=movie.poster;img.hidden=false}if(link)link.href="search.html?id="+encodeURIComponent(movie.tmdbId||movie.id||"")+"&search="+encodeURIComponent(movie.title||name)})}}await Promise.all([worker(),worker(),worker(),worker()])}

function renderAwards(){const decadeOf=y=>Math.floor(Number(y)/10)*10+"年代",allEras=[...new Set(awards.map(x=>decadeOf(x.year)))].sort((a,b)=>Number(b.slice(0,4))-Number(a.slice(0,4))),recentEras=allEras.filter(x=>Number(x.slice(0,4))>=1980),oldEras=allEras.filter(x=>Number(x.slice(0,4))<1980);if(!["すべて",...allEras].includes(awardEra))awardEra="すべて";const inEra=awardEra==="すべて"?awards:awards.filter(x=>decadeOf(x.year)===awardEra),years=["すべて",...[...new Set(inEra.map(x=>String(x.year)))].sort((a,b)=>Number(b)-Number(a))];if(!awardYear||!years.includes(awardYear))awardYear=years[0]||"すべて";const inYear=awardYear==="すべて"?inEra:inEra.filter(x=>String(x.year)===awardYear),orgs=["すべて",...orderedAwardOrgs(inYear.map(x=>x.organization))];if(!orgs.includes(awardOrg))awardOrg="すべて";const inOrg=awardOrg==="すべて"?inYear:inYear.filter(x=>x.organization===awardOrg),cats=["すべて",...orderedAwardCategories(inOrg.map(x=>x.category))];if(!cats.includes(awardCategory))awardCategory="すべて";$("#awardEraChips").innerHTML=["すべて",...recentEras].map(x=>'<button class="chip '+(x===awardEra?'active':'')+'" data-award-era="'+x+'">'+x+'</button>').join("");$("#awardOldEraChips").innerHTML=oldEras.map(x=>'<button class="chip '+(x===awardEra?'active':'')+'" data-award-era="'+x+'">'+x+'</button>').join("");const oldDetails=$("#awardOlderEras");if(oldDetails)oldDetails.open=oldEras.includes(awardEra);$("#awardYearChips").innerHTML=years.map(x=>'<button class="chip '+(x===awardYear?'active':'')+'" data-award-year="'+x+'">'+x+'</button>').join("");$("#awardOrgChips").innerHTML=orgs.map(x=>'<button class="chip '+(x===awardOrg?'active':'')+'" data-award-org="'+x+'">'+x+'</button>').join("");$("#awardCategoryChips").innerHTML=cats.map(x=>'<button class="chip '+(x===awardCategory?'active':'')+'" data-award-category="'+x+'">'+x+'</button>').join("");document.querySelectorAll("[data-award-era]").forEach(x=>x.onclick=()=>{awardEra=x.dataset.awardEra;awardYear="すべて";awardOrg="すべて";awardCategory="すべて";render()});document.querySelectorAll("[data-award-year]").forEach(x=>x.onclick=()=>{awardYear=x.dataset.awardYear;awardOrg="すべて";awardCategory="すべて";render()});document.querySelectorAll("[data-award-org]").forEach(x=>x.onclick=()=>{awardOrg=x.dataset.awardOrg;awardCategory="すべて";render()});document.querySelectorAll("[data-award-category]").forEach(x=>x.onclick=()=>{awardCategory=x.dataset.awardCategory;render()});let list=inOrg.filter(x=>awardCategory==="すべて"||x.category===awardCategory);const coverageRows=awardYear==="すべて"?inEra:awards.filter(x=>String(x.year)===awardYear),note=coverageNote(awardYear,coverageRows);$("#awardCoverage").innerHTML="収録 "+awards.length+"件 · "+new Set(awards.map(x=>x.year)).size+"授賞年。"+(note?'<div class="coverageWarn">'+note+'</div>':'');$("#grid").className="awardGrid";$("#grid").innerHTML=list.length?list.map(m=>{const film=awardFilmName(m);return '<article class="awardCard" data-award-film="'+film.replace(/&/g,"&amp;").replace(/"/g,"&quot;")+'"><img class="awardPoster" data-award-poster hidden alt=""><div class="awardBody"><div class="awardTitle" data-award-title>'+film+'</div><span class="awardYear">'+m.year+'年受賞</span><div class="awardMeta">'+m.organization+' · '+m.category+'</div><div class="awardLinks"><a data-award-detail href="search.html?search='+encodeURIComponent(film)+'">作品詳細</a><a target="_blank" rel="noopener noreferrer" href="'+m.source+'">公式</a></div></div></article>'}).join(""):'<div class="empty">該当する受賞作品がありません</div>';$("#sourceNote").textContent=(awardEra==="すべて"?"全年代":awardEra)+" · "+(awardYear==="すべて"?"全授賞年":awardYear+"年")+" · 主催者公式発表で確認した受賞結果";hydrateAwardCards(list)}
