<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CINEMA DAYS — 映画ランキング</title>
<style>
:root{--bg:#0b0c10;--panel:#15171d;--panel2:#1d2028;--text:#f5f1e8;--muted:#9ca3af;--accent:#e8b44f;--line:#2a2e37}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:14px}
.wrap{max-width:1180px;margin:auto;padding:0 18px}.top{position:sticky;top:0;z-index:20;background:rgba(11,12,16,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{height:56px;display:flex;align-items:center;gap:12px}.menuBtn{margin-left:auto;width:38px;height:38px;border:0;background:transparent;color:var(--text);font-size:24px;line-height:1;border-radius:10px}.drawerMask{position:fixed;inset:0;background:#0008;z-index:80;display:none}.drawerMask.show{display:block}.drawer{position:fixed;top:0;right:0;height:100dvh;width:min(320px,84vw);background:#111318;border-left:1px solid var(--line);z-index:81;transform:translateX(100%);transition:.22s ease;padding:20px}.drawer.show{transform:translateX(0)}.drawerHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.drawerClose{width:38px;height:38px;border:0;border-radius:50%;background:var(--panel2);color:var(--text);font-size:22px}.drawer a{display:block;color:var(--text);text-decoration:none;font-size:17px;font-weight:750;padding:14px 4px;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.04em;font-size:18px}.brand b{color:var(--accent)}.nav a{color:var(--text);text-decoration:none;font-size:12px;font-weight:700}
.hero{padding:28px 0 14px}.hero h1{font-size:clamp(28px,6vw,46px);line-height:1.05;margin:0 0 8px;font-weight:850}.hero p{color:var(--muted);max-width:720px;line-height:1.6}
.chips{display:flex;gap:8px;overflow:auto;padding:8px 0 16px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 11px;font-size:12px}.chip.active{background:var(--text);color:#111}
.rankGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.rankCard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none}.rankCard img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#222}.body{padding:9px}.no{color:var(--accent);font-weight:900;font-size:12px}.title{font-weight:750;font-size:13px;line-height:1.3;margin-top:3px}.meta{color:var(--muted);font-size:11px;margin-top:5px}.note{color:var(--muted);font-size:11px;line-height:1.5;margin:14px 0 24px}
@media(max-width:760px){.wrap{padding:0 12px}.rankGrid{grid-template-columns:repeat(3,1fr);gap:6px}.body{padding:7px}.title{font-size:11px}.hero{padding:20px 0 10px}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><div class="brand">CINEMA <b>DAYS</b></div><button class="menuBtn" id="menuBtn" aria-label="メニュー">☰</button></div></header><div class="drawerMask" id="drawerMask"></div><aside class="drawer" id="drawer"><div class="drawerHead"><div class="brand">CINEMA <b>DAYS</b></div><button class="drawerClose" id="drawerClose">×</button></div><a href="index.html">カレンダー</a><a href="rankings.html">映画ランキング</a></aside>
<main class="wrap">
<section class="hero"><h1>映画ランキング</h1><p>ジャンルごとに評価の高い映画を一覧化。カレンダーとは分けて、映画を探すためのページとして使えます。</p></section>
<div class="chips" id="regionChips"></div><div class="chips" id="genreChips"></div><div class="chips" id="eraChips"></div><div class="rankGrid" id="grid"></div>
<div class="note">ランキングはTMDB評価を使用し、少数票の偏りを抑えるため一定数以上の投票がある作品を対象にしています。</div>
</main>
<script>
let rankings={},legacyGenres={},regionActive="邦画",genreActive="",eraActive="";
const $=s=>document.querySelector(s);
function render(){let regions=Object.keys(rankings||{});if(!regions.length&&Object.keys(legacyGenres||{}).length){$("#regionChips").innerHTML='<span class="chip active">総合</span>';let genres=Object.keys(legacyGenres);if(!genreActive||!legacyGenres[genreActive])genreActive=genres[0]||"";$("#genreChips").innerHTML=genres.map(x=>'<button class="chip '+(x===genreActive?'active':'')+'" data-genre="'+x+'">'+x+'</button>').join("");$("#eraChips").innerHTML='<span class="chip active">全年代</span>';document.querySelectorAll("[data-genre]").forEach(b=>b.onclick=()=>{genreActive=b.dataset.genre;render()});let list=legacyGenres[genreActive]||[];$("#grid").innerHTML=list.map((m,i)=>'<a class="rankCard" target="_blank" href="'+m.tmdb+'">'+(m.poster?'<img src="'+m.poster+'" loading="lazy">':'')+'<div class="body"><div class="no">#'+(i+1)+'</div><div class="title">'+m.title+'</div><div class="meta">'+(m.year||"")+' · ★ '+Number(m.score||0).toFixed(1)+' · '+(m.votes||0)+'票</div></div></a>').join("");return}if(!regions.length){$("#grid").innerHTML='<p>ランキングデータを読み込めませんでした。</p>';return}if(!rankings[regionActive])regionActive=regions[0];let genres=Object.keys(rankings[regionActive]||{});if(!genreActive||!rankings[regionActive][genreActive])genreActive=genres[0]||"";let eras=Object.keys((rankings[regionActive]&&rankings[regionActive][genreActive])||{});if(!eraActive||!rankings[regionActive][genreActive][eraActive])eraActive=eras[eras.length-1]||"";$("#regionChips").innerHTML=regions.map(x=>'<button class="chip '+(x===regionActive?'active':'')+'" data-region="'+x+'">'+x+'</button>').join("");$("#genreChips").innerHTML=genres.map(x=>'<button class="chip '+(x===genreActive?'active':'')+'" data-genre="'+x+'">'+x+'</button>').join("");$("#eraChips").innerHTML=eras.map(x=>'<button class="chip '+(x===eraActive?'active':'')+'" data-era="'+x+'">'+x+'</button>').join("");document.querySelectorAll("[data-region]").forEach(b=>b.onclick=()=>{regionActive=b.dataset.region;genreActive="";eraActive="";render()});document.querySelectorAll("[data-genre]").forEach(b=>b.onclick=()=>{genreActive=b.dataset.genre;eraActive="";render()});document.querySelectorAll("[data-era]").forEach(b=>b.onclick=()=>{eraActive=b.dataset.era;render()});let list=(((rankings[regionActive]||{})[genreActive]||{})[eraActive]||[]);$("#grid").innerHTML=list.map((m,i)=>'<a class="rankCard" target="_blank" href="'+m.tmdb+'">'+(m.poster?'<img src="'+m.poster+'" loading="lazy">':'')+'<div class="body"><div class="no">#'+(i+1)+'</div><div class="title">'+m.title+'</div><div class="meta">'+(m.year||"")+' · ★ '+Number(m.score||0).toFixed(1)+' · '+(m.votes||0)+'票</div></div></a>').join("")}
async function boot(){try{let r=await fetch("data/rankings.json?"+Date.now());let d=await r.json();rankings=d.rankings||{};legacyGenres=d.genres||{};render()}catch(e){$("#grid").innerHTML='<p>ランキングデータを読み込めませんでした。</p>'}}boot();
</script>
</body></html>
