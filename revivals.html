</aside><main class="wrap"><section class="hero"><div class="eyebrow">劇場公開の特集</div><h1>再上映情報</h1><p>過去作の再上映・復刻上映・周年上映など、もう一度スクリーンで観られる機会をまとめます。Cinemapの主要機能ではなく、劇場公開カレンダーを補う特集ページです。</p></section><div class="note">掲載は公式情報から手動で確認した一部の再上映です。網羅的な上映予定ではありません。開始日のみの作品は現在も上映中とは限りません。最新の上映日・劇場は公式サイトでご確認ください。</div><div id="status" class="status">確認済み情報を読み込み中…</div><div id="grid" class="grid"></div></main><div class="foot">Cinemap v0.4.59</div><script>const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function run(){const status=document.getElementById("status"),grid=document.getElementById("grid");try{const response=await fetch("data/revival_screenings.json");if(!response.ok)throw Error("revivals unavailable");const data=await response.json(),screenings=(data.screenings||[]).filter(m=>m.title&&m.date&&/^https:\/\//.test(m.source_url||""));status.textContent="公式情報で確認した"+screenings.length+"件 · データ確認日 "+(data.generated_at||"不明")+"。掲載は一部のみ。上映期間・上映方式は各劇場の公式案内をご確認ください。";grid.innerHTML=screenings.map(m=>'<article class="card"><div class="body"><div class="tag">公式情報で確認</div><div class="title"><a href="search.html?search='+encodeURIComponent(m.title)+'">'+E(m.title)+'</a></div><div class="meta">'+E(m.date)+(m.end_date?'〜'+E(m.end_date):' 開始')+' · '+E(m.venue||"劇場は公式案内で確認")+'</div><div class="meta"><a href="'+E(m.source_url)+'" target="_blank" rel="noopener noreferrer">上映情報を公式サイトで確認 →</a></div></div></article>').join("")||'<div class="status">現在、確認済みの再上映情報はありません。</div>'}catch{status.textContent="再上映情報を読み込めませんでした。"}}run();</script><script>(()=>{const b=document.getElementById("gMenuBtn"),d=document.getElementById("gDrawer"),m=document.getElementById("gDrawerMask"),x=document.getElementById("gDrawerClose");if(!b||!d||!m)return;const o=()=>{d.classList.add("show");m.classList.add("show")},c=()=>{d.classList.remove("show");m.classList.remove("show")};b.onclick=o;m.onclick=c;if(x)x.onclick=c})();</script></body></html>
