<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>リバイバル上映レーダー | CINEMAP</title><style>:root{--bg:#090909;--panel:#141414;--line:#292929;--text:#f3f3f3;--muted:#999;--accent:#e54848}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.wrap{max-width:1050px;margin:auto;padding:0 17px}header{position:sticky;top:0;background:#090909ee;border-bottom:1px solid var(--line);z-index:5}.nav{height:60px;display:flex;align-items:center}.brand{color:#fff;text-decoration:none;font-weight:900;font-size:20px}.nav a:last-child{margin-left:auto;color:#bbb;text-decoration:none;font-size:12px}.hero{padding:30px 0 18px}.hero h1{margin:0 0 8px;font-size:28px}.hero p{color:var(--muted);font-size:13px;line-height:1.65;max-width:720px}.note{border:1px solid #3b3025;background:#17130f;padding:11px;border-radius:9px;color:#bdb1a2;font-size:11px;line-height:1.6;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;color:inherit;text-decoration:none}.poster{aspect-ratio:2/3;background:#222}.poster img{width:100%;height:100%;object-fit:cover}.body{padding:10px}.tag{font-size:10px;color:#ff9c9c;font-weight:800}.title{font-weight:850;margin:5px 0;font-size:13px}.meta{color:var(--muted);font-size:11px}.status{color:var(--muted);padding:25px 0}.foot{text-align:center;color:#666;font-size:11px;padding:35px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.hero h1{font-size:25px}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">CINEMAP</a><a href="index.html">カレンダーへ</a></div></header><main class="wrap"><section class="hero"><h1>リバイバル上映レーダー</h1><p>過去作が、いま再び劇場公開予定に入っている可能性を自動で拾います。名作をスクリーンで観る機会を逃さないためのレーダーです。</p></section><div class="note">初公開日と日本の劇場公開予定日の差から抽出する「候補」です。日本での初公開が遅れた作品なども含むため、再上映・4K修復・周年上映などの種別は公式情報で確認できたものだけ今後確定表示します。</div><div id="status" class="status">候補を調査中…</div><div id="grid" class="grid"></div></main><div class="foot">CINEMAP v0.4.50</div><script>const API="https://backend-one-gray-94.vercel.app",E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function run(){try{let t=await fetch("data/theatrical.json",{cache:"no-store"}).then(r=>r.json()),now=new Date(),movies=(t.movies||[]).filter(x=>{let d=new Date(x.date);return d>=new Date(now.getTime()-30*864e5)&&d<=new Date(now.getTime()+180*864e5)}).slice(0,90),out=[];for(let i=0;i<movies.length;i+=8){let batch=movies.slice(i,i+8);let ds=await Promise.all(batch.map(async m=>{try{let d=await fetch(API+"/api/movie-detail?id="+m.id).then(r=>r.json()),o=d.movie;if(!o?.date)return null;let gap=new Date(m.date).getFullYear()-new Date(o.date).getFullYear();return gap>=2?{...m,original:o.date,gap}:null}catch{return null}}));out.push(...ds.filter(Boolean));document.getElementById("status").textContent="調査中… "+Math.min(i+8,movies.length)+"/"+movies.length}out.sort((a,b)=>a.date.localeCompare(b.date));document.getElementById("status").textContent=out.length+"件の候補";document.getElementById("grid").innerHTML=out.map(m=>'<a class="card" href="search.html?search='+encodeURIComponent(m.title)+'"><div class="poster">'+(m.poster?'<img loading="lazy" src="'+E(m.poster)+'">':'')+'</div><div class="body"><div class="tag">REVIVAL CANDIDATE</div><div class="title">'+E(m.title)+'</div><div class="meta">劇場予定 '+E(m.date)+'<br>初公開 '+E(m.original)+' · '+m.gap+'年後</div></div></a>').join("")||'<div class="status">現在、条件に合う候補はありません。</div>'}catch{document.getElementById("status").textContent="データを取得できませんでした。"}}run();</script></body></html>
