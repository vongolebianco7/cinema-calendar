function compareReason(m,dna,x){

 if(shared.length>=2)return "共通ジャンル："+shared.slice(0,2).join(" × ");

function criticVideoTags(v,topic,kind){

 if(/撮影|映像|画角|カメラ|cinematography|visual|imax/.test(t))add("映像演出");
 if(/脚本|構成|伏線|ストーリー|物語|screenplay|story|ending|考察/.test(t))add("脚本・構造");
 if(/テーマ|意味|解釈|哲学|社会|象徴|メタファー|analysis|meaning/.test(t))add("テーマ解釈");
 if(/監督|director|作家性|演出/.test(t))add("作家論");
 if(/音楽|音響|サウンド|score|music/.test(t))add("音・音楽");
 if(/演技|俳優|character|acting/.test(t))add("演技・人物");
 if(/映画史|ジャンル|genre|history|比較/.test(t))add("映画史・比較");
 if(!tags.length){
   const fallback={IMAGE:"映像演出",STORY:"脚本・構造",PERFORMANCE:"演技・人物",SOUND:"音・音楽",AUTHOR:"作家論",HISTORY:"映画史・比較",THEME:"テーマ解釈"};

}

async function loadCriticVideos(panel,m,x){

 const box=panel.querySelector("[data-critic-videos]");if(!box)return;
 box.innerHTML='<div class="small">人間の批評を検索中…</div>';
 try{
  const cacheKey=String(m.tmdbId||m.id||m.title)+"|"+x.kind+"|"+x.title;
  let d=criticVideoCache.get(cacheKey);

    const u=API+"/api/critic-videos?title="+encodeURIComponent(m.title)+"&topic="+encodeURIComponent(x.title)+"&kind="+encodeURIComponent(x.kind||"");

  const videos=(d.videos||[]).map(v=>({...v,_tags:criticVideoTags(v,x.title,x.kind)}));
  const renderVideos=list=>{box.innerHTML=list.length?list.map(v=>{const tags=v._tags||[];return '<a class="criticVideo" target="_blank" rel="noopener noreferrer" href="'+E(v.url)+'">'+(v.thumbnail?'<img src="'+E(v.thumbnail)+'" alt="">':'<div></div>')+'<div><span class="youtubeSource">YouTube</span><b>'+E(v.title)+'</b><span>'+E(v.channelTitle)+(v.publishedAt?' · '+E(String(v.publishedAt).slice(0,10)):'')+'</span><span class="cinemapLensLabel">Cinemap独自の視点分類</span><div class="criticTags">'+tags.map(t=>'<span class="criticTag">'+E(t)+'</span>').join("")+'</div></div></a>'}).join(""):'<div class="small">この論点に合う動画を確認できませんでした。</div>'};
  const overview=panel.querySelector("[data-critic-overview]");
  const counts=new Map();
  videos.forEach(v=>(v._tags||[]).forEach(t=>counts.set(t,(counts.get(t)||0)+1)));
  if(overview){
    const items=[["すべて",videos.length],...[...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"ja"))];
    overview.innerHTML=items.map((it,i)=>'<button type="button" class="'+(i===0?'active':'')+'" data-view-tag="'+E(it[0])+'">'+E(it[0])+' '+it[1]+'</button>').join("");

      const tag=btn.dataset.viewTag;
      renderVideos(tag==="すべて"?videos:videos.filter(v=>(v._tags||[]).includes(tag)));
    });
  }
  const matrix=panel.querySelector("[data-critic-matrix]");
  if(matrix){
    const lenses=[...counts.keys()].sort((a,b)=>(counts.get(b)||0)-(counts.get(a)||0)||a.localeCompare(b,"ja")).slice(0,5);
    const channels=[...new Set(videos.map(v=>v.channelTitle).filter(Boolean))].slice(0,6);
    if(lenses.length&&channels.length){
      const cols='140px repeat('+lenses.length+', minmax(76px,1fr))';
      let cells='<div class="criticMatrixCell criticMatrixHead">発信元</div>'+lenses.map(t=>'<div class="criticMatrixCell criticMatrixHead">'+E(t)+'</div>').join("");
      channels.forEach(ch=>{
        cells+='<div class="criticMatrixCell criticMatrixChannel">'+E(ch)+'</div>';
        lenses.forEach(tag=>{
          const n=videos.filter(v=>v.channelTitle===ch&&(v._tags||[]).includes(tag)).length;
          cells+=n?'<button type="button" class="criticMatrixCell criticMatrixHit" data-matrix-channel="'+E(ch)+'" data-matrix-tag="'+E(tag)+'">'+n+'</button>':'<div class="criticMatrixCell criticMatrixEmpty">–</div>';
        });

      matrix.innerHTML='<div class="criticMatrixTitle">発信元 × Cinemap独自の視点分類</div><div class="criticMatrixGrid" style="grid-template-columns:'+cols+'">'+cells+'</div>';

        if(overview)overview.querySelectorAll("button").forEach(x=>x.classList.remove("active"));
      });

 }catch(e){box.innerHTML='<div class="small">批評動画を取得できませんでした。</div>'}
}
