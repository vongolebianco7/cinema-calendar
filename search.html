lass="section"><h3>'+E(m.director||"監督")+'の作品</h3><div class="works">'+w.map((x,i)=>'<button type="button" class="work directorWork" data-w="'+i+'" style="border:0;background:transparent;color:inherit;text-align:left;padding:0;cursor:pointer">'+(x.poster?'<img src="'+E(x.poster)+'">':'')+'<b>'+E(x.title)+'</b><span class="small">'+E(x.year||"")+'</span></button>').join("")+'</div></div>':'')+'<div class="section links">'+(m.trailer_url?'<a target="_blank" href="'+E(m.trailer_url)+'">予告編</a>':'')+(m.tmdb?'<a target="_blank" href="'+E(m.tmdb)+'">TMDB</a>':'')+'</div>';document.querySelectorAll(".directorWork").forEach(b=>b.onclick=()=>openMovie(w[+b.dataset.w]))}document.getElementById("close").onclick=()=>modal.classList.remove("show");modal.onclick=e=>{if(e.target===modal)modal.classList.remove("show")};document.querySelector(".form").onsubmit=e=>{e.preventDefault();search()};q.value=new URLSearchParams(location.search).get("search")||"";if(q.value)search();</script><div style="margin:28px auto 12px;text-align:center;color:#777;font-size:11px">CINEMAP v0.4.42</div></body></html>
