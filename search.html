(m);return}try{let r=await fetch(API+"/api/movie-detail?id="+encodeURIComponent(id),{cache:"no-store"});if(!r.ok)throw new Error("detail "+r.status);let d=await r.json();let movie=d.movie||m;try{let vg=await fetch("data/viewing_guides.json",{cache:"no-store"}).then(x=>x.json());movie.viewing_guide=(vg.guides||[]).find(x=>Number(x.tmdb_id)===Number(movie.tmdbId||movie.id))||null}catch{}renderDetail(movie)}catch(e){renderDetail(m)}}function criticTopics(m,dna){

function criticVideoTags(v,topic,kind){
