<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>作品検索 | CINEMAP</title><style>:root{--bg:#0a0a0a;--panel:#141414;--line:#292929;--text:#f5f5f5;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:1050px;margin:auto;padding:0 18px}header{position:sticky;top:0;z-index:5;background:#0a0a0af2;border-bottom:1px solid var(--line)}.nav{height:72px;display:flex;align-items:center;gap:14px}.logo{width:166px;max-width:32vw}.form{display:flex;flex:1;gap:8px}.form input{min-width:0;flex:1;background:#111;border:1px solid #3a3a3a;border-radius:22px;padding:11px 16px;color:#fff;font-size:16px}.form button{border:0;border-radius:20px;padding:0 16px;font-weight:800}.hero{padding:28px 0 14px}.hero h1{font-size:25px;margin:0 0 7px}.hero p,.status,.small{color:var(--muted)}.status{padding:16px 0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;padding-bottom:50px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;cursor:pointer;color:inherit}.poster{aspect-ratio:2/3;background:#222}.poster img{width:100%;height:100%;object-fit:cover}.body{padding:10px}.title{font-weight:800;line-height:1.35}.meta,.score{font-size:12px;margin-top:6px}.meta{color:var(--muted)}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;overflow:auto}.modal.show{display:block}.sheet{width:min(760px,100%);min-height:100%;margin-left:auto;background:#101010;padding:24px 20px 60px}.close{float:right;width:40px;height:40px;border-radius:50%;border:0;font-size:24px}.detailTop{display:grid;grid-template-columns:120px 1fr;gap:16px;clear:both}.detailTop img{width:120px;border-radius:9px}.detailTop h2{margin:4px 0 8px}.small{font-size:13px;line-height:1.7}.section{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}.works{display:flex;gap:11px;overflow:auto}.work{flex:0 0 100px}.work img{width:100px;aspect-ratio:2/3;object-fit:cover;border-radius:7px}.work b{font-size:11px;display:block}.links a{color:#fff;margin-right:14px}.dna{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.dnaCell{background:#171717;border:1px solid var(--line);border-radius:9px;padding:10px}.dnaCell strong{display:block;font-size:11px;color:#888;margin-bottom:5px}.dnaCell a{color:#fff;text-decoration:none;font-size:13px;font-weight:750}.watchNow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.watchAction{display:block;background:#181818;border:1px solid var(--line);border-radius:10px;padding:12px;color:#fff;text-decoration:none}.watchAction strong{display:block;font-size:13px}.watchAction span{display:block;color:#888;font-size:11px;margin-top:4px}.viewGuide{background:linear-gradient(135deg,#1b1515,#121212);border:1px solid #553333;border-radius:11px;padding:14px}.viewBest{font-size:21px;font-weight:900;margin:5px 0 8px}.reason{font-size:12px;color:#bbb;margin:4px 0}.sourceLink{font-size:11px;color:#aaa}.deepTitle{display:flex;justify-content:space-between;align-items:end}.deepTitle span{font-size:10px;color:#888}@media(max-width:650px){.logo{width:150px}.dna{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,1fr);gap:11px}.detailTop{grid-template-columns:100px 1fr}.detailTop img{width:100px}}</style></head><body><header><div class="wrap nav"><a href="index.html"><img class="logo" src="assets/cinemap-logo.png?v=2"></a><form class="form"><input id="q" name="search" type="search" placeholder="作品名を検索"><button>検索</button></form></div></header><main class="wrap"><div class="hero"><h1>作品検索</h1><p>公開中の作品だけでなく、過去作品も検索できます。</p></div><div id="status" class="status"></div><div id="grid" class="grid"></div></main><div id="modal" class="modal"><div class="sheet"><button id="close" class="close">×</button><div id="detail"></div></div></div><script>const API="https://backend-one-gray-94.vercel.app",E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),q=document.getElementById("q"),grid=document.getElementById("grid"),status=document.getElementById("status"),modal=document.getElementById("modal"),detail=document.getElementById("detail");let results=[];async function search(){let term=q.value.trim();if(!term)return;history.replaceState(null,"","search.html?search="+encodeURIComponent(term));status.textContent="「"+term+"」を検索中…";grid.innerHTML="";try{let r=await fetch(API+"/api/movies?q="+encodeURIComponent(term)+"&limit=20",{cache:"no-store"}),d=await r.json(),seen=new Set();results=[...(d.movies||[]),...(d.external||[])].filter(m=>{let k=String(m.tmdbId||m.id||m.title);if(seen.has(k))return false;seen.add(k);return true});status.textContent="「"+term+"」 "+results.length+"件";grid.innerHTML=results.map((m,i)=>'<button class="card" data-i="'+i+'" style="padding:0;text-align:left"><div class="poster">'+(m.poster?'<img src="'+E(m.poster)+'" loading="lazy">':'')+'</div><div class="body"><div class="title">'+E(m.title)+'</div><div class="meta">'+E(m.year||String(m.date||"").slice(0,4))+'</div><div class="score">TMDB ★ '+Number(m.score||0).toFixed(1)+'</div></div></button>').join("")||'<div class="status">該当作品なし</div>';document.querySelectorAll(".card").forEach(x=>x.onclick=()=>openMovie(results[+x.dataset.i]))}catch(e){status.textContent="検索データを取得できませんでした。"}}async function openMovie(m){modal.classList.add("show");detail.innerHTML='<div class="status">読み込み中…</div>';const id=m.tmdbId||(m.catalog||m.source==="tmdb"?m.id:null);if(!id){renderDetail(m);return}try{let r=await fetch(API+"/api/movie-detail?id="+encodeURIComponent(id),{cache:"no-store"});if(!r.ok)throw new Error("detail "+r.status);let d=await r.json();let movie=d.movie||m;try{let vg=await fetch("data/viewing_guides.json",{cache:"no-store"}).then(x=>x.json());movie.viewing_guide=(vg.guides||[]).find(x=>Number(x.tmdb_id)===Number(movie.tmdbId||movie.id))||null}catch{}renderDetail(movie)}catch(e){renderDetail(m)}}function renderDetail(m){let av=m.availability||{},dna=m.dna||{},personLink=(x,label)=>'<a href="discover.html?person='+encodeURIComponent(x.id)+'&role='+encodeURIComponent(label)+'&name='+encodeURIComponent(x.name)+'">'+E(x.name)+'</a>',dnaRows=[["監督",dna.directors],["脚本",dna.writers],["撮影",dna.cinematography],["音楽",dna.music],["編集",dna.editing]].filter(x=>x[1]&&x[1].length),dnaHtml=dnaRows.map(x=>'<div class="dnaCell"><strong>'+x[0]+'</strong>'+x[1].map(y=>personLink(y,x[0])).join(" / ")+'</div>').join("")+(dna.production?.length?'<div class="dnaCell"><strong>製作会社</strong>'+dna.production.map(x=>E(x.name)).join(" / ")+'</div>':"")+(m.countries?.length?'<div class="dnaCell"><strong>製作国</strong>'+E(m.countries.join(" / "))+'</div>':"")+(m.genres?.length?'<div class="dnaCell"><strong>ジャンル</strong>'+E(m.genres.join(" / "))+'</div>':""),related=m.related||[],p=[av.flatrate&&av.flatrate.length?"見放題："+av.flatrate.join(" / "):"",av.rent&&av.rent.length?"レンタル："+av.rent.join(" / "):"",av.buy&&av.buy.length?"購入："+av.buy.join(" / "):""].filter(Boolean).join("<br>")||"配信情報を確認できていません。",w=(m.director_works||[]).slice().sort((a,b)=>Number(a.year||9999)-Number(b.year||9999)||String(a.title||"").localeCompare(String(b.title||""),"ja")).slice(0,30);detail.innerHTML='<div class="detailTop">'+(m.poster?'<img src="'+E(m.poster)+'">':'<div></div>')+'<div><div class="small">'+E(m.year||String(m.date||"").slice(0,4))+'</div><h2>'+E(m.title)+'</h2><div>TMDB ★ '+Number(m.score||0).toFixed(1)+'</div><div class="small">'+(m.runtime?m.runtime+"分 · ":"")+E((m.genres||[]).join(" / "))+'</div></div></div>'+(m.viewing_guide?'<div class="section"><h3>最高の観方</h3><div class="viewGuide"><div class="small">CINEMAP VIEWING GUIDE</div><div class="viewBest">'+E(m.viewing_guide.best)+'</div>'+m.viewing_guide.reasons.map(x=>'<div class="reason">・'+E(x)+'</div>').join("")+'<a class="sourceLink" target="_blank" href="'+E(m.viewing_guide.source_url)+'">根拠：'+E(m.viewing_guide.source_name)+'</a><br><a class="sourceLink" href="theaters.html">対応する映画館を探す →</a></div></div>':'')+(m.overview?'<div class="section"><h3>あらすじ</h3><div class="small">'+E(m.overview)+'</div></div>':'')+'<div class="section"><h3>作品情報</h3><div class="small">'+(m.director?"監督："+E(m.director)+"<br>":"")+(m.cast&&m.cast.length?"出演："+E(m.cast.slice(0,10).join("、")):"")+'</div></div>'+(dnaHtml?'<div class="section"><div class="deepTitle"><h3>映画DNA</h3><span>作り手から映画を掘る</span></div><div class="dna">'+dnaHtml+'</div></div>':'')+'<div class="section"><h3>現在の視聴状況</h3><div class="small">'+p+'</div></div>'+(w.length?'<div class="section"><h3>'+E(m.director||"監督")+'の作品</h3><div class="works">'+w.map((x,i)=>'<button type="button" class="work directorWork" data-w="'+i+'" style="border:0;background:transparent;color:inherit;text-align:left;padding:0;cursor:pointer">'+(x.poster?'<img src="'+E(x.poster)+'">':'')+'<b>'+E(x.title)+'</b><span class="small">'+E(x.year||"")+'</span></button>').join("")+'</div></div>':'')+(related.length?'<div class="section"><div class="deepTitle"><h3>Deep Dive</h3><span>関連作品へ潜る</span></div><div class="works">'+related.map((x,i)=>'<button type="button" class="work relatedWork" data-r="'+i+'" style="border:0;background:transparent;color:inherit;text-align:left;padding:0;cursor:pointer">'+(x.poster?'<img src="'+E(x.poster)+'">':'')+'<b>'+E(x.title)+'</b><span class="small">'+E(x.year||"")+' · ★'+Number(x.score||0).toFixed(1)+'</span></button>').join("")+'</div></div>':'')+'<div class="section links">'+(m.trailer_url?'<a target="_blank" href="'+E(m.trailer_url)+'">予告編</a>':'')+(m.tmdb?'<a target="_blank" href="'+E(m.tmdb)+'">TMDB</a>':'')+'</div>';document.querySelectorAll(".directorWork").forEach(b=>b.onclick=()=>openMovie(w[+b.dataset.w]));document.querySelectorAll(".relatedWork").forEach(b=>b.onclick=()=>openMovie(related[+b.dataset.r]))}document.getElementById("close").onclick=()=>modal.classList.remove("show");modal.onclick=e=>{if(e.target===modal)modal.classList.remove("show")};document.querySelector(".form").onsubmit=e=>{e.preventDefault();search()};q.value=new URLSearchParams(location.search).get("search")||"";if(q.value)search();</script><div style="margin:28px auto 12px;text-align:center;color:#777;font-size:11px">CINEMAP v0.4.54</div></body></html>
