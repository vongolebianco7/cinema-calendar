<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CINEMA NOW — 劇場スケジュール</title>
<style>
:root{--bg:#0d0e10;--panel:#15171b;--panel2:#1d2025;--text:#f2f3f5;--muted:#9da3ad;--line:#2a2e35;--accent:#e8b44f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:0 18px}.top{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.08em}.brand b{color:var(--accent)}a{color:inherit;text-decoration:none}
.hero{padding:34px 0 18px}.hero h1{font-size:30px;margin:0 0 8px}.hero p,.small{color:var(--muted);font-size:13px;line-height:1.6}.search{display:flex;gap:8px;margin:14px 0 22px}.search input{flex:1;background:var(--panel);border:1px solid var(--line);color:#fff;border-radius:10px;padding:12px;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.card h2{font-size:17px;margin:0 0 6px}.btn{display:inline-block;margin-top:12px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-weight:700;font-size:13px}.note{margin:18px 0;color:var(--muted);font-size:12px;line-height:1.7}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:25px}}
</style></head><body>
<header><div class="wrap top"><a class="brand" href="index.html">CINEMA <b>NOW</b></a><a href="rankings.html" class="small">ランキング</a></div></header>
<main class="wrap">
<section class="hero"><h1>劇場スケジュール</h1><p>作品名を引き継いで、主要シネコンの公式上映スケジュールへ移動できます。</p></section>
<div class="search"><input id="q" placeholder="作品名を入力"></div>
<div class="grid" id="grid"></div>
<div class="note">上映時刻は各劇場の公式サイトが最新です。CINEMA NOWでは上映時刻そのものを転載せず、公式スケジュールへの導線をまとめています。</div>
</main>
<script>
const chains=[
{name:"TOHOシネマズ",url:"https://www.tohotheater.jp/theater/find.html",desc:"全国のTOHOシネマズから劇場を選択"},
{name:"109シネマズ",url:"https://109cinemas.net/",desc:"109シネマズの劇場・上映情報"},
{name:"イオンシネマ",url:"https://www.aeoncinema.com/theater/",desc:"都道府県・劇場から上映スケジュールを確認"},
{name:"T・ジョイ / KINEZO",url:"https://tjoy.jp/",desc:"T・ジョイ、横浜ブルク13、新宿バルト9など"},
{name:"ユナイテッド・シネマ",url:"https://www.unitedcinemas.jp/sp/theater.html",desc:"全国のユナイテッド・シネマを選択"},
{name:"MOVIX / SMT",url:"https://www.smt-cinema.com/site/",desc:"MOVIX・ピカデリーなどの上映情報"}
];
const p=new URLSearchParams(location.search);const input=document.querySelector("#q");input.value=p.get("q")||"";
function render(){let title=input.value.trim();document.querySelector("#grid").innerHTML=chains.map(c=>{let search='https://www.google.com/search?q='+encodeURIComponent((title?title+' ':'')+c.name+' 上映スケジュール');return '<div class="card"><h2>'+c.name+'</h2><div class="small">'+c.desc+'</div><a class="btn" target="_blank" href="'+c.url+'">公式スケジュール</a>'+(title?'<a class="btn" target="_blank" style="margin-left:6px" href="'+search+'">「'+title+'」を探す</a>':'')+'</div>'}).join("")}
input.oninput=render;render();
</script></body></html>
