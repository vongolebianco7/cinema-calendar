<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>映画館 | CINEMAP</title>
<style>
:root{--bg:#090909;--panel:#111;--panel2:#181818;--text:#f2f2f2;--muted:#929292;--line:#292929;--accent:#ef3f3f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:1120px;margin:auto;padding:0 18px}a{color:inherit;text-decoration:none}
.top{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:#090909f2;backdrop-filter:blur(12px);z-index:20}.brandLogo{display:block;width:auto;height:32px;object-fit:contain}.topnav{display:flex;gap:16px;font-size:12px;color:#bbb}.topnav a.active{color:#fff}
.hero{padding:30px 0 18px}.hero h1{font-size:30px;margin:0 0 8px}.hero p,.small{color:var(--muted);font-size:13px;line-height:1.65}.section{padding:14px 0 30px}.sectionHead{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:12px}.sectionHead h2{margin:0;font-size:18px}.sectionHead span{font-size:11px;color:var(--muted)}
.scheduleGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.theaterFeature{border:1px solid var(--line);padding:15px;background:#0f0f0f}.theaterFeature h3{margin:0 0 5px;font-size:16px}.theaterFeature .area{font-size:11px;color:var(--muted)}.dateLine{font-size:11px;color:#ccc;margin:12px 0 8px}.filmRow{border-top:1px solid #242424;padding:9px 0}.filmRow:first-of-type{border-top:0}.filmTitle{font-size:12px;font-weight:700;line-height:1.4}.times{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.time{font-size:10px;border:1px solid #333;padding:4px 6px;color:#ddd}.official{display:inline-block;margin-top:11px;font-size:11px;text-decoration:underline;color:#ccc}
.search{display:flex;gap:8px;margin:10px 0 10px}.search input{flex:1;background:#111;border:1px solid var(--line);color:#fff;border-radius:4px;padding:12px;font:inherit}.meta{color:var(--muted);font-size:12px;margin:4px 0 15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{display:block;border-top:1px solid var(--line);padding:13px 4px}.card h3{font-size:14px;margin:0 0 5px}.place{font-size:11px;color:#aaa;line-height:1.5}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:7px}.btn{font-size:10px;text-decoration:underline;color:#bbb}.note{margin:18px 0 38px;color:var(--muted);font-size:11px;line-height:1.7}.empty{grid-column:1/-1;padding:26px 4px;color:var(--muted)}
@media(max-width:760px){.scheduleGrid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:25px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.topnav{gap:10px}.scheduleGrid{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="wrap top"><a href="index.html"><img class="brandLogo" src="assets/cinemap-logo.webp?v=3" alt="CINEMAP"></a><nav class="topnav"><a href="index.html">カレンダー</a><a class="active" href="theaters.html">映画館</a><a href="rankings.html">ランキング</a></nav></div></header>
<main class="wrap">
<section class="hero"><h1>映画館から映画を見る。</h1><p>作品だけでなく、映画館そのものを入口にする。上映スケジュールを取得できる映画館は作品と上映時刻まで表示し、そのほかの映画館も検索できます。</p></section>

<section class="section">
 <div class="sectionHead"><h2>上映スケジュール</h2><span id="scheduleMeta">読み込み中…</span></div>
 <div class="scheduleGrid" id="scheduleGrid"></div>
</section>

<section class="section">
 <div class="sectionHead"><h2>映画館を探す</h2><span>全国映画館データ</span></div>
 <div class="search"><input id="q" placeholder="映画館名・住所・地域で検索"></div>
 <div class="meta" id="meta">読み込み中…</div>
 <div class="grid" id="grid"></div>
</section>

<div class="note">上映スケジュールは取得元の公式情報に基づくデータです。取得時点以降に変更される場合があるため、鑑賞前に各映画館の公式サイトで確認してください。全国映画館データはWikidata（CC0）を利用しており、閉館・移転・名称変更が未反映の場合があります。<br><a href="credits.html">Credits / Data Sources</a></div>
</main>
<script>
const $=s=>document.querySelector(s);
let theaters=[],scheduleData={theaters:[],schedules:[]};
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function escapeAttr(v){return escapeHtml(v)}
function mapsUrl(t){const q=[t.name,t.address,t.prefecture,t.municipality].filter(Boolean).join(" ");return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q)}
async function backend(){try{const r=await fetch("data/backend.json?"+Date.now(),{cache:"no-store"});if(!r.ok)return null;const c=await r.json();return c&&c.enabled&&c.base_url?String(c.base_url).replace(/\/$/,""):null}catch(e){return null}}
function renderSchedules(){
 const schedules=scheduleData.schedules||[],defs=scheduleData.theaters||[];
 const byTheater=new Map();
 for(const s of schedules){if(!byTheater.has(s.theater))byTheater.set(s.theater,[]);byTheater.get(s.theater).push(s)}
 const cards=defs.map(t=>{
  const rows=(byTheater.get(t.name)||[]).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));
  const dates=[...new Set(rows.map(x=>x.date))].sort();
  const today=new Date().toLocaleDateString("sv-SE");
  const date=dates.find(d=>d>=today)||dates[dates.length-1];
  const day=rows.filter(x=>x.date===date),byMovie=new Map();
  for(const x of day){if(!byMovie.has(x.title))byMovie.set(x.title,[]);byMovie.get(x.title).push(x)}
  const films=[...byMovie.entries()].slice(0,8);
  const source=day.find(x=>x.source_url)?.source_url||"";
  return '<article class="theaterFeature"><h3>'+escapeHtml(t.name)+'</h3><div class="area">'+escapeHtml(t.area||"")+'</div>'+(date?'<div class="dateLine">'+date+' · '+films.length+'作品</div>':'<div class="dateLine">上映データ未取得</div>')+
    films.map(([title,shows])=>'<div class="filmRow"><div class="filmTitle">'+escapeHtml(title)+'</div><div class="times">'+shows.slice(0,6).map(x=>'<span class="time">'+escapeHtml(x.start)+(x.screen?' · '+escapeHtml(x.screen):'')+'</span>').join("")+'</div></div>').join("")+
    (source?'<a class="official" target="_blank" rel="noopener noreferrer" href="'+escapeAttr(source)+'">公式スケジュールで確認</a>':'')+'</article>'
 });
 $("#scheduleMeta").textContent=scheduleData.generated_at?"取得 "+String(scheduleData.generated_at).slice(0,16).replace("T"," ")+" UTC":"";
 $("#scheduleGrid").innerHTML=cards.length?cards.join(""):'<div class="empty">上映スケジュールを取得できていません。</div>'
}
function renderDirectory(){
 const q=$("#q").value.trim().toLowerCase();
 const list=theaters.filter(t=>!q||[t.name,t.prefecture,t.municipality,t.address].filter(Boolean).join(" ").toLowerCase().includes(q)).slice(0,300);
 $("#meta").textContent=(q?list.length+"件表示 / ":"")+theaters.length+"館収録";
 $("#grid").innerHTML=list.length?list.map(t=>{
   const place=[t.prefecture,t.municipality,t.address].filter(Boolean).join(" ");
   return '<article class="card"><h3>'+escapeHtml(t.name||"名称未登録")+'</h3><div class="place">'+escapeHtml(place||"所在地未登録")+'</div><div class="btns">'+
   (t.website?'<a class="btn" target="_blank" rel="noopener noreferrer" href="'+escapeAttr(t.website)+'">公式</a>':'')+
   '<a class="btn" target="_blank" rel="noopener noreferrer" href="'+mapsUrl(t)+'">地図</a>'+
   (t.source_url?'<a class="btn" target="_blank" rel="noopener noreferrer" href="'+escapeAttr(t.source_url)+'">データ元</a>':'')+
   '</div></article>'
 }).join(""):'<div class="empty">該当する映画館がありません</div>'
}
async function boot(){
 const base=await backend();
 try{
  const [sr,dr]=await Promise.all([
    fetch("data/theater_schedules.json?"+Date.now(),{cache:"no-store"}).catch(()=>null),
    (async()=>{let r;if(base)r=await fetch(base+"/api/theater-directory",{cache:"no-store"}).catch(()=>null);if(!r||!r.ok)r=await fetch("data/theaters_master.json?"+Date.now(),{cache:"no-store"});return r})()
  ]);
  if(sr&&sr.ok)scheduleData=await sr.json();
  if(!dr||!dr.ok)throw new Error("directory load failed");
  const d=await dr.json();theaters=d.theaters||[];
  renderSchedules();renderDirectory()
 }catch(e){
  renderSchedules();
  $("#meta").textContent="映画館データを読み込めませんでした";
  $("#grid").innerHTML='<div class="empty">データ更新後に再度お試しください</div>'
 }
}
$("#q").addEventListener("input",renderDirectory);
boot();
</script></body></html>
