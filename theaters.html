*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:1080px;margin:auto;padding:0 18px}a{color:inherit;text-decoration:none}

.hero{padding:30px 0 18px}.hero h1{font-size:30px;margin:0 0 8px}.hero p,.small{color:var(--muted);font-size:13px;line-height:1.65}.section{padding:14px 0 30px}.sectionHead{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:12px}.sectionHead h2{margin:0;font-size:18px}.sectionHead span{font-size:11px;color:var(--muted)}
.pickerLabel{font-size:10px;color:#777;letter-spacing:.08em;margin-bottom:7px}.chips{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding:0 0 12px}.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;color:#bbb;padding:8px 10px;border-radius:4px;font:inherit;font-size:11px}.chip.active{background:#eee;color:#111;border-color:#eee}
.theaterHero{border-top:1px solid var(--line);padding:18px 0 10px}.theaterHero h2{font-size:25px;margin:0 0 5px}.theaterHero .area{font-size:12px;color:#999}.dateBar{display:flex;gap:6px;overflow:auto;padding:13px 0 12px}.dateBtn{border:1px solid #333;background:transparent;color:#bbb;padding:7px 10px;border-radius:4px;font-size:11px}.dateBtn.active{background:#fff;color:#111;border-color:#fff}
.filmList{border-top:1px solid var(--line)}.film{padding:13px 0;border-bottom:1px solid #242424}.filmTitle{font-size:14px;font-weight:750;line-height:1.45}.showings{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.showing{font-size:11px;border:1px solid #343434;padding:6px 7px;min-width:72px}.showing b{display:block;font-size:12px;color:#eee}.showing span{display:block;color:#777;font-size:9px;margin-top:2px}.official{display:inline-block;margin-top:14px;font-size:11px;text-decoration:underline;color:#ccc}

.verifiedNote{border-left:2px solid #666;padding:1px 0 1px 10px;margin:8px 0 18px;color:#888;font-size:11px;line-height:1.6}
details.directory{border-top:1px solid var(--line);margin-top:8px;padding-top:16px}details.directory summary{cursor:pointer;font-size:13px;font-weight:700}.search{display:flex;gap:8px;margin:14px 0 10px}.search input{flex:1;background:#111;border:1px solid var(--line);color:#fff;border-radius:4px;padding:12px;font:inherit}.meta{color:var(--muted);font-size:11px;margin:4px 0 15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{border-top:1px solid var(--line);padding:12px 3px}.card h3{font-size:13px;margin:0 0 5px}.place{font-size:10px;color:#999;line-height:1.5}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.btn{font-size:10px;text-decoration:underline;color:#aaa}.note{margin:18px 0 38px;color:var(--muted);font-size:11px;line-height:1.7}.empty{padding:26px 4px;color:var(--muted)}
@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:25px}}

button.active *,.chip.active *,.dateBtn.active *,.modeTab.active *{color:#111!important}

<main class="wrap">
<section class="hero"><h1>映画館を探す</h1><p>行きたい映画館を地域・名前から探し、場所や公式の上映スケジュールへ進むためのページです。上映方式にこだわる場合は設備比較から探せます。</p><a class="experienceCta" href="experience.html"><span>IMAX・Dolby・4DX</span><b>上映方式の違いを見る</b><i>→</i></a></section>

<section class="section">
 <div class="sectionHead"><h2>映画館を検索</h2><span id="scheduleMeta">読み込み中…</span></div>
 <div class="search"><input id="q" placeholder="映画館名・住所・地域を入力"></div>

<div class="theaterTools" aria-label="上映方式で映画館を絞り込み">

</section>



<div class="note">上映時刻は映画館公式サイト由来の取得データを表示しています。上映内容は変更される場合があるため、鑑賞前に公式スケジュールを確認してください。<br><a href="credits.html">Credits / Data Sources</a></div>

<script>
const $=s=>document.querySelector(s);
let theaters=[],osmTheaters=[],directoryCache=[],formatData={screens:[]},scheduleData={theaters:[],schedules:[]},selectedTheater="",selectedDate="",selectedFormat=param("format");
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function mapsUrl(t){const q=[t.name,t.address,t.prefecture,t.municipality].filter(Boolean).join(" ");return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q)}
function scheduleUrl(t){if(t.website)return t.website;const q=[t.name,"上映スケジュール","公式"].filter(Boolean).join(" ");return "https://www.google.com/search?q="+encodeURIComponent(q)}
async function backend(){try{const r=await fetch("data/backend.json?"+Date.now(),{cache:"no-store"});if(!r.ok)return null;const c=await r.json();return c&&c.enabled&&c.base_url?String(c.base_url).replace(/\/$/,""):null}catch(e){return null}}
function param(name){return new URLSearchParams(location.search).get(name)||""}
function updateUrl(){const p=new URLSearchParams();if(selectedTheater)p.set("theater",selectedTheater);if(selectedDate)p.set("date",selectedDate);history.replaceState(null,"",location.pathname+(p.toString()?"?"+p.toString():""))}
function renderTheaterChips(){
 const q=($("#scheduleQ")?.value||"").trim().toLowerCase();
 if(!q){$("#theaterChips").innerHTML='<span class="empty">映画館名や地域を入力すると候補が表示されます。</span>';return}
 const scheduleNames=new Set((scheduleData.theaters||[]).map(x=>x.name)),list=directoryCache.filter(t=>[t.name,t.prefecture,t.municipality,t.address].filter(Boolean).join(" ").toLowerCase().includes(q)).slice(0,30);
 $("#theaterChips").innerHTML=list.length?list.map(t=>'<button class="chip '+(t.name===selectedTheater?'active':'')+'" data-theater="'+esc(t.name)+'">'+esc(t.name)+(scheduleNames.has(t.name)?' <span style="opacity:.65">取得済み上映時間あり</span>':'')+'</button>').join(""):'<span class="empty">該当する映画館がありません。</span>';
 document.querySelectorAll("[data-theater]").forEach(b=>b.onclick=()=>{selectedTheater=b.dataset.theater;selectedDate="";renderTheaterChips();renderTheaterDetail();updateUrl()})
}
function renderTheaterDetail(){
 const defs=scheduleData.theaters||[],def=defs.find(t=>t.name===selectedTheater),rows=(scheduleData.schedules||[]).filter(x=>x.theater===selectedTheater).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));
 if(!def){const t=directoryCache.find(x=>x.name===selectedTheater);$("#theaterDetail").innerHTML=t?'<div class="theaterHero"><h2>'+esc(t.name)+'</h2><div class="area">'+esc([t.prefecture,t.municipality,t.address].filter(Boolean).join(" "))+'</div></div><div class="verifiedNote">Cinemap内に取得済み上映時刻はありません。公式スケジュールで確認できます。</div><a class="official" target="_blank" rel="noopener noreferrer" href="'+scheduleUrl(t)+'">公式の上映スケジュールを確認</a>':'<div class="empty">映画館を選択してください。</div>';return}
 const dates=[...new Set(rows.map(x=>x.date))].sort(),today=new Date().toLocaleDateString("sv-SE");
 if(!selectedDate||!dates.includes(selectedDate)){
   const requested=param("date");
   selectedDate=requested&&dates.includes(requested)?requested:(dates.find(d=>d>=today)||dates[dates.length-1]||"")
 }
 const day=rows.filter(x=>x.date===selectedDate),byMovie=new Map();
 for(const x of day){if(!byMovie.has(x.title))byMovie.set(x.title,[]);byMovie.get(x.title).push(x)}
 const films=[...byMovie.entries()];
 const source=day.find(x=>x.source_url)?.source_url||rows.find(x=>x.source_url)?.source_url||"";
 $("#theaterDetail").innerHTML='<div class="theaterHero"><h2>'+esc(def.name)+'</h2><div class="area">'+esc(def.area||"")+'</div></div>'+
   '<div class="pickerLabel">DATE</div><div class="dateBar">'+dates.map(d=>'<button class="dateBtn '+(d===selectedDate?'active':'')+'" data-date="'+d+'">'+d.slice(5).replace("-","/")+'</button>').join("")+'</div>'+
   '<div class="verifiedNote">この欄は取得済みの公式上映スケジュールだけを表示しています。データにない上映を「上映なし」とは判断しません。</div>'+
   '<div class="filmList">'+(films.length?films.map(([title,shows])=>'<article class="film"><div class="filmTitle">'+esc(title)+'</div><div class="showings">'+shows.sort((a,b)=>a.start.localeCompare(b.start)).map(x=>'<div class="showing"><b>'+esc(x.start)+(x.end?'–'+esc(x.end):'')+'</b><span>'+esc(x.screen||"スクリーン未確認")+'</span></div>').join("")+'</div></article>').join(""):'<div class="empty">この日の取得済み上映データはありません。</div>')+'</div>'+
   (source?'<a class="official" target="_blank" rel="noopener noreferrer" href="'+esc(source)+'">公式スケジュールで確認</a>':'');
 document.querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;renderTheaterDetail();updateUrl()})
}
function formatMatches(actual,wanted){actual=String(actual||"").trim().toLowerCase();wanted=String(wanted||"").trim().toLowerCase();if(wanted==="imax")return actual.startsWith("imax");return actual===wanted}
function renderFormatDirectory(){
 if(!selectedFormat)return false;
 const rows=(formatData.screens||[]).filter(x=>formatMatches(x.format,selectedFormat));
 $("#q").value="";
 $("#meta").textContent=selectedFormat+" 対応スクリーン "+rows.length+"件";
 $("#grid").innerHTML=rows.length?rows.map(x=>'<article class="card"><h3>'+esc(x.theater)+'</h3><div class="place">'+esc([x.prefecture,x.screen].filter(Boolean).join(" · "))+'</div><div class="btns"><a class="btn" target="_blank" rel="noopener noreferrer" href="'+esc(x.source_url)+'">設備の公式情報</a><a class="btn" href="theaters.html?search='+encodeURIComponent(x.theater)+'">映画館を開く</a></div></article>').join(""):'<div class="empty">確認済みの対応スクリーンがありません。</div>';
 return true
}
function renderDirectory(){
 if(renderFormatDirectory())return;
 const all=[...theaters,...osmTheaters],uniq=new Map();all.forEach(t=>{const k=String(t.name||"").replace(/[\\s　]/g,"").toLowerCase()+"|"+String(t.prefecture||"")+"|"+String(t.municipality||"");if(k&&!uniq.has(k))uniq.set(k,t)});const directory=[...uniq.values()];
 const q=$("#q").value.trim().toLowerCase();
 directoryCache=directory;
 if(!q){$("#meta").textContent=directory.length+"館収録 · 検索すると候補を表示します";$("#grid").innerHTML='<div class="empty">映画館名・住所・地域を入力してください。</div>';return}
 const list=directory.filter(t=>[t.name,t.prefecture,t.municipality,t.address].filter(Boolean).join(" ").toLowerCase().includes(q)).slice(0,80);
 $("#meta").textContent=list.length+"件表示 / "+directory.length+"館収録";
 $("#grid").innerHTML=list.length?list.map(t=>{const place=[t.prefecture,t.municipality,t.address].filter(Boolean).join(" ");return '<article class="card"><h3>'+esc(t.name||"名称未登録")+'</h3><div class="place">'+esc(place||"所在地未登録")+'</div><div class="btns">'+(t.website?'<a class="btn" target="_blank" rel="noopener noreferrer" href="'+esc(t.website)+'">公式</a>':'')+'<a class="btn" target="_blank" rel="noopener noreferrer" href="'+scheduleUrl(t)+'">上映スケジュール</a><a class="btn" target="_blank" rel="noopener noreferrer" href="'+mapsUrl(t)+'">地図</a></div></article>'}).join(""):'<div class="empty">該当する映画館がありません。</div>'
}
async function loadDirectory(base){
 let loaded=[];
 if(base){try{const r=await fetch(base+"/api/theater-directory",{cache:"no-store"});if(r.ok){const d=await r.json();loaded=d.theaters||[]}}catch(_){}}
 if(!loaded.length){try{const r=await fetch("data/theaters_master.json?"+Date.now(),{cache:"no-store"});if(r.ok){const d=await r.json();loaded=d.theaters||d||[]}}catch(_){}}
 theaters=Array.isArray(loaded)?loaded:[];
 try{const r=await fetch("data/theaters_osm.json?"+Date.now(),{cache:"no-store"});if(r.ok){const d=await r.json();osmTheaters=d.theaters||[]}}catch(_){}

<script id="cinemap-theater-equipment-js-v1">
(function(){
 const norm=s=>String(s||'').replace(/[\s　・･\.\-]/g,'').toLowerCase();
 const originalRender=window.renderDirectory;
 let equipmentFilter=selectedFormat||'';
 function formatFamilyMatch(actual,wanted){
   actual=String(actual||'').trim(); wanted=String(wanted||'').trim();
   if(!wanted)return true;
   if(wanted==='IMAX')return /^IMAX/i.test(actual);
   if(wanted==='ScreenX')return /screenx/i.test(actual);
   if(wanted==='Dolby Atmos')return /dolby atmos/i.test(actual)||/atmos/i.test(actual);
   return actual.toLowerCase()===wanted.toLowerCase();
 }
 window.theaterFormatRows=function(t){
   const tn=norm(t&&t.name), pref=String(t&&t.prefecture||'');
   return (formatData.screens||[]).filter(x=>{
     const xn=norm(x.theater);
     if(!tn||!xn)return false;
     const nameMatch=xn===tn||xn.includes(tn)||tn.includes(xn);
     const prefMatch=!pref||!x.prefecture||String(x.prefecture)===pref;
     return nameMatch&&prefMatch;
   });
 };
 window.renderEquipmentSummary=function(t){
   const rows=window.theaterFormatRows(t);
   if(!rows.length)return '<div class="theaterFormats"><span class="formatTag unknown">上映方式 未確認</span></div><div class="equipmentSummary"><b>スクリーン設備 未確認</b>確認できた設備情報のみ表示します。</div>';
   const formats=[...new Set(rows.map(x=>String(x.format||'').trim()).filter(Boolean))];
   const screens=[...new Set(rows.map(x=>String(x.screen||'').trim()).filter(Boolean))];
   const tags=formats.map(f=>'<a class="formatTag" href="experience.html?format='+encodeURIComponent(f)+'">'+esc(f)+'</a>').join('');
   const source=rows.find(x=>x.source_url)?.source_url||'';
   const screenText=screens.length?screens.join(' / '):'未確認';
   return '<div class="theaterFormats">'+tags+'</div><div class="equipmentSummary"><b>スクリーン設備</b>'+esc(screenText)+(source?' · <a target="_blank" rel="noopener noreferrer" href="'+esc(source)+'">公式設備情報</a>':'')+'</div>';
 };
 function renderEnhancedDirectory(){
   const all=[...theaters,...osmTheaters],uniq=new Map();
   all.forEach(t=>{const k=norm(t.name)+'|'+String(t.prefecture||'')+'|'+String(t.municipality||'');if(k&&!uniq.has(k))uniq.set(k,t)});
   let directory=[...uniq.values()]; directoryCache=directory;
   const q=$("#q").value.trim().toLowerCase();
   if(equipmentFilter) directory=directory.filter(t=>window.theaterFormatRows(t).some(x=>formatFamilyMatch(x.format,equipmentFilter)||formatFamilyMatch(x.screen,equipmentFilter)));
   if(q) directory=directory.filter(t=>[t.name,t.prefecture,t.municipality,t.address].filter(Boolean).join(' ').toLowerCase().includes(q));
   if(!q&&!equipmentFilter){$("#meta").textContent=directory.length+'館収録 · 名前・地域、または上映方式で探せます';$("#grid").innerHTML='<div class="empty">映画館名・住所・地域を入力するか、上映方式を選んでください。</div>';return}
   $("#meta").textContent=directory.length+'件表示'+(equipmentFilter?' · '+equipmentFilter:'');
   $("#grid").innerHTML=directory.length?directory.slice(0,100).map(t=>{const place=[t.prefecture,t.municipality,t.address].filter(Boolean).join(' ');return '<article class="card"><h3>'+esc(t.name||'名称未登録')+'</h3><div class="place">'+esc(place||'所在地未登録')+'</div>'+window.renderEquipmentSummary(t)+'<div class="btns">'+(t.website?'<a class="btn" target="_blank" rel="noopener noreferrer" href="'+esc(t.website)+'">公式</a>':'')+'<a class="btn" target="_blank" rel="noopener noreferrer" href="'+scheduleUrl(t)+'">上映スケジュール</a><a class="btn" target="_blank" rel="noopener noreferrer" href="'+mapsUrl(t)+'">地図</a></div></article>'}).join(''):'<div class="empty">条件に合う映画館がありません。</div>';
 }
 window.renderDirectory=renderEnhancedDirectory;
 document.querySelectorAll('[data-format-filter]').forEach(b=>b.addEventListener('click',()=>{
   equipmentFilter=b.dataset.formatFilter||''; selectedFormat=equipmentFilter;
   document.querySelectorAll('[data-format-filter]').forEach(x=>x.classList.toggle('active',x===b));
   const p=new URLSearchParams(location.search); if(equipmentFilter)p.set('format',equipmentFilter);else p.delete('format'); history.replaceState(null,'',location.pathname+(p.toString()?'?'+p:''));
   renderEnhancedDirectory();
 }));
 if(equipmentFilter){const b=[...document.querySelectorAll('[data-format-filter]')].find(x=>formatFamilyMatch(equipmentFilter,x.dataset.formatFilter)&&x.dataset.formatFilter);if(b){document.querySelectorAll('[data-format-filter]').forEach(x=>x.classList.toggle('active',x===b));}}
 const timer=setInterval(()=>{if((theaters.length||osmTheaters.length)&&formatData&&Array.isArray(formatData.screens)){clearInterval(timer);renderEnhancedDirectory();}},100);
 setTimeout(()=>clearInterval(timer),8000);
})();
