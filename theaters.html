<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>全国映画館 | CINEMAP</title>
<style>
:root{--bg:#0d0e10;--panel:#15171b;--panel2:#1d2025;--text:#f2f3f5;--muted:#9da3ad;--line:#2a2e35;--accent:#ef3f3f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:0 18px}.top{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.08em}.brandA{position:relative;display:inline-block}.brandA:after{content:"";position:absolute;width:0;height:0;border-top:3px solid transparent;border-bottom:3px solid transparent;border-left:5px solid var(--accent);left:50%;top:56%;transform:translate(-42%,-50%)}a{color:inherit;text-decoration:none}
.hero{padding:34px 0 18px}.hero h1{font-size:30px;margin:0 0 8px}.hero p,.small{color:var(--muted);font-size:13px;line-height:1.6}.search{display:flex;gap:8px;margin:14px 0 10px}.search input{flex:1;background:var(--panel);border:1px solid var(--line);color:#fff;border-radius:6px;padding:12px;font:inherit}.meta{color:var(--muted);font-size:12px;margin:4px 0 18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}.card h2{font-size:16px;margin:0 0 6px}.place{font-size:12px;color:#d9dde3;line-height:1.5}.btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.btn{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-weight:700;font-size:12px}.note{margin:20px 0 36px;color:var(--muted);font-size:12px;line-height:1.7}.empty{grid-column:1/-1;padding:38px 12px;text-align:center;color:var(--muted)}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:25px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="wrap top"><a class="brand" href="index.html">CINEM<span class="brandA">A</span>P</a><a href="rankings.html" class="small">ランキング</a></div></header>
<main class="wrap">
<section class="hero"><h1>全国映画館</h1><p>全国の映画館を検索できます。映画館マスタはWikidataのCC0データを利用し、上映時刻は転載せず公式サイトへ案内します。</p></section>
<div class="search"><input id="q" placeholder="映画館名・住所・地域で検索"></div>
<div class="meta" id="meta">読み込み中…</div>
<div class="grid" id="grid"></div>
<div class="note">データ源：Wikidata（CC0）。映画館名・所在地・公式URL等はWikidata登録内容に基づきます。閉館・移転・名称変更が反映されていない場合があります。上映時刻は各映画館の公式サイトでご確認ください。<br><a href="credits.html" style="color:var(--accent)">Credits / Data Sources</a></div>
</main>
<script>
const $=s=>document.querySelector(s);
let theaters=[];
async function backend(){
  try{
    const r=await fetch("data/backend.json?"+Date.now(),{cache:"no-store"});
    if(!r.ok)return null;
    const c=await r.json();
    return c&&c.enabled&&c.base_url?String(c.base_url).replace(/\/$/,""):null
  }catch(e){return null}
}
function mapsUrl(t){
  const q=[t.name,t.address,t.prefecture].filter(Boolean).join(" ");
  return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q)
}
function render(){
  const q=$("#q").value.trim().toLowerCase();
  const list=theaters.filter(t=>{
    if(!q)return true;
    return [t.name,t.prefecture,t.municipality,t.address].filter(Boolean).join(" ").toLowerCase().includes(q)
  }).slice(0,300);
  $("#meta").textContent=(q?list.length+"件表示 / ":"")+theaters.length+"館収録";
  $("#grid").innerHTML=list.length?list.map(t=>{
    const place=[t.prefecture,t.municipality,t.address].filter(Boolean).join(" ");
    return '<article class="card"><h2>'+escapeHtml(t.name||"名称未登録")+'</h2><div class="place">'+escapeHtml(place||"所在地未登録")+'</div><div class="btns">'+
      (t.website?'<a class="btn" target="_blank" rel="noopener noreferrer" href="'+escapeAttr(t.website)+'">公式サイト </a>':'')+
      '<a class="btn" target="_blank" rel="noopener noreferrer" href="'+mapsUrl(t)+'">地図 </a>'+
      (t.source_url?'<a class="btn" target="_blank" rel="noopener noreferrer" href="'+escapeAttr(t.source_url)+'">Wikidata </a>':'')+
      '</div></article>'
  }).join(""):'<div class="empty">該当する映画館がありません</div>'
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function escapeAttr(v){return escapeHtml(v)}
async function boot(){
  const base=await backend();
  try{
    let r;
    if(base)r=await fetch(base+"/api/theater-directory",{cache:"no-store"});
    if(!r||!r.ok)r=await fetch("data/theaters_master.json?"+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("load failed");
    const d=await r.json();
    theaters=d.theaters||[];
    render()
  }catch(e){
    $("#meta").textContent="映画館データを読み込めませんでした";
    $("#grid").innerHTML='<div class="empty">データ更新後に再度お試しください</div>'
  }
}
$("#q").addEventListener("input",render);
boot();
</script></body></html>
